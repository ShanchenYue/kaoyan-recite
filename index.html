<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>考研训练营</title>
<style>
:root {
  --bg: #0f0f1a;
  --card: #1a1a2e;
  --card2: #232340;
  --accent: #ff6b6b;
  --accent2: #4ecdc4;
  --text: #e8e8f0;
  --muted: #8888a0;
  --border: #333355;
}
/* ☀️ 日间模式 */
html[data-theme="light"] {
  --bg: #f3f6fc;
  --card: #ffffff;
  --card2: #eef2fa;
  --accent: #e8564f;
  --accent2: #0f9d8f;
  --text: #202638;
  --muted: #6b7385;
  --border: #dbe2ef;
}
html[data-theme="light"] .now-playing {
  background: linear-gradient(135deg, #ffffff 0%, #eef4ff 100%);
  box-shadow: 0 4px 18px rgba(31, 45, 80, .06);
}
html[data-theme="light"] .controls {
  box-shadow: 0 -6px 24px rgba(31, 45, 80, .08);
}
html[data-theme="light"] .toast { background: rgba(32, 38, 56, .92); }
html[data-theme="light"] .btn.play { box-shadow: 0 4px 18px rgba(232, 86, 79, .28); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, "PingFang SC", "MiSans", "Microsoft YaHei", sans-serif;
  overflow-x: hidden; }
body { min-height: 100vh; padding-bottom: 140px; }

/* ───── 顶部 ───── */
.header {
  position: sticky; top: 0; z-index: 100;
  background: linear-gradient(180deg, var(--card) 0%, var(--bg) 100%);
  padding: 16px 14px 10px; backdrop-filter: blur(10px);
}
.header h1 { margin: 0; font-size: 18px; font-weight: 600; text-align: center; }
.header .sub { text-align: center; color: var(--muted); font-size: 12px; margin-top: 2px; }

/* ───── 选择区 ───── */
.section { padding: 12px 14px; }
.section-title {
  font-size: 13px; color: var(--muted); margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.section-title::before {
  content: ''; width: 3px; height: 14px;
  background: var(--accent); border-radius: 2px;
}

.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  padding: 8px 14px; border-radius: 20px;
  background: var(--card); border: 1px solid var(--border);
  color: var(--text); font-size: 14px; cursor: pointer;
  transition: all .2s; user-select: none;
}
.pill.active {
  background: linear-gradient(135deg, var(--accent), #ff8e53);
  border-color: transparent; color: #fff; font-weight: 600;
}
.pill.disabled { opacity: .4; pointer-events: none; }
.pill .count {
  display: inline-block; margin-left: 4px;
  font-size: 11px; opacity: .7;
}

/* 子分类下拉 */
.sub-select-wrap { position: relative; }
.sub-select {
  width: 100%; padding: 10px 12px; font-size: 14px;
  background: var(--card); border: 1px solid var(--border);
  color: var(--text); border-radius: 10px; appearance: none;
}

/* ───── 当前播放 ───── */
.now-playing {
  margin: 12px 14px; padding: 16px; border-radius: 14px;
  background: linear-gradient(135deg, #2a2a4a 0%, #1a1a2e 100%);
  border: 1px solid var(--border);
  min-height: 120px;
}
.now-playing .label { font-size: 12px; color: var(--muted); }
.now-playing .meta { font-size: 13px; color: var(--accent2); margin-top: 4px; }
.now-playing .text {
  font-size: 16px; line-height: 1.7; margin-top: 10px;
  max-height: 160px; overflow-y: auto; white-space: pre-wrap;
}
.now-playing .progress-bar {
  margin-top: 10px; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden;
}
.now-playing .progress-fill {
  height: 100%; background: var(--accent); width: 0%;
  transition: width .3s;
}

/* ───── 控制栏 ───── */
.controls {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--card); border-top: 1px solid var(--border);
  padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
  z-index: 200;
}
.controls .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.controls .row + .row { margin-top: 10px; }

.btn {
  width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--card2);
  color: var(--text); font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.btn:active { transform: scale(.92); background: var(--accent); }
.btn.play {
  width: 60px; height: 60px; font-size: 24px;
  background: linear-gradient(135deg, var(--accent), #ff8e53);
  border: none; box-shadow: 0 4px 20px rgba(255,107,107,.4);
}
.btn.play:active { transform: scale(.92); }
.btn .ic { font-style: normal; }

.btn-group { display: flex; gap: 6px; align-items: center; }
.btn.small { width: 36px; height: 36px; font-size: 13px; border-radius: 10px; }
.btn.speed { width: auto; padding: 0 12px; border-radius: 18px; font-size: 13px; font-weight: 600; }
.btn.mode { font-size: 11px; width: 42px; height: 42px; border-radius: 12px; }

/* 模式激活 */
.btn.active-mode {
  background: var(--accent); border-color: var(--accent);
}

/* 音量/总进度 */
.info-text { font-size: 12px; color: var(--muted); min-width: 60px; text-align: center; }

/* ───── 列表 ───── */
.list { padding: 0 14px; }
.list-item {
  padding: 12px; background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; margin-bottom: 8px; cursor: pointer;
  transition: all .15s;
}
.list-item.active {
  background: var(--card2); border-color: var(--accent);
}
.list-item .idx { font-size: 11px; color: var(--muted); }
.list-item .ls { font-size: 14px; margin-top: 6px; line-height: 1.6;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden; }

/* 空状态 */
.empty { padding: 40px; text-align: center; color: var(--muted); }

/* 加载 */
.loading {
  position: fixed; inset: 0; background: var(--bg); z-index: 999;
  display: flex; align-items: center; justify-content: center; flex-direction: column;
}
.loading .spinner {
  width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 1s linear infinite;
}
.loading p { margin-top: 12px; color: var(--muted); }
@keyframes spin { to { transform: rotate(360deg); } }

/* toast */
.toast {
  position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,.85); color: #fff; padding: 10px 20px; border-radius: 20px;
  font-size: 14px; z-index: 1000; opacity: 0; pointer-events: none;
  transition: opacity .3s;
}
.toast.show { opacity: 1; }

/* 页脚说明 */
.footer-note {
  text-align: center; color: var(--muted); font-size: 11px;
  padding: 20px;
}

/* 主题切换 */
.theme-btn {
  position: absolute; right: 14px; top: 14px; width: 36px; height: 36px;
  border-radius: 50%; border: 1px solid var(--border); background: var(--card2);
  color: var(--text); font-size: 16px; cursor: pointer; z-index: 3;
}
/* 当前内容操作 */
.np-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.np-btn {
  padding: 6px 12px; border-radius: 16px; border: 1px solid var(--border);
  background: var(--card2); color: var(--text); font-size: 12px;
  font-family: inherit; cursor: pointer;
}
.np-btn.on { color: var(--accent); border-color: var(--accent); background: rgba(255,107,107,.12); }
.np-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
/* 列表项操作按钮 */
.li-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.li-btns { display: flex; gap: 6px; }
.mini {
  width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card2); color: var(--text); font-size: 12px; line-height: 1;
  cursor: pointer; padding: 0;
}
.mini.on { color: #f5b301; border-color: #f5b301; }
.fav-pill { border-color: rgba(245,179,1,.55); }

/* ── 平板 / 横屏适配 ── */
@media (min-width: 820px) {
  .header, .section, .now-playing, .list, .footer-note {
    max-width: 980px; margin-left: auto; margin-right: auto;
  }
  .header h1 { font-size: 23px; }
  .header .sub { font-size: 13px; }
  .now-playing { padding: 20px 22px; }
  .controls {
    max-width: 980px; margin: 0 auto; border-radius: 18px 18px 0 0;
    border-left: 1px solid #2a2a44; border-right: 1px solid #2a2a44;
  }
  .book-item { padding: 13px 16px; }
}
@media (orientation: landscape) and (max-height: 560px) {
  .header { padding: 8px 14px 6px; }
  .header h1 { font-size: 17px; }
  .header .sub { display: none; }
  .header a { margin-top: 2px !important; }
  .now-playing { min-height: 84px; padding: 12px 14px; }
  .loading p { display: none; }
}
</style>
</head>
<body>
<script>(function(){try{document.documentElement.dataset.theme=localStorage.getItem('kaoyan_theme')||'dark';}catch(e){}})();</script>
<script src="auth.js"></script>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <p>加载资料中...</p>
</div>

<div class="header">
  <h1>🎧 考研训练营</h1>
  <button class="theme-btn" id="btnTheme" title="切换日间/夜间模式">🌙</button>
  <div class="sub">听 · 背 · 练 一体化 · 制作人 LZH</div>
  <a href="quiz.html" style="display:block;text-align:center;margin-top:8px;text-decoration:none">
    <span style="display:inline-block;padding:7px 18px;border-radius:20px;font-size:13px;
      background:linear-gradient(135deg,#4ecdc4,#44a08d);color:#fff;font-weight:600">
      📝 进入刷题训练营（挖空 / 选择 / 单词 / 填空 / 真题大题）
    </span>
  </a>
  <a href="plan.html" style="display:block;text-align:center;margin-top:6px;text-decoration:none">
    <span style="display:inline-block;padding:7px 18px;border-radius:20px;font-size:13px;
      background:linear-gradient(135deg,#3ec9b0,#2f7fd8);color:#fff;font-weight:600">
      📅 30天背诵计划 · 今日打卡
    </span>
  </a>
</div>

<!-- 书籍选择 -->
<div class="section">
  <div class="section-title">选择资料</div>
  <div class="pills" id="bookPills"></div>
</div>

<!-- 子分类筛选 -->
<div class="section" id="subSection" style="display:none">
  <div class="section-title">筛选子类 (可多选)</div>
  <div class="pills" id="subPills"></div>
</div>

<!-- 当前播放 -->
<div class="now-playing">
  <div class="np-head">
    <div class="label">当前内容</div>
    <button class="np-btn" id="npFav">☆ 收藏</button>
  </div>
  <div class="meta" id="nowMeta">—</div>
  <div class="text" id="nowText">点击下方任意一条查看全文；需要听时再按「播放本条」</div>
  <div class="np-actions">
    <button class="np-btn" id="npPlay">🔊 播放本条音频</button>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>

<!-- 知识点列表 -->
<div class="section">
  <div class="section-title">知识点列表 <span id="listCount" style="color:var(--accent2);font-size:12px"></span></div>
</div>
<div class="list" id="list"></div>

<div class="footer-note">
  💡 支持浏览器后台播放 / 锁屏时可能需保持屏幕常亮<br>
  语音引擎由系统提供 · 首次使用会提示授权
</div>

<!-- 底部控制栏 -->
<div class="controls">
  <div class="row">
    <div class="btn-group">
      <button class="btn small" id="btnList" title="列表">📋</button>
    </div>
    <div class="btn-group" style="flex:1;justify-content:center">
      <button class="btn" id="btnPrev" title="上一条"><span class="ic">⏮</span></button>
      <button class="btn play" id="btnPlay" title="播放/暂停"><span class="ic" id="playIc">▶</span></button>
      <button class="btn" id="btnNext" title="下一条"><span class="ic">⏭</span></button>
    </div>
    <div class="info-text" id="idxInfo">0/0</div>
  </div>
  <div class="row">
    <div class="btn-group">
      <button class="btn speed" id="btnSpeed" title="倍速">1.0x</button>
      <button class="btn speed" id="btnGap" title="段落停顿">自然</button>
    </div>
    <div class="btn-group" style="flex:1;justify-content:center">
      <button class="btn small" id="btnReplay" title="重说">🔁</button>
      <button class="btn small" id="btnStop" title="停止">⏹</button>
    </div>
    <div class="btn-group">
      <button class="btn mode active-mode" data-mode="seq" title="顺序">顺序</button>
      <button class="btn mode" data-mode="shuffle" title="乱序">乱序</button>
      <button class="btn mode" data-mode="rand" title="随机">随机</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ─────────────────────────────────────
 *  原生 TTS Bridge (Android) + WebView 回退
 * ───────────────────────────────────── */
let nativeTTSReady = false;
let ttsUtteranceSeq = 0;  // 唯一 ID, 用于匹配 Java 回调
let currentTTSId = null;
let debugMode = true;  // 显示调试面板

// Java 侧通知 TTS 就绪
function onNativeTTSReady() {
  nativeTTSReady = true;
  if (debugMode) setDebugStatus('✅ 原生 AndroidTTS Bridge 就绪');
  console.log('✅ 原生 AndroidTTS Bridge 就绪');
}
// Java 侧通知 TTS 播完 → 自动下一条
function onNativeTTSDone(utteranceId) {
  if (utteranceId !== currentTTSId) return;
  state.isPlaying = false;
  setPlayIcon();
  document.getElementById('progressFill').style.width = '100%';
  renderList();
  currentTTSId = null;
  if (debugMode) setDebugStatus(`✅ onNativeTTSDone(${utteranceId})`);
  if (state.wasPaused) return;
  autoNextSeg();
}
function onNativeTTSError(utteranceId) {
  if (utteranceId !== currentTTSId) return;
  if (debugMode) setDebugStatus(`❌ onNativeTTSError(${utteranceId})`);
  console.warn('[NativeTTS] error:', utteranceId);
  state.isPlaying = false;
  setPlayIcon();
  currentTTSId = null;
}

function setDebugStatus(msg) {
  console.log('[TTS]', msg);
}

// 安全包装 speechSynthesis (WebView 回退用)
function trySS(fn) { try { if ('speechSynthesis' in window) return fn(); } catch(e) {} return null; }

/* ─────────────────────────────────────
 *  状态
 * ───────────────────────────────────── */
const state = {
  data: null,
  bookIdx: 0,
  selectedSubs: null,   // null = 全部, [] = 空, [...] = 指定
  flatList: [],          // 当前筛选后的段落 [{sub, text}]
  queue: [],             // 播放顺序(索引)
  queuePos: 0,
  mode: 'seq',           // seq / shuffle / rand
  speed: 1.0,
  voices: [],
  useAudio: true,        // 优先使用预生成音频
  pauseGap: 900,         // 段落间停顿(ms)
  audioEl: new Audio(),
  audioAvailable: false
};

const LS_KEY = 'kaoyan_player_v2';
const FAV_KEY = 'kaoyan_fav_v1';
state.favMode = false;   // 是否在「收藏夹」视图

/* ── 收藏夹 ── */
function favList() {
  try { return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); } catch(e) { return []; }
}
function saveFav(arr) {
  const s = JSON.stringify(arr);
  if (window.KYStore) KYStore.save(FAV_KEY, s);
  else try { localStorage.setItem(FAV_KEY, s); } catch(e) {}
}
function segFavId(seg) {
  if (seg.audio) return seg.audio;
  const t = (seg.text || '').slice(0, 60);
  return 't:' + (seg._book || '') + '|' + t;
}
function isFav(seg) {
  const id = segFavId(seg);
  return favList().some(f => f.id === id);
}
function toggleFav(seg, bookName) {
  let arr = favList();
  const id = segFavId(seg);
  const i = arr.findIndex(f => f.id === id);
  if (i >= 0) {
    arr.splice(i, 1);
    toast('已取消收藏');
  } else {
    arr.push({
      id,
      book: bookName || seg._book || (state.data.books[state.bookIdx] || {}).main_category || '',
      sub: seg.sub || '',
      text: seg.text || '',
      audio: seg.audio || ''
    });
    toast('已加入收藏夹');
  }
  saveFav(arr);
}

/* ── 日间 / 夜间主题 ── */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  const btn = document.getElementById('btnTheme');
  if (btn) btn.textContent = t === 'light' ? '☀️' : '🌙';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', t === 'light' ? '#f3f6fc' : '#1a1a2e');
  try { localStorage.setItem('kaoyan_theme', t); } catch(e) {}
}
function toggleTheme() {
  applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
}

/* ─────────────────────────────────────
 *  初始化
 * ───────────────────────────────────── */
async function init() {
  try {
    // 加载数据
    if (window.__APP_DATA__) {
      // Android APK 内联模式
      state.data = window.__APP_DATA__;
    } else {
      // 本地服务器模式 (开发用)
      const r = await fetch('data.json', { cache: 'no-store' });
      state.data = await r.json();
    }

    if (!state.data || !state.data.books) {
      throw new Error('数据为空');
    }

    // 加载语音列表 (WebView 里 speechSynthesis 可能不存在)
    try { loadVoices(); } catch(e) { console.warn('loadVoices 失败:', e); }
    try {
      if (speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoices;
      }
    } catch(e) {}

    // 恢复状态
    try { loadState(); } catch(e) { console.warn('loadState 失败:', e); }

    // 深度链接：plan.html → index.html?book=3&seg=123[&play=1]
    const params = new URLSearchParams(location.search);
    const dlBook = parseInt(params.get('book'), 10);
    const dlSeg = parseInt(params.get('seg'), 10);
    if (!isNaN(dlBook) && state.data.books[dlBook]) {
      state.bookIdx = dlBook;
      state.favMode = false;
      state.selectedSubs = null;
      state.queuePos = 0;
    }

    // 渲染UI
    renderBookPills();
    renderSubPills();
    rebuildQueue();
    renderList();
    showCurrent();

    // 定位到指定段落
    if (!isNaN(dlSeg) && dlSeg >= 0 && state.flatList[dlSeg]) {
      let qi = state.queue.indexOf(dlSeg);
      if (qi < 0) { state.queue.push(dlSeg); qi = state.queue.length - 1; }
      state.queuePos = qi;
      updateIdxInfo();
      renderList();
      showCurrent();
      if (params.get('play') === '1') playSegment();
    }

  } catch(e) {
    console.error('❌ init 失败:', e);
    alert('初始化失败: ' + e.message);
  }

  // 无论如何都要隐藏 loading
  hideLoading();

  // 页面可见性变化 → 暂停/恢复
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { /* 后台继续播 */ }
  });
}

function loadVoices() {
  try {
    if (!('speechSynthesis' in window)) { state.voices = []; return; }
    state.voices = speechSynthesis.getVoices().filter(v =>
      v.lang && (v.lang.toLowerCase().startsWith('zh') || v.name && (v.name.includes('Chinese') || v.name.includes('普通话') || v.name.includes('中文')))
    );
  } catch(e) { state.voices = []; }
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
    if (s.bookIdx != null) state.bookIdx = s.bookIdx;
    if (s.selectedSubs != null) state.selectedSubs = s.selectedSubs;
    if (s.mode) state.mode = s.mode;
    if (s.speed) state.speed = s.speed;
    if (s.queuePos != null) state.queuePos = s.queuePos;
    if (s.pauseGap) state.pauseGap = s.pauseGap;
  } catch(e) {}
}
function saveState() {
  var data = JSON.stringify({
    bookIdx: state.bookIdx,
    selectedSubs: state.selectedSubs,
    mode: state.mode,
    speed: state.speed,
    queuePos: state.queuePos,
    pauseGap: state.pauseGap
  });
  if (window.KYStore) KYStore.save(LS_KEY, data);
  else try { localStorage.setItem(LS_KEY, data); } catch(e) {}
}

/* ─────────────────────────────────────
 *  UI 渲染
 * ───────────────────────────────────── */
function hideLoading() {
  document.getElementById('loading').style.display = 'none';
}

function renderBookPills() {
  const wrap = document.getElementById('bookPills');
  wrap.innerHTML = '';
  // 收藏夹入口
  const favEl = document.createElement('div');
  favEl.className = 'pill fav-pill' + (state.favMode ? ' active' : '');
  favEl.innerHTML = `⭐ 收藏夹<span class="count">${favList().length}</span>`;
  favEl.onclick = () => {
    state.favMode = true;
    state.selectedSubs = null;
    state.queuePos = 0;
    stopAll();
    renderBookPills();
    renderSubPills();
    rebuildQueue();
    renderList();
    showCurrent();
    saveState();
  };
  wrap.appendChild(favEl);

  state.data.books.forEach((b, i) => {
    if (b.is_scanned) return; // 跳过扫描版
    const el = document.createElement('div');
    el.className = 'pill' + (!state.favMode && i === state.bookIdx ? ' active' : '');
    el.innerHTML = `${b.main_category}<span class="count">${b.total_segments}</span>`;
    el.onclick = () => {
      state.favMode = false;
      state.bookIdx = i;
      state.selectedSubs = null;
      state.queuePos = 0;
      stopAll();
      renderBookPills();
      renderSubPills();
      rebuildQueue();
      renderList();
      showCurrent();
      saveState();
    };
    wrap.appendChild(el);
  });
}

function renderSubPills() {
  const wrap = document.getElementById('subPills');
  if (state.favMode) {
    document.getElementById('subSection').style.display = 'none';
    return;
  }
  const book = state.data.books[state.bookIdx];
  if (!book || !book.sub_categories.length) {
    document.getElementById('subSection').style.display = 'none';
    return;
  }
  document.getElementById('subSection').style.display = 'block';
  wrap.innerHTML = '';

  // "全部"按钮
  const allBtn = document.createElement('div');
  allBtn.className = 'pill' + (state.selectedSubs === null ? ' active' : '');
  allBtn.innerHTML = `全部<span class="count">${book.total_segments}</span>`;
  allBtn.onclick = () => {
    state.selectedSubs = null;
    renderSubPills();
    rebuildQueue(); renderList(); saveState();
  };
  wrap.appendChild(allBtn);

  book.sub_categories.forEach(sub => {
    const el = document.createElement('div');
    const selected = state.selectedSubs && state.selectedSubs.includes(sub.name);
    el.className = 'pill' + (selected ? ' active' : '');
    el.innerHTML = `${sub.name}<span class="count">${sub.count}</span>`;
    el.onclick = () => {
      if (!state.selectedSubs) state.selectedSubs = [];
      const idx = state.selectedSubs.indexOf(sub.name);
      if (idx >= 0) state.selectedSubs.splice(idx, 1);
      else state.selectedSubs.push(sub.name);
      renderSubPills();
      rebuildQueue(); renderList(); saveState();
    };
    wrap.appendChild(el);
  });
}

function rebuildQueue() {
  const book = state.data.books[state.bookIdx];

  // 收藏夹视图：跨书籍播放
  if (state.favMode) {
    state.flatList = favList().map(f => ({
      sub: f.sub || '', text: f.text || '', audio: f.audio || '',
      _book: f.book || '收藏夹', _fav: true
    }));
    state.audioAvailable = state.flatList.some(s => s.audio);
    state.queue = state.flatList.map((_, i) => i);
    state.queuePos = Math.min(state.queuePos, Math.max(0, state.queue.length - 1));
    if (state.queuePos < 0) state.queuePos = 0;
    applyMode(state.mode);
    updateIdxInfo();
    return;
  }

  let subs = state.selectedSubs;
  if (!subs || subs.length === 0) subs = null;

  // 构建 flatList (当前筛选结果)
  state.flatList = [];
  if (subs === null) {
    state.flatList = book.segments.slice();
  } else {
    const allowed = new Set(subs);
    state.flatList = book.segments.filter(s => allowed.has(s.sub));
  }

  // 检查这本书是否有音频
  state.audioAvailable = state.flatList.some(s => s.audio);

  // 移除「挖空已掌握」对应的音频 (可在训练页恢复)
  try {
    const mastered = JSON.parse(localStorage.getItem('kaoyan_mastered_audio') || '[]');
    if (mastered.length) {
      const set = new Set(mastered);
      const before = state.flatList.length;
      state.flatList = state.flatList.filter(s => !s.audio || !set.has(s.audio));
      if (state.flatList.length !== before) {
        console.log(`[掌握过滤] ${before - state.flatList.length} 条已掌握音频被移除`);
      }
    }
  } catch (e) {}

  // queue: 索引列表
  state.queue = state.flatList.map((_, i) => i);
  state.queuePos = Math.min(state.queuePos, state.queue.length - 1);
  if (state.queuePos < 0) state.queuePos = 0;

  applyMode(state.mode);
  updateIdxInfo();
}

function applyMode(mode) {
  state.mode = mode;
  document.querySelectorAll('.btn.mode').forEach(b => {
    b.classList.toggle('active-mode', b.dataset.mode === mode);
  });
  if (mode === 'shuffle') {
    // Fisher-Yates 洗牌
    for (let i = state.queue.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [state.queue[i], state.queue[j]] = [state.queue[j], state.queue[i]];
    }
  }
  saveState();
}

function updateIdxInfo() {
  const total = state.queue.length;
  const cur = state.queue[state.queuePos] != null ? state.queue[state.queuePos] + 1 : 0;
  document.getElementById('idxInfo').textContent = `${cur}/${total}`;
  document.getElementById('listCount').textContent = `· 共 ${total} 条`;
}

function esc(s) {
  return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

/* 选中一条：只显示文字，不自动播放 */
function selectSegment(flatIdx, autoplay) {
  const qi = state.queue.indexOf(flatIdx);
  if (qi >= 0) state.queuePos = qi;
  else { state.queue.push(flatIdx); state.queuePos = state.queue.length - 1; }
  state.wasPaused = false;
  stopOutputOnly();
  updateIdxInfo();
  renderList();
  showCurrent();
  saveState();
  if (autoplay) playSegment();
}

/* 刷新「当前内容」卡片（不触发音频） */
function showCurrent() {
  const seg = getCurrentText();
  const meta = document.getElementById('nowMeta');
  const txt = document.getElementById('nowText');
  const favBtn = document.getElementById('npFav');
  if (!seg) {
    meta.textContent = '—';
    txt.textContent = '点击下方任意一条查看全文；需要听时再按「播放本条」';
    if (favBtn) { favBtn.textContent = '☆ 收藏'; favBtn.classList.remove('on'); }
    return;
  }
  const bookName = seg._book || (state.data.books[state.bookIdx] || {}).main_category || '';
  meta.textContent = (state.favMode ? '⭐ 收藏夹 · ' : '🎧 ' + bookName + ' · ') +
    (seg.sub || '未分类') + ` · #${state.queuePos + 1}/${state.queue.length}`;
  txt.textContent = seg.text || '';
  document.getElementById('progressFill').style.width = '0%';
  if (favBtn) {
    const on = isFav(seg);
    favBtn.textContent = on ? '★ 已收藏' : '☆ 收藏';
    favBtn.classList.toggle('on', on);
  }
}

function renderList() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  if (state.flatList.length === 0) {
    list.innerHTML = '<div class="empty">' +
      (state.favMode ? '收藏夹还是空的<br>在任意知识点右上角点 ☆ 即可收藏' : '当前筛选下没有知识点') +
      '</div>';
    return;
  }
  const favSet = new Set(favList().map(f => f.id));
  state.flatList.forEach((seg, i) => {
    const active = i === state.queue[state.queuePos];
    const fav = favSet.has(segFavId(seg));
    const el = document.createElement('div');
    el.className = 'list-item' + (active ? ' active' : '');
    el.innerHTML = `<div class="li-head">
        <div class="idx">#${i+1} · ${esc(seg.sub || '未分类')}${seg._book ? ' · ' + esc(seg._book) : ''}</div>
        <div class="li-btns">
          <button class="mini" data-act="play" title="播放">▶</button>
          <button class="mini ${fav ? 'on' : ''}" data-act="fav" title="收藏">${fav ? '★' : '☆'}</button>
        </div>
      </div>
      <div class="ls">${esc(seg.text)}</div>`;
    el.onclick = () => selectSegment(i, false);
    el.querySelector('[data-act="play"]').onclick = (e) => {
      e.stopPropagation();
      selectSegment(i, true);
    };
    el.querySelector('[data-act="fav"]').onclick = (e) => {
      e.stopPropagation();
      const bookName = seg._book || (state.favMode ? '收藏夹' : (state.data.books[state.bookIdx] || {}).main_category);
      toggleFav(seg, bookName);
      if (state.favMode) rebuildQueue();
      renderBookPills();
      renderList();
      showCurrent();
    };
    list.appendChild(el);
  });
}

/* ─────────────────────────────────────
 *  语音播放
 * ───────────────────────────────────── */
function getCurrentText() {
  const flatIdx = state.queue[state.queuePos];
  if (flatIdx == null) return null;
  return state.flatList[flatIdx];
}

function pickVoice() {
  try {
    if (!('speechSynthesis' in window)) return null;
    const v = state.voices[0] || speechSynthesis.getVoices()[0];
    return v || null;
  } catch(e) { return null; }
}

/* ─────────────────────────────────────
 *  播放状态机 (彻底重写)
 *  状态: { currentMode, isPlaying, wasPaused }
 * ───────────────────────────────────── */
state.currentMode = null;   // 'audio' | 'tts' | null
state.isPlaying = false;     // 当前是否在输出声音
state.wasPaused = false;     // 是否被用户暂停过 (用于 resume 判断)
state.autoNextTimer = null;  // setTimeout 句柄, 段落间停顿

// UI helpers
function setPlayIcon() {
  document.getElementById('playIc').textContent = state.isPlaying ? '❚❚' : '▶';
}
function clearAutoNext() {
  if (state.autoNextTimer) { clearTimeout(state.autoNextTimer); state.autoNextTimer = null; }
}

// 初始化 audio 事件 —— 只更新状态, 不触发 next/playCurrent
(function initAudioState() {
  const a = state.audioEl;
  a.preload = 'metadata';
  // play 事件: 真正开始出声
  a.addEventListener('play', () => {
    state.isPlaying = true;
    state.wasPaused = false;
    setPlayIcon();
  });
  // pause 事件: 暂停 (用户手动 or 调用 pause())
  a.addEventListener('pause', () => {
    // 只有在非 ended 情况下认为是"暂停中"
    state.wasPaused = !a.ended;
    state.isPlaying = false;
    setPlayIcon();
  });
  // ended 事件: 播完一条, 触发自动下一条
  a.addEventListener('ended', () => {
    state.isPlaying = false;
    state.wasPaused = false;
    document.getElementById('progressFill').style.width = '100%';
    setPlayIcon();
    renderList();
    clearAutoNext();
    state.autoNextTimer = setTimeout(autoNextSeg, state.pauseGap);
  });
  a.addEventListener('error', () => {
    if (!a.error) return;                    // 忽略清空 src 引起的伪错误
    console.warn('[audio] error:', a.currentSrc || a.src, 'code=', a.error.code);
    state.isPlaying = false;
    state.wasPaused = false;                 // 出错后允许再次点击重试
    setPlayIcon();
    state.audioErrStreak = (state.audioErrStreak || 0) + 1;
    if (state.audioErrStreak > 3) {
      clearAutoNext();
      toast('连续音频加载失败，已暂停，请检查网络或重新进入');
      return;
    }
    toast('音频加载失败，自动跳过');
    clearAutoNext();
    state.autoNextTimer = setTimeout(autoNextSeg, 1200);
  });
  a.addEventListener('playing', () => { state.audioErrStreak = 0; });
  a.addEventListener('timeupdate', () => {
    if (a.duration && !isNaN(a.duration)) {
      document.getElementById('progressFill').style.width =
        (a.currentTime / a.duration * 100) + '%';
    }
  });
})();

// 自动下一条 (区分顺序/乱序/随机)
function autoNextSeg() {
  clearAutoNext();
  if (!state.queue.length) return;
  if (state.mode === 'rand') {
    state.queuePos = Math.floor(Math.random() * state.flatList.length);
  } else {
    state.queuePos = (state.queuePos + 1) % state.queue.length;
  }
  updateIdxInfo();
  renderList();
  playSegment();
}

// 核心: 播放当前选中的那条 (v9: 强制 audio, 不回退 TTS)
function playSegment() {
  clearAutoNext();
  stopOutputOnly();
  state.wasPaused = false;

  const seg = getCurrentText();
  if (!seg) { toast('没有可播放内容'); return; }

  // 更新 UI（文字始终可见，与是否播放无关）
  showCurrent();

  // 强制 audio, 无 MP3 则提示
  if (seg.audio && seg.audio.length > 3) {
    playSegmentAudio(seg);
  } else {
    toast('该段落无 MP3 语音, 请先生成语音包');
  }
  saveState();
}

function playSegmentAudio(seg) {
  state.currentMode = 'audio';
  state.wasPaused = false;
  const a = state.audioEl;
  const myToken = (state.audioToken = (state.audioToken || 0) + 1);

  // 只有真正运行在 Android WebView 的 assets 里，才需要 android_asset 绝对路径；
  // 浏览器（http 或直接双击打开 file://）一律用相对路径
  const base = location.href.indexOf('/android_asset/') >= 0 ? 'file:///android_asset/' : '';
  let src = seg.audio || '';
  if (src && !/^[a-z][a-z0-9+.-]*:/i.test(src)) {
    src = base + src.replace(/^\/+/, '');
  }

  a.src = src;
  a.playbackRate = state.speed;
  a.play().catch(err => {
    if (state.audioToken !== myToken) return;   // 已切到其他段，忽略
    if (err && err.name === 'AbortError') return;
    console.warn('[audio] play() rejected:', err, 'src=', src);
    toast('音频播放失败: ' + ((err && err.message) || '加载错误'));
  });
}

// ─────────── TTS 播放 (优先原生 AndroidTTS Bridge, 回退 WebView speechSynthesis) ───────────

// 估算中文朗读时间 (毫秒, 3.5字/秒 ÷ rate)
function estimateTTSTime(text, rate) {
  if (!text) return 2000;
  const chars = text.replace(/\s+/g, '').length;
  const baseMs = (chars / 3.5) * 1000;
  const adjusted = baseMs / (rate || 1);
  return Math.max(1500, Math.round(adjusted));
}

function playSegmentTTS(seg) {
  state.currentMode = 'tts';
  state.audioEl.pause();
  state.audioEl.removeAttribute('src');

  // 生成唯一 ID
  ttsUtteranceSeq++;
  const utterId = 'seg_' + ttsUtteranceSeq;
  currentTTSId = utterId;

  if (window.AndroidTTS && AndroidTTS.isAvailable()) {
    // ─── 走原生 TTS Bridge ───
    AndroidTTS.stop();
    AndroidTTS.speak(seg.text, state.speed, utterId);
    state.isPlaying = true;
    state.wasPaused = false;
    setPlayIcon();
    document.getElementById('progressFill').style.width = '0%';
    clearAutoNext();
    // 原生 onDone 回调会自动触发下一条, 这里不设定时器
    // 但加个 2 倍时长的兜底超时, 防止 onDone 也丢了
    const safetyMs = estimateTTSTime(seg.text, state.speed) * 2 + 5000;
    state.autoNextTimer = setTimeout(() => {
      if (currentTTSId === utterId && state.isPlaying) {
        console.warn('[NativeTTS] onDone 超时兜底, 手动切下一条');
        state.isPlaying = false;
        setPlayIcon();
        document.getElementById('progressFill').style.width = '100%';
        if (!state.wasPaused) autoNextSeg();
      }
    }, safetyMs);
    return;
  }

  // ─── 回退 WebView speechSynthesis (用估算时长定时器) ───
  if (typeof SpeechSynthesisUtterance === 'undefined' || !('speechSynthesis' in window)) {
    toast('当前环境不支持语音, 请使用 MP3 模式');
    return;
  }
  trySS(() => speechSynthesis.cancel());
  const utter = new SpeechSynthesisUtterance(seg.text);
  utter.lang = 'zh-CN';
  utter.rate = state.speed;
  utter.pitch = 1;
  const v = pickVoice();
  if (v) utter.voice = v;
  utter.onerror = () => { state.isPlaying = false; setPlayIcon(); };

  trySS(() => speechSynthesis.speak(utter));
  state.isPlaying = true;
  state.wasPaused = false;
  setPlayIcon();
  document.getElementById('progressFill').style.width = '0%';

  clearAutoNext();
  const segMs = estimateTTSTime(seg.text, state.speed);
  state.autoNextTimer = setTimeout(() => {
    state.isPlaying = false;
    setPlayIcon();
    document.getElementById('progressFill').style.width = '100%';
    renderList();
    if (state.wasPaused) return;
    autoNextSeg();
  }, segMs + state.pauseGap);
}

// 只停声音 (audio.pause + TTS stop), 不改队列/进度
function stopOutputOnly() {
  clearAutoNext();
  currentTTSId = null;  // 防止原生回调回来串乱
  if (window.AndroidTTS) { try { AndroidTTS.stop(); } catch(e) {} }
  trySS(() => speechSynthesis.cancel());
  try { state.audioEl.pause(); } catch(e) {}
  state.isPlaying = false;
  setPlayIcon();
}

// 彻底停止 (连"暂停状态"也清除, 下一次点击 play 就是从当前段从头来)
function stopAll() {
  stopOutputOnly();
  state.wasPaused = false;
  state.currentMode = null;
}

/* ─────────── 对外: togglePlay / next / prev / replay ─────────── */

function togglePlay() {
  if (state.isPlaying) {
    // 正在出声 → 暂停当前 mode
    if (state.currentMode === 'audio') {
      state.audioEl.pause();
      // pause 事件会设 state.wasPaused=true, state.isPlaying=false
    } else if (state.currentMode === 'tts') {
      // 原生 TTS 没有真正的 pause, 用 stop 代替
      if (window.AndroidTTS) { try { AndroidTTS.stop(); } catch(e) {} }
      trySS(() => speechSynthesis.pause());
      clearAutoNext();
      currentTTSId = null;
      state.isPlaying = false;
      state.wasPaused = true;
      setPlayIcon();
    }
    return;
  }

  // 没在出声
  if (state.wasPaused) {
    // 被暂停过 → 恢复
    if (state.currentMode === 'audio') {
      state.audioEl.play().catch(() => { /* src 失效就从头 play */ });
    } else if (state.currentMode === 'tts') {
      // WebView 的 speechSynthesis.resume() 经常不工作, 直接重播当前段
      state.wasPaused = false;
      playSegment();
      return;
    }
    return;
  }

  // 第一次点 play / 或刚 next 完 → 从头播当前段
  playSegment();
}

function next() {
  clearAutoNext();
  stopOutputOnly();
  if (!state.queue.length) { toast('没有可播放内容'); return; }
  if (state.mode === 'rand') {
    state.queuePos = Math.floor(Math.random() * state.flatList.length);
  } else {
    state.queuePos = (state.queuePos + 1) % state.queue.length;
  }
  state.wasPaused = false;
  state.currentMode = null;
  updateIdxInfo(); renderList(); playSegment();
}

function prev() {
  clearAutoNext();
  stopOutputOnly();
  if (!state.queue.length) { toast('没有可播放内容'); return; }
  state.queuePos = (state.queuePos - 1 + state.queue.length) % state.queue.length;
  state.wasPaused = false;
  state.currentMode = null;
  updateIdxInfo(); renderList(); playSegment();
}

function replay() {
  clearAutoNext();
  stopOutputOnly();
  state.wasPaused = false;
  state.currentMode = null;
  playSegment();
}


/* ─────────────────────────────────────
 *  倍速
 * ───────────────────────────────────── */
function cycleSpeed() {
  const speeds = [0.6, 0.8, 1.0, 1.2, 1.5, 1.8, 2.0];
  const cur = speeds.indexOf(state.speed);
  state.speed = speeds[(cur + 1) % speeds.length];
  document.getElementById('btnSpeed').textContent = state.speed.toFixed(1) + 'x';
  saveState();
  // 如果正在播: 音频改 playbackRate / TTS 重开
  if (state.currentMode === 'audio' && state.isPlaying) {
    state.audioEl.playbackRate = state.speed;
  } else if (state.isPlaying) {
    stopOutputOnly();
    playSegment();
  }
  toast(`倍速 ${state.speed}x`);
}

/* ─────────────────────────────────────
 *  段落停顿 (cycleGap)
 * ───────────────────────────────────── */
function cycleGap() {
  const gaps = [400, 700, 900, 1200, 1800, 2500];
  const cur = gaps.indexOf(state.pauseGap);
  state.pauseGap = gaps[(cur + 1) % gaps.length];
  const labels = {400:'紧凑', 700:'稍快', 900:'自然', 1200:'宽松', 1800:'长停', 2500:'深呼吸'};
  const btn = document.getElementById('btnGap');
  if (btn) btn.textContent = labels[state.pauseGap] || state.pauseGap + 'ms';
  saveState();
  toast(`段落停顿: ${labels[state.pauseGap]}`);
}

/* ─────────────────────────────────────
 *  toast
 * ───────────────────────────────────── */
let _toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 1200);
}

/* ─────────────────────────────────────
 *  事件绑定
 * ───────────────────────────────────── */
document.getElementById('btnPlay').onclick = togglePlay;
document.getElementById('btnNext').onclick = next;
document.getElementById('btnPrev').onclick = prev;
document.getElementById('btnSpeed').onclick = cycleSpeed;
document.getElementById('btnGap').onclick = cycleGap;
document.getElementById('btnReplay').onclick = replay;
document.getElementById('btnStop').onclick = stopAll;
document.querySelectorAll('.btn.mode').forEach(b => {
  b.onclick = () => {
    applyMode(b.dataset.mode);
    toast('模式: ' + b.textContent.trim());
  };
});
document.getElementById('btnList').onclick = () => {
  window.scrollTo({ top: document.querySelector('.list').offsetTop - 100, behavior: 'smooth' });
};
document.getElementById('npPlay').onclick = () => {
  if (!state.queue.length) { toast('没有可播放内容'); return; }
  if (state.isPlaying) { togglePlay(); return; }
  playSegment();
};
document.getElementById('npFav').onclick = () => {
  const seg = getCurrentText();
  if (!seg) { toast('请先选择一条'); return; }
  const bookName = seg._book || (state.favMode ? '收藏夹' : (state.data.books[state.bookIdx] || {}).main_category);
  toggleFav(seg, bookName);
  if (state.favMode) rebuildQueue();
  renderBookPills();
  renderList();
  showCurrent();
};
document.getElementById('btnTheme').onclick = toggleTheme;
applyTheme(document.documentElement.dataset.theme || 'dark');

// 初始化显示
document.getElementById('btnSpeed').textContent = state.speed.toFixed(1) + 'x';
const gapsLabel = {400:'紧凑', 700:'稍快', 900:'自然', 1200:'宽松', 1800:'长停', 2500:'深呼吸'};
document.getElementById('btnGap').textContent = gapsLabel[state.pauseGap] || '自然';

/* ─────────────────────────────────────
 *  启动
 * ───────────────────────────────────── */
init();

// 注册 Service Worker (PWA 支持, 可添加到主屏幕)
// 旧版本 SW 可能缓存了旧页面导致播放异常, 这里强制检查更新并在接管后自动刷新一次
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController) return;                       // 首次安装不刷新
    if (sessionStorage.getItem('sw_reloaded')) return; // 每次会话只刷新一次
    sessionStorage.setItem('sw_reloaded', '1');
    location.reload();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then(reg => { reg.update().catch(() => {}); })
      .catch(() => {});
  });
}
</script>
</body>
</html>
