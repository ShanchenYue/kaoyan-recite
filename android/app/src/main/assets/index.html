预测导论","text":"12.时间的特点是一维性。空间的特点是三维性。具体物质形态的时空是有限的，整个物质世界的时空是无限的。"},{"sub":"第一部分 马原重要考点预测导论","text":"13.世界发生的二重分化：人类改造世界的实践活动，使世界发生了二重分化，①从自然界中分化出人类社会②从客观世界中分化出主观世界"},{"sub":"第一部分 马原重要考点预测导论","text":"14.意识的起源：①意识是自然界长期发展的产物；②意识也是社会历史发展的产物，其中实践（劳动）起决定作用，语言起促进作用；意识的本质：①意识是人脑特有的机能；②意识是客观世界的主观映象。"},{"sub":"第一部分 马原重要考点预测导论","text":"15.实践是客观规律性与主观能动性统一的基础和根本途径。尊重客观规律是正确发挥主观能动性的前提。"},{"sub":"第一部分 马原重要考点预测导论","text":"16.所谓人工智能，就是把人的部分智能活动机器化，让机器具有完成某种复杂目标的能力，它实质上是对人脑组织结构与思维运行机制的模仿，是人类智能的物化。人工智能不能取代或超越人类智能。"},{"sub":"第一部分 马原重要考点预测导论","text":"17.联系的特点：客观性、普遍性、多样性、条件性"},{"sub":"第一部分 马原重要考点预测导论","text":"18.发展的实质：新事物的产生和旧事物的灭亡"},{"sub":"第一部分 马原重要考点预测导论","text":"19.新事物不可战胜的原因：①新事物具有新的结构和功能，②新事物是在旧事物的“母体”中孕育成熟的，并添加了旧事物所不能容纳的新内容，③新事物符合人民群众的利益。"},{"sub":"第一部分 马原重要考点预测导论","text":"20.对立统一规律是事物发展的根本规律、辩证法的本质和核心。"},{"sub":"第一部分 马原重要考点预测导论","text":"21.具体问题具体分析是马克思主义活的灵魂。"},{"sub":"第一部分 马原重要考点预测导论","text":"22.事物的性质是由主要矛盾的主要方面所决定的。"},{"sub":"第一部分 马原重要考点预测导论","text":"23.唯物辩证法是认识世界和改造世界的根本方法。唯物辩证法既包括客观辩证法也包括主观辩证法，主观辩证法是客观辩证法在人的思维中的反映。"},{"sub":"第一部分 马原重要考点预测导论","text":"24.实践的本质是人类能动地改造世界的社会性的物质活动。"},{"sub":"第一部分 马原重要考点预测导论","text":"25.实践的三个基本特征：①客观实在性（最基本）②自觉能动性③社会历史性"},{"sub":"第一部分 马原重要考点预测导论","text":"26.实践的基本结构（实践活动的三项基本要素）：①主体②客体③中介"},{"sub":"第一部分 马原重要考点预测导论","text":"27.实践的三种基本类型：①物质生产实践（最基本）②社会政治实践③科学文化实践"},{"sub":"第一部分 马原重要考点预测导论","text":"28.虚拟实践的特点：①交互性②开放性③间接性"},{"sub":"第一部分 马原重要考点预测导论","text":"29.实践的主体和客体相互作用的关系：①实践关系（最根本）②认识关系③价值关系"},{"sub":"第一部分 马原重要考点预测导论","text":"30.实践是认识产生和发展的基础、来源、动力、目的、唯一检验标准。"},{"sub":"第一部分 马原重要考点预测导论","text":"31.认识的本质是主体在实践基础上对客体的能动反映。"},{"sub":"第一部分 马原重要考点预测导论","text":"32.客观性是真理的本质属性；真理的客观性决定了真理的一元性。"},{"sub":"第一部分 马原重要考点预测导论","text":"33.实践是检验真理的唯一标准，是由真理的本性和实践的特点决定的。"},{"sub":"第一部分 马原重要考点预测导论","text":"34.实践是真理与价值统一的基础；价值尺度必须以真理尺度为前提。"},{"sub":"第一部分 马原重要考点预测导论","text":"35.认识世界的根本目的在于改造世界；认识必然和争取自由是人类认识世界和改造世界的根本目标。"},{"sub":"第一部分 马原重要考点预测导论","text":"36.一切从实际出发是马克思主义认识论的根本要求。"},{"sub":"第一部分 马原重要考点预测导论","text":"37.社会存在包括：①自然地理环境②人口因素③物质生产方式"},{"sub":"第一部分 马原重要考点预测导论","text":"38.生产方式是社会历史发展的决定力量，是人类社会赖以存在和发展的基础，是人类其他一切活动的首要前提。生产方式的变化发展决定整个社会历史的变化发展，决定社会形态从低级向高级的更替和发展。"},{"sub":"第一部分 马原重要考点预测导论","text":"39.社会意识具有相对独立性的三个表现：①不完全同步性和不平衡性②各种形式之间存在相互影响且各自具有历史继承性③社会意识对社会存在具有能动的反作用（最突出）"},{"sub":"第一部分 马原重要考点预测导论","text":"40.社会基本矛盾是历史发展的根本动力，是其他一切社会矛盾的根源。"},{"sub":"第一部分 马原重要考点预测导论","text":"41.生产力决定生产关系，生产关系反作用于生产力。经济基础决定上层建筑，上层建筑反作用于经济基础。"},{"sub":"第一部分 马原重要考点预测导论","text":"42.生产力是社会进步的根本内容，是衡量社会进步的根本尺度，是人类社会发展和进步的最终决定力量。"},{"sub":"第一部分 马原重要考点预测导论","text":"43.生产力的基本要素：①劳动资料，其中最重要的是生产工具（生产工具是区分社会经济时代的客观依据）②劳动对象③劳动者"},{"sub":"第一部分 马原重要考点预测导论","text":"44.劳动者是生产力中最活跃的因素，人才资源是第一资源。"},{"sub":"第一部分 马原重要考点预测导论","text":"45.科学技术是先进生产力的集中体现和主要标志，是第一生产力。"},{"sub":"第一部分 马原重要考点预测导论","text":"46.生产关系是社会关系中最基本的关系；在生产关系中，生产资料所有制关系是最基本的，是区分不同生产方式、判定社会经济结构性质的客观依据。"},{"sub":"第一部分 马原重要考点预测导论","text":"47.普遍交往是世界历史的基本特征。"},{"sub":"第一部分 马原重要考点预测导论","text":"48.人的发展从低级到高级的三个阶段：①人的依赖关系占统治地位的阶段②以物的依赖关系为基础的人的独立性的阶段③自由个性的阶段。人的发展最根本的是人的自由程度的提高。"},{"sub":"第一部分 马原重要考点预测导论","text":"49.社会形态更替的统一性和多样性，根源于社会发展的必然性与人们的历史选择性相统一的过程。"},{"sub":"第一部分 马原重要考点预测导论","text":"50.生产力与生产关系矛盾运动的规律性，从根本上规定了社会形态更替的客观必然性。"},{"sub":"第一部分 马原重要考点预测导论","text":"51.人们的历史选择性包含三层意思：①社会发展的客观必然性造成了一定历史阶段社会发2展的基本趋势，为人们的历史选择提供了基础、范围和可能性空间。②社会形态更替的过程也是一个主观能动性与客观规律性相统一的过程。③人们的历史选择性归根结底是人民群众的选择性。"},{"sub":"第一部分 马原重要考点预测导论","text":"52.人类文明具有多样性，每一种文明都是在特定的自然环境、历史背景、民族传统中生长起来的，体现着独特的生产生活交往方式，都是人类文明的重要组成部分。世界各国要尊重和保护文明多样性，推动不同文明交流对话、和平共处、和谐共生，以文明交流超越文明隔阂、文明互鉴超越文明冲突、文明共存超越文明优越，共同绘就人类文明美好画卷。"},{"sub":"第一部分 马原重要考点预测导论","text":"53.文化的重要意义：①提供思想指引②提供精神动力③提供凝聚力量"},{"sub":"第一部分 马原重要考点预测导论","text":"54.人的本质是一切社会关系的总和；社会属性是人的本质属性。"},{"sub":"第一部分 马原重要考点预测导论","text":"55.人民群众是社会历史的主体，是历史的创造者。这是马克思主义最基本的观点之一。"},{"sub":"第一部分 马原重要考点预测导论","text":"56.人民群众，从质上看，人民群众是指一切对社会历史发展起推动作用的人；从量上看，人民群众是指社会人口中的绝大多数。其中最稳定的主体部分始终是从事物质资料生产的劳动群众。"},{"sub":"第一部分 马原重要考点预测导论","text":"57.人民群众起着决定性的作用：①物质财富的创造者②精神财富的创造者③是社会变革的决定力量"},{"sub":"第一部分 马原重要考点预测导论","text":"58.历史人物是一定历史事件的主要倡导者、组织领导者或思想理论、科学文化的重要代表人物。历史人物对历史发展有深刻影响，甚至有时能够决定个别历史事件的结局。历史人物有些起着推动历史前进的进步作用，有些起着阻碍历史前进的反动作用。历史人物受到社会发展客观规律的制约，而不能决定和改变历史发展的总进程和总方向。"},{"sub":"第一部分 马原重要考点预测导论","text":"马克思主义政治经济学"},{"sub":"第一部分 马原重要考点预测导论","text":"59.使用价值是交换价值的物质承担者，价值是交换价值的基础，交换价值是价值的表现形式。"},{"sub":"第一部分 马原重要考点预测导论","text":"60.商品价值量是以简单劳动为尺度计量的，复杂劳动等于自乘的或多倍的简单劳动。复杂劳动转化为简单劳动，是在商品交换过程中自发实现的。"},{"sub":"第一部分 马原重要考点预测导论","text":"61.价值规律的表现形式是商品的价格围绕价值自发波动。"},{"sub":"第一部分 马原重要考点预测导论","text":"62.私有制为基础的商品经济的基本矛盾：私人劳动和社会劳动的矛盾。在资本主义制度下，这一矛盾进一步发展成资本主义的基本矛盾，即生产社会化和生产资料资本主义私人占有之间的矛盾。"},{"sub":"第一部分 马原重要考点预测导论","text":"63.劳动力成为商品，要具备两个基本条件：①劳动者是自由人；②劳动者没有别的商品可以出卖。（自由得一无所有）"},{"sub":"第一部分 马原重要考点预测导论","text":"64.劳动力商品的价值包括三个部分：①维持劳动者本人生存所必需的生活资料的价值；②维持劳动者家属的生存所必需的生活资料的价值；③劳动者接受教育和训练所支出的费用。"},{"sub":"第一部分 马原重要考点预测导论","text":"劳动力价值的构成还包含一个历史的和道德的因素。"},{"sub":"第一部分 马原重要考点预测导论","text":"65.资本主义劳动过程有两个特点：其一，工人在资本家的监督下劳动，他们的劳动隶属于资本家；其二，劳动成果或劳动产品全部归资本家所有。"},{"sub":"第一部分 马原重要考点预测导论","text":"66.绝对剩余价值是指在必要劳动时间不变的条件下，由于延长工作日的长度和提高劳动强度而生产的剩余价值。相对剩余价值是指在工作日长度不变的条件下，通过缩短必要劳动时3间而相对延长剩余劳动时间所生产的剩余价值。缩短必要劳动时间是通过全社会劳动生产率的提高实现的。超额剩余价值是指企业由于提高劳动生产率而使商品的个别价值低于社会价值的差额。"},{"sub":"第一部分 马原重要考点预测导论","text":"67.资本主义条件下的生产自动化是资本家获取高额剩余价值的手段，而雇佣工人的剩余劳动仍然是这种剩余价值的唯一源泉。"},{"sub":"第一部分 马原重要考点预测导论","text":"68.资本积累是资本主义扩大再生产的源泉。"},{"sub":"第一部分 马原重要考点预测导论","text":"69.由生产的技术水平所决定的生产资料和劳动力之间的比例，叫作资本的技术构成。资本可分为不变资本和可变资本，这两部分资本价值之间的比例，叫作资本的价值构成。资本技术构成决定并反映技术构成变化的资本价值构成，叫作资本的有机构成，通常用C:V来表示。"},{"sub":"第一部分 马原重要考点预测导论","text":"70.资本循环及其职能形式及基本条件：购买阶段，产业资本执行的是货币资本的职能；生产阶段，产业资本执行的是生产资本的职能；售卖阶段，产业资本执行的是商品资本的职能。"},{"sub":"第一部分 马原重要考点预测导论","text":"产业资本的三种职能形式必须在空间上同时并存，必须在时间上继起。"},{"sub":"第一部分 马原重要考点预测导论","text":"71.影响资本周转快慢的因素有很多，关键的因素有两个：资本周转时间、生产资本中固定资本和流动资本的构成。"},{"sub":"第一部分 马原重要考点预测导论","text":"72.资本主义工资的本质是劳动力的价值或价格，但工资表现为“劳动的价格”或工人全部劳动的报酬，这就模糊了工人必要劳动和剩余劳动的界限，掩盖了资本主义剥削关系。"},{"sub":"第一部分 马原重要考点预测导论","text":"73.生产相对过剩是资本主义经济危机的本质特征。经济危机的可能性是由货币作为支付手段和流通手段引起的。资本主义经济危机爆发的根本原因是资本主义的基本矛盾。资本主义经济危机具有周期性，一般包括四个阶段：危机、萧条、复苏和高涨。"},{"sub":"第一部分 马原重要考点预测导论","text":"74.垄断产生的原因：①当生产集中发展到相当高的程度；②企业规模巨大，形成对竞争的限制，也会产生垄断；③为了避免两败俱伤，企业之间会达成妥协，联合起来，实行垄断。"},{"sub":"第一部分 马原重要考点预测导论","text":"75.垄断并不能消除竞争的原因：①垄断没有消除产生竞争的经济条件。②垄断必须通过竞争来维持。③社会生产是复杂多样的，任何垄断组织都不可能把包罗万象的社会生产都包下来。"},{"sub":"第一部分 马原重要考点预测导论","text":"76.金融资本形成的主要途径包括金融联系、资本参与和人事参与。"},{"sub":"第一部分 马原重要考点预测导论","text":"77.金融寡头在经济中的统治，主要是通过“参与制”来实现的。在政治上对国家机器的控制主要是通过同政府的多种途径的“个人联合”来实现的。金融寡头还通过建立政策咨询机构等方式对政府的政策施加影响，并通过掌握新闻、科教、文化等上层建筑的各个领域，左右国家的内政外交及社会生活。"},{"sub":"第一部分 马原重要考点预测导论","text":"78.垄断利润的来源：①来自对本国无产阶级和其他劳动人民剥削的加强；②通过控制市场获得一些其他企业特别是非垄断企业的利润；③通过加强对其他国家劳动人民的剥削和掠夺从国外获取利润；④通过资本主义国家政权进行有利于垄断资本的再分配，从而将劳动人民创造的国民收入的一部分变成垄断资本的收入。"},{"sub":"第一部分 马原重要考点预测导论","text":"79.国家垄断资本主义形成的原因：①社会生产力的发展，要求资本主义生产资料在更大范围内被支配，从而促进了国家垄断资本主义的产生；②经济波动和经济危机的深化，要求国家垄断资本主义的产生；③缓和社会矛盾、协调利益关系，也要求国家垄断资本主义的产生。"},{"sub":"第一部分 马原重要考点预测导论","text":"80.金融自由化与金融创新是金融垄断资本得以形成和壮大的重要制度条件。"},{"sub":"第一部分 马原重要考点预测导论","text":"81.垄断资本向世界范围扩展的基本形式：①借贷资本输出；②生产资本输出；③商品资本输出。"},{"sub":"第一部分 马原重要考点预测导论","text":"82.列宁指出，资本主义发展到垄断资本主义，进而发展到帝国主义，具有五个基本特征。"},{"sub":"第一部分 马原重要考点预测导论","text":"第一，垄断组织在经济生活中起决定作用。第二，在金融资本的基础上形成金融寡头的统治。"},{"sub":"第一部分 马原重要考点预测导论","text":"第三，资本输出有了特别重要的意义。第四，瓜分世界的资本主义国际垄断同盟已经形成。"},{"sub":"第一部分 马原重要考点预测导论","text":"第五，最大资本主义列强已把世界上的领土瓜分完毕。"},{"sub":"第一部分 马原重要考点预测导论","text":"83.当代资本主义发生新变化的特征。第一，科技创新加速资本主义发生变化。一是产业结构的调整。二是生产组织形式和劳动形式的变化。三是新经济形态的出现。第二，国际金融垄断资本影响日益显现（是当代资本主义最突出、最鲜明、最主要的特征）。一是金融垄断寡头化。二是金融垄断国际化。三是经济虚拟化、产业空心化。第三，社会阶级阶层结构的复杂化、多样化。第四，发达资本主义国家凭借经济、科技、文化传播等超级优势，在世界范围内推行霸权主义和强权政治。"},{"sub":"第一部分 马原重要考点预测导论","text":"科学社会主义"},{"sub":"第一部分 马原重要考点预测导论","text":"84.空想社会主义的局限性在于，它既不会阐明资本主义制度下雇佣奴隶制的本质，又不会发现资本主义发展的规律，也不会找到能够成为新社会的创造者的社会力量。"},{"sub":"第一部分 马原重要考点预测导论","text":"85.社会主义从空想到科学飞跃的理论基础：唯物史观和剩余价值学说。《共产党宣言》的发表，标志着科学社会主义公开问世。"},{"sub":"第一部分 马原重要考点预测导论","text":"86.列宁对社会主义道路的探索。新经济政策时期。以发展商品经济为主要特征的新经济政策。其主要内容有：①用粮食税制取代余粮收集制，②允许私人自由贸易，③恢复商品货币关系，④允许私人小工业企业发展，⑤采取一些国家资本主义的形式来发展生产。这标志着列宁正在探索一条符合俄国国情的建设社会主义的道路。"},{"sub":"第一部分 马原重要考点预测导论","text":"87.列宁对苏维埃俄国如何建设社会主义进行了深刻的理论思考，提出了许多精辟的论述：①把建设社会主义作为一个长期探索、不断实践的过程。②把大力发展生产力、提高劳动生产率放在首要地位。③在多种经济成分并存的条件下，利用商品、货币和市场发展经济。④利用资本主义建设社会主义。"},{"sub":"第一部分 马原重要考点预测导论","text":"88.正确把握科学社会主义基本原则。①必须始终坚持科学社会主义基本原则。②要善于把科学社会主义基本原则与本国实际相结合。③紧跟时代和实践的发展。"},{"sub":"第一部分 马原重要考点预测导论","text":"89.社会主义建设具有长期性的原因。第一，生产力发展状况的制约。第二，经济基础和上层建筑发展状况的制约。第三，国际环境的严峻挑战。第四，马克思主义执政党对社会主义发展道路的探索和对社会主义建设规律的认识，需要一个长期的过程。"},{"sub":"第一部分 马原重要考点预测导论","text":"90.社会主义发展道路多样性的原因。①各个国家的生产力发展状况和社会发展阶段决定了社会主义发展道路具有不同的特点。②历史文化传统的差异性是造成不同国家社会主义发展道路多样性的重要条件。③时代和实践的不断发展，是造成社会主义发展道路多样性的现实原因。"},{"sub":"第一部分 马原重要考点预测导论","text":"91.如何探索符合本国国情的发展道路。①探索社会主义发展道路，必须坚持对待马克思主义的科学态度。②探索社会主义发展道路，必须从当时当地的历史条件出发，坚持“走自己的路”。③探索社会主义发展道路，必须充分吸收人类一切优秀文明成果。"},{"sub":"第一部分 马原重要考点预测导论","text":"92.共产主义社会的基本特征。①物质财富极大丰富，消费资料按需分配。②社会关系高度5和谐，人们精神境界极大提高。③每个人自由而全面的发展，人类从必然王国向自由王国的飞跃。实现人的自由而全面的发展，是马克思主义追求的根本价值目标，也是共产主义社会的根本特征。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"1.党的十一届六中全会通过的《关于建国以来党的若干历史问题的决议》指出：毛泽东思想的活的灵魂有三个基本方面，即实事求是、群众路线、独立自主。实事求是，就是一切从实际出发，理论联系实际，坚持在实践中检验真理和发展真理。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"2.陈云在1956年中共八大上提出的经济思想“三个主体、三个补充”：在工商业经营方面，国家经营和集体经营是工商业的主体，一定数量的个体经营是国家经营和集体经营的补充；在生产计划方面，计划生产是工农业生产的主体，按照市场变化在国家计划许可范围内的自由生产是计划生产的补充；在社会主义的统一市场里，国家市场是它的主体，一定范围内国家领导的自由市场是国家市场的补充。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"3.1956年，毛泽东作了《论十大关系》的报告，这是党探索中国社会主义建设道路的良好开端。《论十大关系》初步总结了我国社会主义建设的经验，明确提出了以苏为鉴，独立自主地探索适合中国情况的社会主义建设道路。报告确定了一个基本方针，就是“努力把党内党外、国内国外的一切积极的因素全部调动起来”，为社会主义建设服务。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"4.毛泽东在1957年所作《关于正确处理人民内部矛盾的问题》的报告："},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"（1）毛泽东强调，关于正确处理人民内部矛盾的问题是社会主义国家政治生活的主题。这一论断的根本着眼点，在于调动一切积极因素，把全党的注意力转到社会主义建设上来。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"（2）毛泽东在《关于正确处理人民内部矛盾的问题》中提出一系列处理人民内部矛盾的方针原则：对于政治思想领域的矛盾，实行“团结—批评—团结”的方针；对于物质利益、分配方面的矛盾，实行统筹兼顾、适当安排的方针；对于人民群众和政府机关的矛盾，坚持民主集中制原则；对于科学文化领域的矛盾，实行“百花齐放、百家争鸣”的方针；对于共产党和民主党派的矛盾，实行“长期共存、互相监督”的方针；对于民族之间的矛盾，实行民族平等、团结互助的方针。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"5.搞清楚什么是社会主义、怎样建设社会主义，关键是要在坚持社会主义基本制度的基础上进一步认清社会主义的本质。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"6.社会主义的根本任务是发展生产力。邓小平深刻地概括出“科学技术是第一生产力”这个新论断。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"7.构建高水平社会主义市场经济体制，关键是要处理好政府和市场的关系。市场在资源配置中起决定性作用就是把市场机制能有效调节的经济活动交给市场，推动资源配置实现效益最大化和效率最优化。更好地发挥政府作用就是要在保证市场发挥决定性作用的前提下，管好那些市场管不了或管不好的事情。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"8.推动“十五五”时期经济社会发展，必须全面贯彻习近平新时代中国特色社会主义思想，坚持以经济建设为中心，以推动高质量发展为主题，以改革创新为根本动力，以满足人民日益增长的美好生活需要为根本目的，以全面从严治党为根本保障，推动经济实现质的有效提升和量的合理增长，推动人的全面发展、全体人民共同富裕迈出坚实步伐，确保基本实现社会主义现代化取得决定性进展。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"9.民营经济是推进中国式现代化的生力军，是高质量发展的重要基础，是非公有制经济的主要经济组织形式，是实现中华民族伟大复兴的重要力量，是社会主义市场经济的重要组成部分，是建设现代化经济体系的重要主体。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"10.习近平总书记指出要牢牢把握雄安新区作为北京非首都功能疏解集中承载地的首要功能定位，以改革创新为引领增强内生发展动力，以要素资源合理集聚为重点激发新区活力，努力建设新时代创新高地和推动高质量发展样板。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"11.在全面建设社会主义现代化国家进程中，必须坚持教育、科技、人才的基础性、战略性地位，一体推进教育强国、科技强国、人才强国建设。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"12.坚持党的领导是中国特色社会主义最本质的特征；坚持党中央集中统一领导是党的领导的最高原则；全面从严治党是新时代党的建设一以贯之的鲜明主题；坚持不忘初心、牢记使命是党的宗旨立场和价值取向；坚持以党的政治建设为统领是新时代党的建设的根本要求；坚持用严明的纪律管全党治全党是全面从严治党的治本之策。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"13.中国特色社会主义制度优势的原因：中国特色社会主义制度是党和人民在长期实践探索中形成的科学制度体系，具有深厚的历史根基与实践基础；中国特色社会主义制度具有强大的社会整合能力，能够实现资源的优化配置与高效整合，集中力量办大事；党的领导是中国特色社会主义制度的最大优势，为我国各项事业发展提供根本政治保障。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"14.习近平在全国卫生与健康大会上对健康中国建设作出系统部署：落实健康优先发展战略；坚持预防为主，强化公共卫生防控；持续深化“三医”协同改革；加强医疗卫生人才队伍建设，弘扬医德医风，营造尊医重卫社会环境。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"15.当前阶段处理台海事务的基本遵循是：必须坚持一个中国原则，坚决反对“台独”分裂活动；尊重中国主权和领土完整，美方应停止向“台独”势力发出任何错误信号，慎重妥善处理涉台问题；在坚持上述原则基础上，共同维护台海和平稳定。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"16.1956年年底，我国对农业、手工业和资本主义工商业的社会主义改造基本完成，我国社会经济结构发生了根本变化，社会主义公有制已成为我国社会的经济基础，标志着中国历史上长达数千年的阶级剥削制度的结束和社会主义基本制度的确立。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"17.社会主义基本制度的确立是中国历史上最深刻最伟大的社会变革，为当代中国一切发展进步奠定了制度基础，也为中国特色社会主义制度的创新和发展提供了重要条件，使广大劳动人民真正成为国家的主人，这是中国几千年来阶级关系的最根本变革。中国进入了社会主义初级阶段和全面建设社会主义时期。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"18.“三个代表”重要思想在邓小平理论的基础上，进一步回答了什么是社会主义、怎样建设社会主义的问题，创造性地回答了建设什么样的党、怎样建设党的问题。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"19.公有制主体地位不能动摇，国有经济主导作用不能动摇，这是我国各族人民共享发展成果的制度性保证。国有企业是中国特色社会主义的重要物质基础和政治基础，是我们党执政兴国的重要支柱和依靠力量。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"20.培育发展未来产业的具体要求：一要加强统筹谋划和坚持以科技创新为引领；二要发挥企业主体作用；三要营造良好政策环境；四要健全治理体系。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"21.要坚持把解决好“三农”问题作为全党工作重中之重，以推进乡村全面振兴为总抓手，以学习运用“千万工程”经验为引领，以改革创新为根本动力，提高强农惠农富农政策效能，守牢国家粮食安全底线。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"22.基础研究归根结底靠高水平人才，青年人才是基础研究的生力军。推动科技创新和产业创新深度融合，是以高水平科技自立自强引领发展新质生产力的关键。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"23.《中华人民共和国民族团结进步促进法》：立法目的就是促进民族团结进步，铸牢中华民族共同体意识，推进中华民族共同体建设，服务民族复兴；国家坚持增进共同性、尊重和包容差异性，促进各民族守望相助、和谐共处；民族团结是我国各族人民的生命线，中华民族共同体意识是民族团结之本。以铸牢中华民族共同体意识为主线，推动民族团结进步事业高质量发展。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"24.《中华人民共和国生态环境法典》：是世界上第一部以“生态环境”命名的法典，是新时代推进全面依法治国的重大标志性成果，为以中国式现代化全面推进强国建设、民族复兴伟业提供了有力的生态环境法治保障，全面体现了习近平生态文明思想的核心要义、丰富内涵和实践要求。编纂生态环境法典是贯彻落实习近平生态文明思想，推进人与自然和谐共生的现代化的必然要求，是坚持全面依法治国，在法治轨道上推进新时代生态文明建设的必要举措，是贯彻新发展理念，同步推进高质量发展和高水平保护的客观要求，是坚持以人民为中心的发展思想，增进民生福祉的必然要求，是完善中国特色社会主义法律体系，使法律体系更加科学完备、统一权威的内在要求。《中华人民共和国生态环境法典》的施行标志着我国生态环境保护开启“法典化”时代。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"25.坚持总体国家安全观，要以人民安全为宗旨，以政治安全为根本，以经济安全为基础，以军事、科技、文化、社会安全为保障，以促进国际安全为依托。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"26.二十届五中全会："},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"（1）二十届五中全会审议通过了《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"（2）围绕建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党的重大时代课题，形成习近平党建思想。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"（3）跳出治乱兴衰历史周期率的两个答案：“让人民来监督政府”和“自我革命”。"},{"sub":"第二部分 毛中特、习思想重要考点预测","text":"（4）持之以恒推进全面从严治党的系统部署：增强党性是全面从严治党的根本性任务。贯彻执行民主集中制是全面从严治党的内在要求。全面从严治党关键在从严治吏。党的各级组织是全面从严治党的主体。正风肃纪是全面从严治党的有力举措。一体推进不敢腐不能腐不想腐是全面从严治党的重要方略和反腐败斗争的基本方针。加强党内法规制度建设是全面从严治党的长远之策、根本之策。必须进一步完善党和国家监督体系。必须扭住管党治党责任制“牛鼻子”，压紧压实管党治党责任。"},{"sub":"第三部分 史纲重点考点预测","text":"1.中国近代史上第一个不平等条约：《南京条约》（1842年签订）。1843年签订中英《虎门条约》，作为对《南京条约》的补充。1844年签订中美《望厦条约》、中法《黄埔条约》。"},{"sub":"第三部分 史纲重点考点预测","text":"以上四个条约被称为第一批不平等条约。"},{"sub":"第三部分 史纲重点考点预测","text":"2.近代以来中华民族面临两大历史任务：争取民族独立和人民解放；实现国家富强和人民富裕。"},{"sub":"第三部分 史纲重点考点预测","text":"3.近代中国的主要矛盾：帝国主义和中华民族的矛盾、封建主义和人民大众的矛盾。"},{"sub":"第三部分 史纲重点考点预测","text":"4.帝国主义列强对中国争夺和瓜分的图谋在1894年中日甲午战争爆发后达到高潮。1898年至1899年，德、俄、英、法、日等国竞相租借港湾和划分势力范围。"},{"sub":"第三部分 史纲重点考点预测","text":"5.1895年签订的《马关条约》：割让台湾全岛及所有附属岛屿和澎湖列岛给日本；赔偿日本2亿两白银；增设沙市、重庆、苏州、杭州为商埠；允许日本在中国投资建厂。"},{"sub":"第三部分 史纲重点考点预测","text":"6.开创了中国近代向西方学习的新风：魏源，编写《海国图志》，提出“师夷长技以制夷”的思想。"},{"sub":"第三部分 史纲重点考点预测","text":"7.1895年严复在《救亡决论》中提出“救亡”的口号，翻译《天演论》，介绍“物竞天择”“适者生存”的社会进化论思想。"},{"sub":"第三部分 史纲重点考点预测","text":"8.孙中山1894年创立革命团体兴中会，喊出了“振兴中华”这个时代的最强音。"},{"sub":"第三部分 史纲重点考点预测","text":"9.洋务运动的指导思想：中学为体、西学为用。"},{"sub":"第三部分 史纲重点考点预测","text":"10.最先完整表述洋务运动指导思想的是：冯桂芬《校邠庐抗议》。"},{"sub":"第三部分 史纲重点考点预测","text":"11.洋务运动的目标：“自强”“求富”。"},{"sub":"第三部分 史纲重点考点预测","text":"12.民用企业多数采取的方式是：官督商办（这些企业基本上是资本主义性质的近代企业）。"},{"sub":"第三部分 史纲重点考点预测","text":"13.洋务运动创办新式学堂主要有三种：翻译学堂、工艺学堂、军事学堂。"},{"sub":"第三部分 史纲重点考点预测","text":"14.中国近代教育的开端：洋务运动。"},{"sub":"第三部分 史纲重点考点预测","text":"15.洋务运动失败的标志：甲午战争一役，北洋水师全军覆没。"},{"sub":"第三部分 史纲重点考点预测","text":"16.揭开了戊戌维新序幕的是：1895年康有为联合在京参加会试的举人共同发起“公车上书”。"},{"sub":"第三部分 史纲重点考点预测","text":"17.资产阶级思想与封建主义思想在中国的第一次正面交锋：维新派与守旧派的论战。"},{"sub":"第三部分 史纲重点考点预测","text":"18.资产阶级新文化开始打破封建文化独占文化阵地的局面的起点是：戊戌维新运动。"},{"sub":"第三部分 史纲重点考点预测","text":"19.中国近代高等国立教育的开端：京师大学堂的创设。"},{"sub":"第三部分 史纲重点考点预测","text":"20.中国民族资产阶级登上政治舞台的第一次表演：戊戌维新运动。"},{"sub":"第三部分 史纲重点考点预测","text":"21.《中国问题的真解决》指出：只有推翻清朝政府的统治，“以一个新的、开明的、进步的政府来代替旧政府”，“把过时的满清君主政体改变为‘中华民国’”，才能真正解决中国问题；提出中国资产阶级革命派与改良派的根本不同之处：资产阶级革命派选择以武装起义推翻清王朝。"},{"sub":"第三部分 史纲重点考点预测","text":"22.第一个资产阶级性质的革命团体：兴中会，立誓“驱除鞑虏，恢复中国，创立合众政府”。"},{"sub":"第三部分 史纲重点考点预测","text":"23.近代中国第一个领导资产阶级革命的全国性政党：中国同盟会，同盟会以《民报》为机关报，并确定了革命纲领。"},{"sub":"第三部分 史纲重点考点预测","text":"24.同盟会的政治纲领：民族主义（驱除鞑虏，恢复中华）；民权主义（创立民国）；民生主义（平均地权）"},{"sub":"第三部分 史纲重点考点预测","text":"25.资产阶级革命派与改良派论战的焦点是：要不要以革命的手段推翻清王朝。"},{"sub":"第三部分 史纲重点考点预测","text":"26.掀起了辛亥革命的高潮，打开了清王朝统治的缺口的是：武昌起义。"},{"sub":"第三部分 史纲重点考点预测","text":"27.临时参议院颁布《中华民国临时约法》。这是中国历史上第一部具有资产阶级共和国宪法性质的法典，它规定了资产阶级共和国的国家、政府组织机构以及人民享有的各项民主权利。"},{"sub":"第三部分 史纲重点考点预测","text":"28.萍浏醴起义是同盟会成立后发动的第一次武装起义"},{"sub":"第三部分 史纲重点考点预测","text":"29.同盟会成立后发动的影响最大的是“黄花岗起义 / 广州起义”"},{"sub":"第三部分 史纲重点考点预测","text":"30.清帝退位这一事件标志着：在中国延续了两千多年的封建帝制终于覆灭。"},{"sub":"第三部分 史纲重点考点预测","text":"31.一次比较完全意义上的资产阶级民主革命，拉开了近代以来中国发生的深刻社会变革序幕的事件是：辛亥革命。"},{"sub":"第三部分 史纲重点考点预测","text":"32.整个中国民族资产阶级领导的旧民主主义革命的终结的标志：护法运动的失败。"},{"sub":"第三部分 史纲重点考点预测","text":"33.辛亥革命失败的根本原因：在半殖民地半封建的中国，资本主义的建国方案是行不通的。"},{"sub":"第三部分 史纲重点考点预测","text":"34.资产阶级革命派的这些弱点、错误，根源于：中国民族资产阶级的软弱性和妥协性。"},{"sub":"第三部分 史纲重点考点预测","text":"35.新文化运动的意义：中国历史上一次前所未有的启蒙运动和空前深刻的思想解放运动。"},{"sub":"第三部分 史纲重点考点预测","text":"36.五四以前新文化运动的局限：倡导批判孔学，是为了给中国发展资本主义扫清障碍；把改造国民性置于优先的地位；使用的还是资产阶级的方法。"},{"sub":"第三部分 史纲重点考点预测","text":"37.十月革命的意义：推动中国的先进分子从资产阶级民主主义转向社会主义。"},{"sub":"第三部分 史纲重点考点预测","text":"38.五四运动使中国工人阶级开始以独立的姿态登上历史舞台。"},{"sub":"第三部分 史纲重点考点预测","text":"39.五四运动的历史特点：是一场以先进青年知识分子为先锋、广大人民群众参加的彻底反帝反封建的伟大爱国革命运动；是一场中国人民为拯救民族危亡、捍卫民族尊严、凝聚民族力量而掀起的伟大社会革命运动；是一场传播新思想、新文化、新知识的伟大思想启蒙运动和新文化运动。"},{"sub":"第三部分 史纲重点考点预测","text":"40.新文化运动的发展：在五四以后的新文化运动中马克思主义开始逐步地在思想文化领域中发挥指导作用。"},{"sub":"第三部分 史纲重点考点预测","text":"41.中国共产党成立的伟大意义：深刻改变了近代以后中华民族发展的方向和进程，深刻改变了中国人民和中华民族的前途和命运，深刻改变了世界发展的趋势和格局。"},{"sub":"第三部分 史纲重点考点预测","text":"42.中国革命的首要问题：分清敌友。"},{"sub":"第三部分 史纲重点考点预测","text":"43.中共二大：第一次提出了反帝反封建的民主革命纲领，采取群众路线的方法。"},{"sub":"第三部分 史纲重点考点预测","text":"44.国共合作的政治基础：新三民主义，其政纲同中共在民主革命阶段的纲领基本一致。"},{"sub":"第三部分 史纲重点考点预测","text":"45.第一次国共合作（国民革命联合战线）的正式形成的标志：国民党一大的成功召开。"},{"sub":"第三部分 史纲重点考点预测","text":"46.大革命高潮：五卅运动掀起了全国范围的大革命高潮。"},{"sub":"第三部分 史纲重点考点预测","text":"47.大革命：1926年以推翻北洋军阀统治为目标的北伐战争开始。国民革命军在工农群众的支援下，采取各个击破的战略，在不到半年的时间里，先后基本上摧毁了北洋军阀吴佩孚、孙传芳的主力。"},{"sub":"第三部分 史纲重点考点预测","text":"48.中共四大：提出了无产阶级在民主革命中的领导权问题，提出了工农联盟问题，对民主革命的内容做了更加完整的规定。"},{"sub":"第三部分 史纲重点考点预测","text":"49.毛泽东发表《国民革命与农民运动》一文，指出：“农民问题乃国民革命的中心问题”，“所谓国民革命运动，其大部分即是农民运动”。"},{"sub":"第三部分 史纲重点考点预测","text":"50.中国共产党在大革命中起着独特的、不可替代的作用：第一，大革命是在反对帝国主义、反对军阀的政治口号下进行的。而提出这个口号的，正是中国共产党。第二，大革命是在以11国共合作为基础的统一战线的组织形式下进行的，而中国共产党正是国共合作的倡导者和统一战线的组织者。第三，大革命是近代中国历史上空前广泛而深刻的群众运动，而中国共产党正是人民群众的主要发动者和组织者。第四，大革命的主要斗争形式是革命战争，中国共产党人不仅帮助和推动了国民革命军的建立，而且在军队中进行了卓有成效的政治工作，共产党员在战斗中更是身先士卒，起着先锋作用和表率作用。"},{"sub":"第三部分 史纲重点考点预测","text":"51.大革命失败标志着：国共合作全面破裂。"},{"sub":"第三部分 史纲重点考点预测","text":"52.大革命失败的主观原因：大革命后期犯了右倾机会主义错误，放弃了无产阶级的领导权，不善于将马克思列宁主义基本原理同中国革命的具体实际结合起来。"},{"sub":"第三部分 史纲重点考点预测","text":"53.八七会议：第一，会议彻底清算了大革命后期的陈独秀右倾机会主义错误，提出了“整顿改编自己的队伍，纠正过去严重的错误，而找着新的道路”的任务。第二，确定了土地革命和武装反抗国民党反动统治的总方针。毛泽东在会上着重阐述了党必须依靠农民和掌握枪杆子的思想，强调党“以后要非常注意军事，须知政权是由枪杆子中取得的”，实际上提出了以军事斗争作为党的工作重心的问题，会议还提出了“找着新的道路”的任务。第三，会议选出了以瞿秋白为首的中央临时政治局。"},{"sub":"第三部分 史纲重点考点预测","text":"54.《中国的红色政权为什么能够存在？》和《井冈山的斗争》的内容：论证了红色政权能够长期存在并发展的主客观条件，提出了“工农武装割据”的思想。"},{"sub":"第三部分 史纲重点考点预测","text":"55.《星星之火，可以燎原》的内容：提出了党把工作重心由城市转移到农村，建立和发展红色政权。"},{"sub":"第三部分 史纲重点考点预测","text":"56.《井冈山土地法》：以立法的形式，首次肯定了广大农民以革命的手段获得土地的权利。"},{"sub":"第三部分 史纲重点考点预测","text":"由于缺乏经验，这个土地法关于没收一切土地归苏维埃政府所有、禁止土地买卖等方面的规定，并不适合中国农村的实际。"},{"sub":"第三部分 史纲重点考点预测","text":"57.《兴国土地法》：将“没收一切土地”改为“没收一切公共土地及地主阶级的土地”，保护了中农的利益使之不受侵犯。"},{"sub":"第三部分 史纲重点考点预测","text":"58.遵义会议：集中解决了当时具有决定意义的军事问题和组织问题。"},{"sub":"第三部分 史纲重点考点预测","text":"59.遵义会议的鲜明特点：坚持真理、修正错误。"},{"sub":"第三部分 史纲重点考点预测","text":"60.红军长征的胜利的意义：中国共产党所领导的革命力量有了新的落脚点和战略基地。长征胜利宣告了国民党反动派消灭中国共产党和红军的图谋彻底失败，宣告了中国共产党和红军肩负着民族希望胜利实现了北上抗日的战略转移，实现了中国共产党和中国革命事业从挫折走向胜利的伟大转折。"},{"sub":"第三部分 史纲重点考点预测","text":"61.西安事变的意义：其和平解决成为时局转换的枢纽，十年内战的局面基本结束，国内和平初步实现。"},{"sub":"第三部分 史纲重点考点预测","text":"62.瓦窑堡会议的内容：阐明了建立抗日民族统一战线的可能性，批评了党内长期存在的“左”倾冒险主义、关门主义的错误倾向；提出了在抗日的条件下与民族资产阶级重建统一战线的新政策；规定了建立广泛的抗日民族统一战线的具体政策，决定将“人民共和国”口号代替“工农共和国”。"},{"sub":"第三部分 史纲重点考点预测","text":"63.国共第二次合作的形成标志：国民党中央通讯社发表《中国共产党为公布国共合作宣言》；蒋介石发表实际承认共产党合法地位的谈话。"},{"sub":"第三部分 史纲重点考点预测","text":"64.国共第二次合作的新特点：广泛的民族性和复杂的阶级矛盾；国共双方有政权有军队的12合作；没有正式的固定的组织形式和协商一致的具体的共同纲领。"},{"sub":"第三部分 史纲重点考点预测","text":"65.平型关大捷是全民族抗战以来中国军队的第一次重大胜利，粉碎了日军不可战胜的神话。"},{"sub":"第三部分 史纲重点考点预测","text":"66.台儿庄战役是抗战以来国民党正面战场取得的最重大胜利。"},{"sub":"第三部分 史纲重点考点预测","text":"67.《论持久战》的战略方针：战略相持阶段是中国抗日战争取得最后胜利的最关键的阶段。"},{"sub":"第三部分 史纲重点考点预测","text":"68.巩固抗日民族统一战线的策略总方针：发展进步势力，争取中间势力，孤立顽固势力。"},{"sub":"第三部分 史纲重点考点预测","text":"69.抗日民主根据地经济建设方面：减租减息，发展生产。"},{"sub":"第三部分 史纲重点考点预测","text":"70.整风运动的主要内容：（《改造我们的学习》、《整顿党的作风》、《反对党八股》）反对主观主义以整顿学风、反对宗派主义以整顿党风、反对党八股以整顿文风。"},{"sub":"第三部分 史纲重点考点预测","text":"71.调查研究是把理论和实际结合起来的不可或缺的中间环节，加强调查研究是转变党的作风的基础一环。"},{"sub":"第三部分 史纲重点考点预测","text":"72.三大作风：理论和实践相结合的作风，人民群众紧密地联系在一起的作风，自我批评的作风。"},{"sub":"第三部分 史纲重点考点预测","text":"73.中共七大的历史性贡献：把毛泽东思想确立为党的指导思想并写入党章，标志着党在政治上思想上组织上走向成熟。"},{"sub":"第三部分 史纲重点考点预测","text":"74.抗日战争取得完全胜利的重要标志：收回台湾以及澎湖列岛。"},{"sub":"第三部分 史纲重点考点预测","text":"75.抗日战争胜利的意义：为中华民族由近代以来陷入深重危机走向伟大复兴确立了历史转折点。"},{"sub":"第三部分 史纲重点考点预测","text":"76.重庆谈判：国共双方签署《政府与中共代表会谈纪要》，即双十协定，确认和平建国的基本方针，同意“长期合作，坚决避免内战”。中共目的是为争取和平民主。"},{"sub":"第三部分 史纲重点考点预测","text":"77.重庆政协会议：政协的协议及其他协议还不是新民主主义性质的，但它有利于冲破蒋介石的独裁统治和实行民主政治，有利于和平建国。"},{"sub":"第三部分 史纲重点考点预测","text":"78.中共七届二中全会主要内容有：①提出了迅速夺取全国胜利的方针。②说明了在全国胜利的局面下，采取乡村包围城市这样一种工作方式的时期已经完结，党的工作重心必须由乡村转移到城市。③规定了党在全国胜利后在政治、经济、外交方面应当采取的基本政策，指出了中国由农业国转变为工业国、由新民主主义社会转变为社会主义社会的总任务和主要途径。④提出了“两个务必”的思想，即“务必使同志们继续地保持谦虚、谨慎、不骄、不躁的作风，务必使同志们继续地保持艰苦奋斗的作风”。"},{"sub":"第三部分 史纲重点考点预测","text":"79.中国共产党领导的多党合作和政治协商格局的形成"},{"sub":"第三部分 史纲重点考点预测","text":"（1）中国共产党提出五一口号：这个口号得到各民主党派和社会各界的热烈响应，揭开了中国共产党同各党派、各团体、各族各界人士协商建国的序幕，奠定了中国共产党领导的多党合作和政治协商制度的基础。"},{"sub":"第三部分 史纲重点考点预测","text":"（2）民主党派的《对时局的意见》：这个政治声明表明，中国各民主党派和无党派民主人士自愿接受中国共产党的领导，决心走人民革命的道路，拥护建立人民民主的新中国。"},{"sub":"第三部分 史纲重点考点预测","text":"（3）毛泽东的谈话：毛泽东在同有关人士谈话时提出，民主党派应“积极参政，共同建设新中国”。民主党派参加新政协并将在新中国参政，这标志着民主党派地位的根本变化。中国共产党领导的多党合作和政治协商制度，正是在这个基础上形成的。"},{"sub":"第三部分 史纲重点考点预测","text":"80.人民政协会议的召开与《共同纲领》的制定"},{"sub":"第三部分 史纲重点考点预测","text":"（1）完成创建新中国的任务，是由中国人民政治协商会议来承担的。会议通过的《中国人13民政治协商会议组织法》《中华人民共和国中央人民政府组织法》和《中国人民政治协商会议共同纲领》，被认为是新中国奠基的3个历史性文件。"},{"sub":"第三部分 史纲重点考点预测","text":"（2）《共同纲领》在当时是全国人民的大宪章，起着临时宪法的作用。中共七届二中全会的决议和毛泽东的《论人民民主专政》，构成了《共同纲领》的基础。"},{"sub":"第三部分 史纲重点考点预测","text":"（3）人民政协的召开，标志着中国新型政党制度——中国共产党领导的多党合作和政治协商制度的确立。"},{"sub":"第三部分 史纲重点考点预测","text":"81.党领导和建立革命统一战线的实践经验：第一，要建立巩固的工农联盟。第二，要正确对待资产阶级，尤其是民族资产阶级。在革命斗争中要依据革命的需要，对资产阶级实行又联合又斗争的策略。正确处理好与资产阶级的关系，是党领导统一战线过程中最根本的经验。"},{"sub":"第三部分 史纲重点考点预测","text":"第三，要采取区别对待的方针。在革命进程中，要坚持发展进步势力、争取中间势力、孤立顽固势力的策略方针。第四，要坚持独立自主的原则。要保持党在政治上、组织上和思想上的独立性。"},{"sub":"第三部分 史纲重点考点预测","text":"82.新中国成立后，我们进入到新民主主义社会。为巩固民族独立，维护国家主权和安全：第一，从根本上改变了旧中国“跪倒在地上办外交”的局面：新中国废除了帝国主义国家依据不平等条约在中国享有的一切特权；收回了外国列强在中国的兵营，驻扎在中国领土上的一切外国军队被迫撤走；收回了海关治权，中国人民重新掌握了国门的钥匙。第二，提出“另起炉灶”“打扫干净屋子再请客”“一边倒”的外交方针。新中国同苏联订立了《中苏友好同盟互助条约》和有关协定。"},{"sub":"第三部分 史纲重点考点预测","text":"83.抗美援朝，保家卫国：经过艰苦卓绝的战斗，打破了美军不可战胜的神话。抗美援朝战争打出了国威军威，打出了中国人民的精气神，捍卫了新中国安全，彰显了新中国大国地位。"},{"sub":"第三部分 史纲重点考点预测","text":"抗美援朝战争的伟大胜利，是中国人民站起来后屹立于世界东方的宣言书，是中华民族走向伟大复兴的重要里程碑。"},{"sub":"第三部分 史纲重点考点预测","text":"84.社会主义工业化的起步：“一五”计划时期工业生产取得的成就，为我国建立独立完整的工业体系奠定了基础。"},{"sub":"第三部分 史纲重点考点预测","text":"85.社会主义基本制度的确立"},{"sub":"第三部分 史纲重点考点预测","text":"（1）社会主义经济制度的确立：随着1956年社会主义改造的完成，以生产资料公有制、按劳分配和计划经济体制为特征的社会主义经济制度建立起来，这是中国进入社会主义社会最主要的标志。"},{"sub":"第三部分 史纲重点考点预测","text":"改造过程：农业：互助组 - 初级农业生产合作社 - 高级农业生产合作社手工业：手工业供销小组 - 手工业供销合作社 - 手工业生产合作社资本主义工商业：初级形式的国家资本主义 - 个别企业的公私合营 - 全行业的公私合营"},{"sub":"第三部分 史纲重点考点预测","text":"（2）社会主义政治制度的确立：1954年9月，中华人民共和国第一届全国人民代表大会第一次会议在北京召开。大会讨论并通过了《中华人民共和国宪法》。"},{"sub":"第三部分 史纲重点考点预测","text":"86.毛泽东提出的马克思主义同中国实际“第二次结合”的任务，为探索适合中国情况的社会主义建设道路，提供了基本的指导原则。"},{"sub":"第三部分 史纲重点考点预测","text":"87.《论十大关系》：这十大关系围绕一个基本方针，即调动国内外一切积极因素，为社会主义服务。《论十大关系》是以毛泽东为主要代表的中国共产党人开始探索中国自己的社会主14义建设道路的标志，它在新的历史条件下从经济方面（这是主要的）和政治方面提出了新的指导方针，为中共八大的召开作了理论准备。"},{"sub":"第三部分 史纲重点考点预测","text":"88.中共十一届三中全会：第一，内容上，全会冲破长期“左”的错误的严重束缚，彻底否定了“两个凡是”的错误方针，高度评价了关于真理标准问题的讨论，并且断然否定“以阶级斗争为纲”的指导思想，作出了把工作重点转移到社会主义现代化建设上来和实行改革开放的战略决策，重新确立了马克思主义的思想路线、政治路线和组织路线。第二，意义上，党的十一届三中全会的胜利召开，结束了粉碎“四人帮”后党和国家工作徘徊中前进的局面，开启了我国改革开放和社会主义现代化建设新时期，实现了历史性的伟大转折。会议形成了以邓小平为核心的党的中央领导集体。从这次全会开始，改革开放和开创中国特色社会主义的大幕拉开，邓小平理论也逐步形成和发展起来。"},{"sub":"第三部分 史纲重点考点预测","text":"89.中共十八届三中：开启了新时代全面深化改革、系统整体设计推进改革新征程，开创了我国改革开放全新局面。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"1.德法关系：思想道德和法律在调节领域、调节方式、调节目标等方面存在很大不同，思想道德建设为法治建设提供思想指引和价值基础，法治建设为思想道德建设提供制度支撑和法律保障。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"2.个人与社会的关系：个人与社会的关系，最根本的是个人利益与社会利益的关系。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"3.人生观：包括人生目的、人生态度、人生价值。人生目的是人生观的核心，决定人生道路、态度和价值选择，“服务人民、奉献社会”代表了人类社会迄今最先进的人生追求。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"4.人生价值评价标准：根本尺度是看一个人的实践活动是否符合社会发展的客观规律，是否促进了历史的进步。在今天，衡量人生价值的标准，最重要的就是看一个人是否用自己的劳动和聪明才智为国家和社会真诚奉献，为人民群众尽心尽力服务。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"5.自我价值和社会价值：两者是辩证统一的，自我价值是个体生存和发展的必要条件，是个体为社会创造更大价值的前提。社会价值是社会存在和发展的重要条件，是个体自我完善、全面发展的保障。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"6.理想的特征：①超越性 ②实践性 ③时代性"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"7.信念体系：高层次的信念决定低层次的信念，低层次的信念服从高层次的信念。信仰是最高层次的信念。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"信念的特征：①执着性 ②支撑性 ③多样性"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"8.个人理想和社会理想：个人理想以社会理想为指引，社会理想是对个人理想的凝练和升华。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"9.中国精神的内涵：伟大创造精神、伟大奋斗精神、伟大团结精神、伟大梦想精神。包含以爱国主义为核心的民族精神，以改革创新为核心的时代精神。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"10.爱国主义的要求：①爱祖国的大好河山——领土完整、统一；②爱自己的骨肉同胞——试金石；③爱祖国的灿烂文化——文化是灵魂、精神基因、摇篮；④爱自己的国家。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"11.做新时代的爱国者：必须坚持爱国爱党爱社会主义相统一（本质）、维护祖国统一和民族团结（着力点）、尊重和传承中华民族历史和文化、坚持立足民族又面向世界。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"12.爱国主义的特征：历史的、具体的、现实的"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"13.社会主义核心价值观：坚持和发展中国特色社会主义的价值遵循，增进社会团结奋进的最大公约数，提高国家文化软实力的迫切要求。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"社会主义核心价值观的显著特征：①先进性 ②人民性 ③真实性道德专题"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"14.道德起源：①劳动是道德起源的首要前提，是道德起源的第一个历史前提。②社会关系是道德赖以产生的客观条件。③人的自我意识是道德产生的主观条件，意识是道德产生的思想认识前提。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"15.社会主义道德：核心是为人民服务，原则是集体主义。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"16.社会公德：遵纪守法是全体公民都必须遵循的最基本行为准则。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"公共生活的特征：①广泛性 ②开放性 ③复杂性 ④多样性"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"17.职业道德：“劳动最光荣、劳动最崇高、劳动最伟大、劳动最美丽”。幸福源自奋斗，成功在于奉献，平凡孕育伟大。干一行爱一行，爱一行钻一行，精益求精，尽职尽责。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"18.个人品德：个人品德是通过社会道德教育和个人自觉的道德修养所形成的稳定的心理状态和行为习惯。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"法治专题"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"19.法律：由国家创制和实施的行为规范，国家强制性是法律规范区别于其他社会规范的一个重要特征。物质资料的生产方式是决定法律本质、内容和发展方向的根本因素。法律是统治阶级意志的体现，并不是统治阶级意志的全部，仅仅是上升为国家意志的那部分意志。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"20.法律运行：法律制定（立法）是法律运行的起始性和关键性环节（龙头环节），法律执行（执法）是法律实施和实现的重要环节，法律适用（司法）是最后防线，法律遵守（守法）是法律实施和实现的基本途径。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"21.社会主义法律的本质特征：①党的主张和人民意志的统一 ②科学性和先进性 ③中国特色社会主义建设的重要保障"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"22.中国特色社会主义法治道路的核心要义：坚持党的领导，坚持中国特色社会主义制度，贯彻中国特色社会主义法治理论。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"23.建设中国特色社会主义法治体系：（1）建设法治中国，要以建设中国特色社会主义法治体系为总抓手。（2）构成内容：①完备的法律规范体系，是中国特色社会主义法治体系的前提和制度基础，②高效的法治实施体系，是中国特色社会主义法治体系的重点，③严密的法治监督体系，是宪法法律有效实施的重要保障，④有力的法治保障体系，是全面依法治国的重要依托，⑤完善的党内法规体系，是中国特色社会主义法治体系的本质要求和重要内容。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"24.法治国家、法治政府、法治社会相辅相成，法治国家是法治建设的目标，法治政府是建设法治国家的重点，法治社会是构筑法治国家的基础。推进全面依法治国，法治政府建设是重点任务和主体工程，对法治国家、法治社会建设具有示范带动作用。推进全面依法治国，法治社会建设是基础工程。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"25.科学立法是全面依法治国的前提，严格执法是全面依法治国的关键，公正司法是全面依法治国的重点，全民守法是全面依法治国的基础。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"26.法律的权威源自人民的内心拥护和真诚信仰。法律的生命力在于实施，法律的权威也在于实施。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"27.维护宪法权威：宪法是国家的根本法，实现了党的主张和人民意志的高度统一，是始终沿着中国特色社会主义道路前进的根本法制保障，是实现国家认同、凝聚社会共识、促进个人发展的基本准则，是维系一个国家、一个民族凝聚力的根本纽带。坚持依法治国首先要坚持依宪治国，坚持依法执政首先要坚持依宪执政。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"28.法治思维的特征：①正当性 ②规范性 ③逻辑性 ④科学性"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"29.法律至上具体表现为法律的普遍适用性、优先适用性和不可违抗性。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"30.法律权利受社会物质生活条件的制约、因社会制度和国家法律的不同而存在差异、具有不可侵犯性、必须依法行使。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"31.法律义务是历史的、源于现实需要、必须依法设定、可能发生变化。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"32.权利与义务：法律权利与法律义务不可分割，相互依存。法律权利的实现必须以相应法律义务的履行为条件；法律义务的设定和履行也必须以法律权利的行使为依据。有些法律权利与法律义务具有复合性的关系，即一个行为可以同时是权利行为和义务行为。二者相一致17的情况下，一个人无论是行使权利还是履行义务，都是对自己有利的。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"33.基本法律权利：政治权利、人身权利、财产权利、社会经济权利、宗教信仰自由、文化教育权利。"},{"sub":"第四部分 思想道德与法治重要考点预测绪论+思想专题","text":"34.基本法律义务：维护国家统一和民族团结；遵守宪法和法律；维护祖国安全、荣誉和利益；依法服兵役；依法纳税。"},{"sub":"第五部分 形势与政策重要考点预测","text":"1.1月12日习近平在二十届中央纪委五次全会上发表重要讲话，指出党的自我革命重在治权，把权力关进制度笼子是新时代全面从严治党的一项重要任务。习近平强调，腐败是党和国家事业发展进程中的拦路虎、绊脚石，反腐败是一场输不起也决不能输的重大斗争。"},{"sub":"第五部分 形势与政策重要考点预测","text":"2.1月16日《求是》杂志发表习近平总书记重要文章《在中央城市工作会议上的讲话》，文章提出我国城镇化正在从快速增长期转向稳定发展期，城市发展正从大规模增量扩张阶段转向存量提质增效为主的阶段。要以建设创新、宜居、美丽、韧性、文明、智慧的现代化人民城市为目标，以推动城市高质量发展为主题，以坚持城市内涵式发展为主线，以推进城市更新为重要抓手。"},{"sub":"第五部分 形势与政策重要考点预测","text":"3.1月20日习近平在省部级主要领导干部学习贯彻党的二十届四中全会精神专题研讨班开班式上发表重要讲话 ，习近平指出，制定和实施五年规划是我们党治国理政一条重要经验，是中国特色社会主义制度一个重要政治优势，有利于实现党的领导，有利于集中力量办大事，有利于前瞻性把握战略问题，有利于保持事业连续性。"},{"sub":"第五部分 形势与政策重要考点预测","text":"4.2月3日中央一号文件发布：提出锚定农业农村现代化，以推进乡村全面振兴为总抓手，以学习运用“千万工程”经验为引领，以改革创新为根本动力，提高强农惠农富农政策效能，守牢国家粮食安全底线，持续巩固拓展脱贫攻坚成果，提升乡村产业发展水平、乡村建设水平、乡村治理水平，努力把农业建成现代化大产业、使农村基本具备现代生活条件、让农民生活更加富裕美好，为推进中国式现代化提供基础支撑。"},{"sub":"第五部分 形势与政策重要考点预测","text":"5.2月23日中办印发《通知》在全党开展树立和践行正确政绩观学习教育，《通知》明确，要持之以恒推进全面从严治党，以立党为公、为民造福、科学决策、真抓实干为总要求，以一体推进学查改为抓手。"},{"sub":"第五部分 形势与政策重要考点预测","text":"6.2月23日王毅以视频方式出席联合国人权理事会第61届会议高级别会议，王毅表示各国应共同维护不干涉别国内政这一“黄金法则”，对以人权名义操弄双重标准的言行坚决说不。"},{"sub":"第五部分 形势与政策重要考点预测","text":"7.3月12日通过，7月1日起施行的《中华人民共和国民族团结进步促进法》为铸牢中华民族共同体意识、推进中华民族共同体建设夯实法治根基。"},{"sub":"第五部分 形势与政策重要考点预测","text":"8.4月1日《求是》杂志发表习近平总书记重要文章《树立和践行正确政绩观》，文章强调，政绩观问题是一个根本性问题，关乎立党为公、执政为民。"},{"sub":"第五部分 形势与政策重要考点预测","text":"9.4月10日习近平总书记会见中国国民党主席郑丽文，习近平就两岸关系发展提出4点意见。第一，坚持以正确认同促进心灵契合。第二，坚持以和平发展守护共同家园。第三，坚持以交流融合增进民生福祉。第四，坚持以团结奋斗实现中华民族伟大复兴。"},{"sub":"第五部分 形势与政策重要考点预测","text":"10.4月22日印发《关于更高水平更高质量做好节能降碳工作的意见》明确总体工作要求，以习近平新时代中国特色社会主义思想为指导，贯彻党的二十大和二十届历次全会精神，完整准确全面贯彻新发展理念，坚持稳中求进工作总基调，坚持有效市场和有为政府相结合，统筹发展和安全，一以贯之坚持节约优先核心方针，将节能降碳贯穿经济社会发展全过程，严控能源消费不合理增长，提升能源资源利用效率，从源头削减碳排放。"},{"sub":"第五部分 形势与政策重要考点预测","text":"11.5月14日上午，国家主席习近平在北京人民大会堂同来华进行国事访问的美国总统特朗普举行会谈。习近平强调，中方致力于中美关系稳定、健康、可持续发展。我同特朗普总统赞同将构建“中美建设性战略稳定关系”作为中美关系新定位，将为未来3年乃至更长时19间的中美关系提供战略指引，相信会受到两国人民和国际社会的欢迎。“建设性战略稳定”应该是合作为主的积极稳定，应该是竞争有度的良性稳定，应该是分歧可控的常态稳定，应该是和平可期的持久稳定。"},{"sub":"第五部分 形势与政策重要考点预测","text":"12.5月20日上午，国家主席习近平同来华进行国事访问的俄罗斯总统普京举行会谈。两国元首一致同意《中俄睦邻友好合作条约》继续延期。当前国际格局发生很大变化，世界面临倒退回丛林法则的危险。在此背景下，《中俄睦邻友好合作条约》的先进性、科学性和现实价值愈加凸显。中方支持《中俄睦邻友好合作条约》继续延期，将同俄方一道恪守条约精神，坚定推进中俄“背靠背”战略协作。5月20日晚，国家主席习近平同俄罗斯总统普京举行茶叙。习近平指出，多年来，我同普京总统保持频密交往，共同引领中俄新时代全面战略协作伙伴关系持续走深走实，推动两国睦邻友好更加深入人心，开创了相互尊重、公平正义、合作共赢的新型大国关系范式，为变乱交织的世界持续注入宝贵的稳定性。"},{"sub":"第五部分 形势与政策重要考点预测","text":"13.6月1日《求是》杂志发表习近平总书记重要文章《前瞻布局和发展未来产业》，文章指出，要坚持以科技创新为引领。要充分发挥新型举国体制优势，坚持“产业出题、科技答题”，大力提升科技支撑引领能力。"},{"sub":"第五部分 形势与政策重要考点预测","text":"14.6月12日《求是》杂志发表习近平总书记重要文章《一体推进教育科技人才发展》，文章强调，教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性支撑。建设教育强国、科技强国、人才强国具有内在一致性和相互支撑性。"},{"sub":"第五部分 形势与政策重要考点预测","text":"15.7月1日，庆祝中国共产党成立105周年大会隆重举行。习近平总书记发表重要讲话，105年来，我们党团结带领全国各族人民不懈奋斗，创造了新民主主义革命、社会主义革命和建设、改革开放和社会主义现代化建设、新时代中国特色社会主义的伟大成就，书写了中华民族几千年历史上最恢宏的史诗。105年不懈奋斗，从根本上改变了中国人民的前途命运，开辟了实现中华民族伟大复兴的正确道路，展示了马克思主义的强大生命力，深刻影响了世界历史进程，锻造了强大的中国共产党。我们党完全无愧为伟大光荣正确的党。习近平指出，中国共产党之所以能够在105年奋斗中不断铸就辉煌，历史和人民之所以选择中国共产党，根本在于我们党具有其他政党和政治力量无可比拟的优秀特质。我们党矢志追求真理、始终把准前进方向，深深植根人民、始终拥有坚实根基，勇担历史使命、始终掌握战略主动，顺应发展潮流、始终走在时代前列，敢于善于斗争、始终保持必胜信心，注重强健自身、始终充满生机活力。我们要结合新的实际，把党的优秀特质不断发扬光大，确保党永远不变质不变色不变味，始终具有强大创造力凝聚力战斗力。"},{"sub":"第五部分 形势与政策重要考点预测","text":"16.7月9日国家主席习近平出席国家科学技术奖励大会、两院院士大会、中国科协第十一次全国代表大会，并发表重要讲话。我国正从全球科技参与者、贡献者向开拓者、引领者加速转变，成为创新力上升最快的国家之一。“十五五”时期是科技强国建设的关键攻坚期，要全力抓好党中央关于科技事业各项部署的落实。习近平强调6点内容：①增强科技创新体系化攻关能力；②推动科技创新和产业创新深度融合，这是以高水平科技自立自强引领发展新质生产力的关键；③大力培养优秀青年科技人才；④提高科技创新投入效能；⑤用好科技评价指挥棒；⑥加强科技伦理和安全治理。"},{"sub":"第五部分 形势与政策重要考点预测","text":"17.7月17日习近平出席2026世界人工智能大会暨人工智能全球治理高级别会议开幕式并发表题为《携手构建公正合理的全球人工智能治理体系》主旨讲话，提出4点建议：坚持20开放共赢，驱动创新发展；强化风险意识，确保安全可控；鼓励包容并蓄，促进文明互鉴；倡导和衷共济，完善全球治理。"},{"sub":"第五部分 形势与政策重要考点预测","text":"18.7月30日下午，习近平在中共中央政治局第二十七次集体学习时强调政治建军是人民军队立军之本，关乎国防和军队现代化建设方向和底色。习近平指出高质量推进国防和军队现代化，根本指向和检验标准始终是战斗力。"},{"sub":"第五部分 形势与政策重要考点预测","text":"19.8月15日，《中华人民共和国生态环境法典》正式施行，标志着我国生态环境保护进入“法典化”治理新阶段。该法典是全球首部以“生态环境”命名的法典，是我国生态文明法治建设的重大标志性成果。"},{"sub":"第五部分 形势与政策重要考点预测","text":"20.8月18日，习近平在纪念江泽民同志100周年诞辰大会上的讲话中强调，江泽民同志留给我们的最可宝贵的财富，就是“三个代表”重要思想。江泽民同志领导推动社会主义物质文明、政治文明、精神文明建设和党的建设取得举世瞩目的新进展，为捍卫中国特色社会主义伟大事业、开创全面改革开放新局面、实现人民生活总体小康、成功把中国特色社会主义推向二十一世纪作出了不可磨灭的贡献。"},{"sub":"第五部分 形势与政策重要考点预测","text":"21.8月22日，绿色算力（人工智能）大会在内蒙古自治区呼和浩特市开幕。本次大会以“共筑算电协同之路，共商词元经济新局，共创人工智能未来”为主题，集中发布多项绿色智算创新成果，正式启动数字服务出海平台，落地全国视频大模型算力基地。"},{"sub":"第五部分 形势与政策重要考点预测","text":"22.9月1日，国家主席习近平出席上海合作组织成员国元首理事会会议，发表题为《推动上海合作组织实现更高质量发展》的重要讲话。习近平提出4点主张：第一，坚持发展优先，开创共同繁荣的前景。第二，坚持安全为要，营造普遍安全的环境。第三，坚持以人为本，厚植世代友好的根基。第四，坚持对话协商，完善公平有序的治理。"},{"sub":"第五部分 形势与政策重要考点预测","text":"23.9月1日下午，国家主席习近平出席“上海合作组织+”会议并发表题为《共同倡导平等有序的世界多极化 实现更加公正合理的全球治理》的重要讲话。习近平就更好发挥上海合作组织作用提出3点建议：第一，以“上合力量”驱动亚欧大陆繁荣共兴。第二，以“上合智慧”推动全球南方发展壮大。第三，以“上合行动”引领全球治理改革完善。"},{"sub":"第五部分 形势与政策重要考点预测","text":"24.9月13日上午，国家主席习近平在新德里出席金砖国家领导人第十八次会晤第二阶段会议，并发表题为《筑牢金砖合作根基 壮大全球南方力量》的重要讲话。习近平就深化金砖合作提出5项倡议：一是人工智能开源普惠倡议。二是贸易投资便利化倡议。三是数字产业合作倡议。四是智能制造合作倡议。五是科技育才倡议。"},{"sub":"第五部分 形势与政策重要考点预测","text":"25.9月23日至25日，国家主席习近平应邀对美国进行国事访问。这是习近平时隔11年再次对美国进行国事访问。两国元首同意共同构建“基于尊重、公平、对等的建设性战略稳定关系”。"},{"sub":"第五部分 形势与政策重要考点预测","text":"26.9月29日中办印发《文化遗产保护传承“十五五”规划》，这是我国首次在文化遗产保护领域制定的五年规划。习近平总书记关于文化遗产保护传承的重要论述有：坚持党的全面领导，坚持以人民为中心，坚持创造性转化、创新性发展，坚持保护第一、合理利用和最小干预原则，加强统筹协调，深化改革创新，推动文化遗产系统性保护和统一监管。目标：到 2030年，文化遗产大保护格局基本形成。"},{"sub":"第五部分 形势与政策重要考点预测","text":"27.10月13日下午，国家主席习近平会见来华进行正式访问的多哥部长会议主席福雷时，就各方建设性参与非洲热点问题解决提出4条原则：坚持非洲主导、维护公平正义、推动21止戈为和、实行标本兼治，为推动冲突通过政治和和平方式解决、维护和平稳定、加强全球南方国家合作提供了重要框架。"},{"sub":"第五部分 形势与政策重要考点预测","text":"28.10月17日，《世界职业技术教育标准框架》（《北京协议》）在2026年世界职业技术教育发展大会闭幕式上由45个国家共同发布。这是我国牵头推动研制形成的首个国际职业教育标准。"},{"sub":"第五部分 形势与政策重要考点预测","text":"29.10月22日上午，纪念中国工农红军长征胜利90周年大会隆重举行。习近平深刻阐释了长征胜利蕴含的制胜之道：红军长征的伟大胜利之路，是依靠党的正确领导、坚定的革命意志、独立自主实事求是、广大人民群众支持走出来的。"},{"sub":"第五部分 形势与政策重要考点预测","text":"30.中国共产党第二十届中央委员会第五次全体会议，于2026年10月26日至29日在北京举行。全会听取和讨论了习近平受中央政治局委托所作的工作报告，审议通过了《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》。习近平就《决定（讨论稿）》向全会作了说明。"},{"sub":"第五部分 形势与政策重要考点预测","text":"①全会高度评价新时代全面从严治党取得的伟大成就。党的十八大以来深入推进新时代党的建设新的伟大工程，找到了“让人民来监督政府”和“自我革命”两个跳出治乱兴衰历史周期率的答案。从根本上扭转了管党治党宽松软状况，刹住了一些长期没有刹住的歪风，纠治了一些多年未除的顽瘴痼疾，消除了党、国家、军队内部存在的严重隐患，党在革命性锻造中更加坚强有力。新时代全面从严治党开辟了百年大党自我革命新境界，推动党和国家事业取得历史性成就、发生历史性变革，党和人民赢得强党强国的历史主动。"},{"sub":"第五部分 形势与政策重要考点预测","text":"②在新时代管党治党、兴党强党伟大实践中，以习近平同志为核心的党中央围绕建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党的重大时代课题，提出一系列新理念新思想新战略，形成习近平党建思想。这一思想丰富和发展了马克思主义建党学说，是坚持把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合推进党的理论创新的重大成果，是党和人民实践经验和集体智慧的结晶，是习近平新时代中国特色社会主义思想的重要组成部分，为深入推进新时代党的建设新的伟大工程提供了根本遵循和行动指南。"},{"sub":"第五部分 形势与政策重要考点预测","text":"③全会强调，持之以恒推进全面从严治党遵循的原则是：坚持服务使命任务，坚持以党的政治建设为统领，坚持全面从严，坚持问题导向，坚持守正创新，坚持以上率下，坚持依规治党。"},{"sub":"第五部分 形势与政策重要考点预测","text":"④其他需要关注的表述：增强党性是全面从严治党的根本性任务。民主集中制是党的根本组织原则和领导制度，贯彻执行民主集中制是全面从严治党的内在要求。全面从严治党关键在从严治吏。党的各级组织是全面从严治党的主体。正风肃纪是全面从严治党的有力举措。一体推进不敢腐不能腐不想腐是全面从严治党的重要方略和反腐败斗争的基本方针。加强党内法规制度建设是全面从严治党的长远之策、根本之策。"},{"sub":"22主观题部分","text":"第一部分 马原重要考点预测热点链接1：客观规律性与主观能动性的关系、物质与意识的关系设问方法一：尊重客观规律；发挥意识的能动性；人与自然的关系"},{"sub":"【答题思路】客观规律性与主观能动性的关系","text":"【答题要点】实践使世界发生了二重分化，从自然界中分化出人类社会，从客观世界中分化出主观世界。处理人与自然的关系，需要处理好主观能动性与客观规律性的关系，客观规律性与主观能动性是辩证统一的。尊重客观规律是发挥主观能动性的前提，只有充分发挥主观能动性，才能正确认识和利用客观规律。实践是客观规律性与主观能动性统一的基础。"},{"sub":"【答题思路】客观规律性与主观能动性的关系","text":"热点链接2：联系的观点设问方法：环环相扣，相互联系，循环，整体，全面，系统"},{"sub":"【答题思路】联系的含义及特性","text":"【答题要点】联系是指事物内部各要素之间和事物之间相互影响、相互制约、相互作用的关系。联系具有客观性、普遍性、多样性和条件性的特点。任何事物内部各要素是相互联系的，事物与其他事物之间是相互联系的，整个世界是相互联系的。要求人们善于分析事物的具体联系，确立整体、开放性观念，从动态中考察事物的普遍联系。"},{"sub":"【答题思路】联系的含义及特性","text":"热点链接3：矛盾的斗争性与同一性设问方法：矛盾双方相互冲突，相互转化，平衡，和谐；相生相克；斗争精神"},{"sub":"【答题思路】斗争性与同一性的含义、关系","text":"【答题要点】矛盾的同一性是指矛盾双方相互依存、相互贯通的性质和趋势。矛盾的斗争性是矛盾着的对立面之间相互排斥、相互分离的性质和趋势。矛盾的同一性和斗争性相互联结、相互制约。这要求我们在分析和解决矛盾时，必须从对立中把握同一，从同一中把握对立。"},{"sub":"【答题思路】斗争性与同一性的含义、关系","text":"热点链接4：矛盾的普遍性与特殊性设问方法：解决问题方式多种多样，具体问题具体分析，因地制宜，个别到一般，举一反三，共性与个性，中国式现代化，马克思主义中国化"},{"sub":"【答题思路】普遍性与特殊性的含义、关系及方法论","text":"【答题要点】矛盾的普遍性是指矛盾无处不在，无时不有。矛盾的特殊性是指各个具体事物的矛盾，每一个矛盾的各个方面在发展的不同阶段上各有其特点。任何事物都是共性和个性的有机统一，矛盾的普遍性即矛盾的共性，矛盾的特殊性即矛盾的个性。共性是无条件的绝对的，个性是有条件的相对的。没有离开个性的共性，也没有离开共性的个性，共性寓于个性之中。人的认识的一般规律就是由个别到一般，再由一般到个别的辩证发展过程。我们要承认矛盾，正视矛盾，具体问题具体分析。"},{"sub":"【答题思路】普遍性与特殊性的含义、关系及方法论","text":"23热点链接5：矛盾的不平衡性设问方法：党的中心任务、首要目标、主要矛盾、主要方面、抓住牛鼻子"},{"sub":"【答题思路】主次矛盾、主次方面","text":"【答题要点】主要矛盾处于支配地位，对事物的发展起决定作用，规定和影响其他矛盾的存在和发展。次要矛盾处于从属地位，对事物发展起次要作用。抓住了主要矛盾，就能找到解决问题的方法，并促进其他矛盾的解决。事物的性质是由主要矛盾的主要方面所规定的。抓住事物主要矛盾的主要方面，就抓住了解决矛盾的关键。这要求我们坚持“两点论”和“重点论”的统一，看问题既要全面地看，又要看主流、大势、发展趋势。"},{"sub":"【答题思路】主次矛盾、主次方面","text":"热点链接6：量变与质变设问方法：量的积累引起质的飞跃；积少成多；量的积累"},{"sub":"【答题思路】量变与质变的含义、关系","text":"【答题要点】量变是事物数量的增减和次序的变动，是保持事物的质的相对稳定的不显著的变化，体现了事物渐进过程的连续性。质变是事物性质的根本变化，是事物由一种质态向另一种质态的飞跃，体现了事物渐进性和连续性的中断。量变和质变是辩证统一的，量变是质变的必要准备，质变是量变的必然结果，量变和质变相互渗透。量变质变规律体现了事物发展渐进性和飞跃性的统一，要积极做好量的积累，为实现事物的质变创造条件。"},{"sub":"【答题思路】量变与质变的含义、关系","text":"热点链接7：现象与本质设问方法：通过大量例子，概括总结背后本质理论/制度/经验，调查研究"},{"sub":"【答题思路】现象与本质的关系","text":"【答题要点】本质是事物的根本性质，是构成事物的诸要素之间的内在联系。现象是事物的外部联系和表面特征，是事物本质的外在表现。二者相互区别、相互依存、相互渗透。本质决定现象，现象表现本质，要求我们准确辨别真象和假象，透过现象把握本质，不断深化对事物本质的认识。"},{"sub":"【答题思路】现象与本质的关系","text":"热点链接8：原因与结果设问方法：不同原因引发不同的结果"},{"sub":"【答题思路】原因与结果的关系","text":"【答题要点】在事物的普遍联系中，引起某种现象的现象就是原因，被某种现象所引起的现象就是结果。原因与结果是相互区别、相互依存、在一定条件下相互转化。辩证地分析事物的因果关系，分析存在和发展的不同原因及其不同结果，可以增强人们活动的自觉性、预测性和调控性。"},{"sub":"【答题思路】原因与结果的关系","text":"热点链接9：必然与偶然设问方法：重视规律与趋势，善于识别和把握机遇"},{"sub":"【答题思路】必然与偶然的关系","text":"【答题要点】必然与偶然是揭示事物产生、发展和衰亡过程中的不同趋势的一对范畴。必24然是指事物联系与发展中确定不移的趋势。偶然是指事物联系与发展中不确定的趋势。必然与偶然相互依存，相互转化。在我们的认识和实践中，必须重视事物发展的必然规律和发展趋势，并以此为依据制定我们的目标和计划，同时也要充分估计到各种偶然因素的作用，善于敏锐地识别和把握机遇，在实践中达到预期的目标。"},{"sub":"【答题思路】必然与偶然的关系","text":"热点链接10：辩证思维设问方法：辩证思维分析问题，体现了什么样的辩证思维"},{"sub":"【答题思路】辩证思维模板","text":"【答题要点】辩证思维要求我们必须用联系的、发展的、全面的观点看问题。从对立中把握统一，在统一中把握对立，具体问题具体分析，坚持两点论与重点论相统一。我们还要透过现象看本质，重视必然把握偶然，全面把握事物因果联系，立足现实展望未来。"},{"sub":"【答题思路】辩证思维模板","text":"热点链接11：实践与认识的辩证关系及其运动规律设问方法一：推动理论思想不断发展、认识的能动作用；知与行"},{"sub":"【答题思路】认识的本质、认识发展规律、实践与认识辩证关系、认识能动作用","text":"【答题要点】认识是主体在实践基础上对客体的能动反映，实践是人类能动的改造世界的客观物质性活动。认识的发展是从感性认识到理性认识，以理性认识去指导实践，是实践、认识、再实践、再认识，循环反复和无限发展的过程。实践决定认识，实践是认识的基础、来源、动力、目的和检验标准。认识能动反作用于实践，认识具有目的性、计划性和创造性，认识能够指导实践改造世界。"},{"sub":"【答题思路】认识的本质、认识发展规律、实践与认识辩证关系、认识能动作用","text":"设问方法二：创新、理论创新、实践创新、守正创新"},{"sub":"【答题思路】实践创新与理论创新的关系、守正创新","text":"【答题要点】创新是社会发展的不竭动力，实践创新为理论创新提供不竭的动力源泉，理论创新为实践创新提供科学的行动指南，我们要努力实现理论创新和实践创新的良性互动，做到守正创新。守正创新深刻揭示了坚持真理与发展真理，坚持马克思主义与发展马克思主义的辩证关系。要坚持守正不动摇。守正，就是坚持实事求是，坚持真理性认识，坚持正确政治方向。要坚持创新不停步。创新，就是坚持解放思想，破除与客观事物进程不相符合的旧观念、旧理论、旧模式、旧做法，发现和运用事物的新联系、新规律，更有效地认识世界和改造世界。守正是创新的前提和基础，创新是守正的目的和路径。"},{"sub":"【答题思路】实践创新与理论创新的关系、守正创新","text":"热点链接12：真理的绝对性与相对性设问方法：以真理的精神追求真理，一般题干指定原理时使用"},{"sub":"【答题思路】真理绝对性与相对性的含义及关系","text":"【答题要点】真理的绝对性是指真理主客观统一的确定性和发展的无限性。真理的相对性是指人们在一定条件下对客观事物及其本质和发展规律的正确认识总是有限度的、不完善的。"},{"sub":"【答题思路】真理绝对性与相对性的含义及关系","text":"真理的绝对性与相对性辩证统一，相互依存、相互渗透，真理的绝对性寓于真理的相对性之25中，真理的相对性包含并表现着真理的绝对性。人类认识是一个不断深化的过程，是从真理的相对性走向绝对性、接近绝对性的永无止境的过程。要求人们必须以科学的态度对待一切真理，既要反对绝对主义又要反对相对主义。"},{"sub":"【答题思路】真理绝对性与相对性的含义及关系","text":"热点链接13：真理与谬误"},{"sub":"【答题思路】真理绝对性与相对性的含义及关系","text":"【答题线索】错误变智慧，错误变经典，失败变成功。"},{"sub":"【答题思路】真理绝对性与相对性的含义及关系","text":"【背诵要点】真理是人们对客观事物及其规律的正确反映，谬误是人们对客观事物及其规律的歪曲反映。真理与谬误相互对立、相互依存，在一定条件下能够相互转化。真理和谬误在一定范围内的对立是绝对的，但超出一定范围，它们就会互相转化。要求人们善于坚持和发展真理，敢于和谬误作斗争。"},{"sub":"【答题思路】真理绝对性与相对性的含义及关系","text":"热点链接14：真理与价值设问方法：评价多元、符合规律与符合目的"},{"sub":"【答题思路】真理与价值关系、价值评价特性","text":"【答题要点】真理尺度是指人们必须遵循正确反映客观事物本质和规律的真理。价值尺度是人们都按照自己的尺度和需要去认识世界和改造世界。任何成功的实践都是真理尺度和价值尺度的统一，是合规律性和合目的性的统一。要求人们在实践过程中，既要坚持真理尺度，又要坚持价值尺度，一方面，价值尺度必须以真理为前提；另一方面，人类自身需要的内在尺度，推动着人们不断发现新的真理。"},{"sub":"【答题思路】真理与价值关系、价值评价特性","text":"热点链接15：科技设问方法：新质生产力、互联网、信息技术、人工智能、辩证看待科技的作用"},{"sub":"【答题思路】科技的作用、科技是双刃剑","text":"【答题要点】科学技术是推动社会发展的重要动力，能够改变我们的生产方式、生活方式和思维方式。但科技是一把双刃剑，既可通过促进经济和社会发展造福于人类。同时，科技作用的发挥，一方面受到客观条件，诸如社会制度、利益关系等因素的影响，另一方面也受到一定的主观条件，如人们的观念和认识水平的影响。在一定条件下对人类的生存和发展带来消极影响。正确认识和运用科学技术，首先要有合理的社会制度保障科技的正确运用，始终坚持使科技为人类社会的健康发展服务，让科技为人类造福。"},{"sub":"第二部分 毛中特、习思想重要考点预测热点链接：《中华人民共和国生态环境法典》设问方法一：","text":"1.如何理解“高质量发展和高水平保护是相辅相成、相得益彰的”？"},{"sub":"【答题思路】绿水青山就是金山银山的理念内涵、编纂生态环境法典的意义","text":"【答题要点】生态环境问题归根到底是经济发展方式和生活方式问题。绿水青山就是金山银山，阐述了经济发展和生态环境保护的关系，揭示了保护生态环境就是保护生产力、改善生态环境就是发展生产力的道理。处理好绿水青山和金山银山的关系，关键在人，关键在思路。"},{"sub":"【答题思路】绿水青山就是金山银山的理念内涵、编纂生态环境法典的意义","text":"高质量发展和高水平保护是相辅相成、相得益彰的。高水平保护是高质量发展的重要支撑，生态优先、绿色低碳的高质量发展只有依靠高水平保护才能实现。编纂生态环境法典，对于同步推进高质量发展与高水平保护意义重大，有助于更好实现在发展中保护、在保护中发展。"},{"sub":"【答题思路】绿水青山就是金山银山的理念内涵、编纂生态环境法典的意义","text":"设问方法二："},{"sub":"【答题思路】绿水青山就是金山银山的理念内涵、编纂生态环境法典的意义","text":"1.如何理解“让中国式现代化的底色更加亮丽”？"},{"sub":"【答题思路】中国式现代化的内涵、生态文明建设的重要性","text":"【答题要点】中国式现代化是人与自然和谐共生的现代化。必须牢固树立和践行绿水青山就是金山银山的理念，坚持节约优先、保护优先、自然恢复为主的方针，坚定不移走生产发展、生活富裕、生态良好的文明发展道路，实现中华民族永续发展。生态文明建设是关系中华民族永续发展的根本大计。我国生态环境保护发生历史性、转折性、全局性变化，美丽中国建设迈出重大步伐，创造了举世瞩目的生态奇迹和绿色发展奇迹。今年是“十五五”开局之年，生态环境法典正式施行，坚持以习近平生态文明思想作为法典实施的根本遵循，定能厚植中国式现代化的绿色底色。"},{"sub":"【答题思路】中国式现代化的内涵、生态文明建设的重要性","text":"热点链接：“十五五”规划纲要设问方法一："},{"sub":"【答题思路】中国式现代化的内涵、生态文明建设的重要性","text":"1.“十五五”时期经济社会发展为什么必须遵循党的全面领导？"},{"sub":"【答题思路】中国式现代化的内涵、生态文明建设的重要性","text":"2.如何理解坚持党的全面领导是“十五五”时期经济社会发展必须遵循的首要原则，也是推进中国式现代化的根本保证？"},{"sub":"【答题思路】党的领导","text":"【答案要点】中国式现代化，是中国共产党领导的社会主义现代化。办好中国的事情，关键在党。中国共产党的领导是中国特色社会主义最本质的特征，是中国特色社会主义制度的最大优势，加强党的全面领导为新时代党和国家事业发展提供了坚强保证。坚持党对一切工作的领导，党的领导是全面的、系统的、整体的，要维护党中央权威和集中统一领导。党的领导制度是我国的根本领导制度。"},{"sub":"【答题思路】党的领导","text":"设问方法二："},{"sub":"【答题思路】党的领导","text":"1.如何理解“十五五”规划纲要坚持以推动高质量发展为主题？"},{"sub":"【答题思路】高质量发展、经济发展","text":"【答案要点】高质量发展，是“十五五”时期我国经济社会发展的主题，是全面建设社会主义现代化国家的首要任务，是能够很好满足人民日益增长的美好生活需要的发展，是体现新发展理念的发展，是创新成为第一动力、协调成为内生特点、绿色成为普遍形态、开放成为27必由之路、共享成为根本目的的发展。高质量发展为全面建设社会主义现代化国家提供更为坚实的物质基础，是不断满足人民对美好生活需要的重要保证，是维护国家长治久安的必然要求。"},{"sub":"【答题思路】高质量发展、经济发展","text":"设问方法三："},{"sub":"【答题思路】高质量发展、经济发展","text":"1.如何理解“推动科技创新和产业创新深度融合，引领发展新质生产力”？"},{"sub":"【答题思路】科技创新、产业创新","text":"【答案要点】新质生产力以劳动者、劳动资料、劳动对象及其优化组合的跃升为基本内涵，以全要素生产率大幅提升为核心标志。推动科技创新和产业创新深度融合，这是以高水平科技自立自强引领发展新质生产力的关键。科技创新是发展新质生产力的核心要素，产业创新是科技创新转化为现实生产力的关键载体。推动科技创新和产业创新深度融合，有助于打破技术与产业的壁垒，加快构建现代化产业体系，培育形成新质生产力，增强发展新动能。"},{"sub":"【答题思路】科技创新、产业创新","text":"热点链接：二十届五中全会设问方法一："},{"sub":"【答题思路】科技创新、产业创新","text":"1.新时代全面从严治党取得了哪些伟大成就？"},{"sub":"【答题思路】全面从严治党的成就","text":"【答案要点】坚定不移全面从严治党，从根本上扭转了管党治党宽松软状况，刹住了一些长期没有刹住的歪风，纠治了一些多年未除的顽瘴痼疾，消除了党、国家、军队内部存在的严重隐患，党在革命性锻造中更加坚强有力。新时代全面从严治党开辟了百年大党自我革命新境界，推动党和国家事业取得历史性成就、发生历史性变革，党和人民赢得强党强国的历史主动。"},{"sub":"【答题思路】全面从严治党的成就","text":"设问方法二："},{"sub":"【答题思路】全面从严治党的成就","text":"1.新时代全面从严治党要坚持哪些原则？"},{"sub":"【答题思路】全面从严治党的原则","text":"【答案要点】坚持服务使命任务，坚持以党的政治建设为统领，坚持全面从严，坚持问题导向，坚持守正创新，坚持以上率下，坚持依规治党。"},{"sub":"【答题思路】全面从严治党的原则","text":"设问方法三："},{"sub":"【答题思路】全面从严治党的原则","text":"1.新时代为何要全面从严治党？"},{"sub":"【答题思路】全面从严治党面临的困难考验和全面从严治党的要求","text":"【答案要点】随着世情国情党情发生深刻变化，党团结带领人民维护国家主权、安全、发展利益任务更加艰巨，党团结带领人民推动改革发展、维护社会和谐稳定任务更加艰巨，党保持先进性和纯洁性任务更加艰巨。全党必须坚定信心，把新时代全面从严治党宝贵经验坚持好、运用好，把党的建设面临的突出问题整治好、解决好，把管党治党形成的良好政治局面巩固好、发展好。"},{"sub":"【答题思路】全面从严治党面临的困难考验和全面从严治党的要求","text":"第三部分 史纲重要考点预测热点链接1：辛亥革命115周年设问方法一：为什么武昌城头一声枪响，为近代以来中国发生的深刻社会变革拉开了序幕？"},{"sub":"【答题思路】辛亥革命的意义","text":"【答题要点】辛亥革命是一次比较完全意义上的资产阶级民主革命。它推翻了清王朝的统治；结束了中国延续两千多年的封建君主专制制度，建立了中国历史上第一个资产阶级共和政府，使民主共和的观念开始深入人心；推动了中国人民的思想解放；推动了中国的社会变革；在一定程度上打击了帝国主义的侵略势力。"},{"sub":"【答题思路】辛亥革命的意义","text":"设问方法二：为什么辛亥革命没有能够改变中国半殖民地半封建的社会性质和人民的悲惨境遇？"},{"sub":"【答题思路】失败原因和教训","text":"【答题要点】从根本上说因为在帝国主义时代，在半殖民地半封建的中国，资本主义的建国方案行不通。主观方面是资产阶级革命派本身存在弱点和错误：第一，没有提出彻底的反帝反封建的革命纲领。第二，不能充分发动和依靠人民群众。第三，不能建立坚强的革命政党。"},{"sub":"【答题思路】失败原因和教训","text":"资产阶级革命派的这些弱点、错误，根源于中国民族资产阶级的软弱性和妥协性。"},{"sub":"【答题思路】失败原因和教训","text":"设问方法三：为什么说中国共产党人是孙中山先生开创的革命事业最坚定的支持者、最亲密的合作者、最忠实的继承者？"},{"sub":"【答题思路】中国共产党人与孙中山开创革命事业的关系","text":"【答题要点】辛亥革命虽然没有能够改变中国半殖民地半封建的社会性质和人民的悲惨境遇，但是它为中国的进步打开了闸门，为中国共产党的诞生准备了客观社会条件。辛亥革命促进了民族资本的发展，为中国共产党成立准备了阶级基础；辛亥革命促进了新思想的传播，为中国共产党成立准备了理论基础；辛亥革命也为中国共产党成立准备了干部条件。"},{"sub":"【答题思路】中国共产党人与孙中山开创革命事业的关系","text":"中国共产党人是孙中山先生开创的革命事业最坚定的支持者、最亲密的合作者、最忠实的继承者。中国共产党继承和发展的是辛亥革命为实现民族独立和人民解放而进行的反帝反封建斗争，是为争取国家繁荣富强和人民共同富裕的中华民族伟大复兴事业。"},{"sub":"【答题思路】中国共产党人与孙中山开创革命事业的关系","text":"热点链接2：中国共产党成立105周年设问方法一：简述中国共产党一路走来的百年历程？"},{"sub":"【答题思路】党的百年历程","text":"【答题要点】一百年来，中国共产党团结带领中国人民进行的一切奋斗、一切牺牲、一切创造，归结起来就是一个主题：实现中华民族伟大复兴。"},{"sub":"【答题思路】党的百年历程","text":"①中国共产党创造了新民主主义革命的伟大成就，为实现中华民族伟大复兴创造了根本社会条件；②创造了社会主义革命和建设的伟大成就，为实现中华民族伟大复兴奠定了根本政治前提和制度基础；③创造了改革开放和社会主义现代化建设的伟大成就，为实现中华民族伟大复兴提供了充满新的活力的体制保证和快速发展的物质条件；④创造了新时代中国特色社会主义的伟大成就，为实现中华民族伟大复兴提供了更为完善的制度保证、更为坚实的物质29基础、更为主动的精神力量。"},{"sub":"【答题思路】党的百年历程","text":"设问方法二：经过105年的不懈奋斗，中国共产党的五大历史成就？"},{"sub":"【答题思路】中国共产党的五大历史成就","text":"【答题要点】①105年不懈奋斗，从根本上改变了中国人民的前途命运。我们党领导人民推翻三座大山，建立人民当家作主的新中国，彻底结束旧中国半殖民地半封建社会的历史，实现人民生活从温饱不足到总体小康再到全面小康的历史性跨越。②105年不懈奋斗，开辟了实现中华民族伟大复兴的正确道路。我们党领导人民历尽千辛万苦，成功开辟和坚持了中国特色社会主义道路，仅用几十年时间就走完发达国家几百年走过的工业化历程，创造了经济快速发展和社会长期稳定两大奇迹。③105年不懈奋斗，展示了马克思主义的强大生命力。"},{"sub":"【答题思路】中国共产党的五大历史成就","text":"我们党坚持把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，不断推进马克思主义中国化时代化，形成毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观、习近平新时代中国特色社会主义思想，极大丰富和发展了马克思主义。④105年不懈奋斗，深刻影响了世界历史进程。我们党始终站在历史正确一边、站在人类文明进步的一边，以自强不息的奋斗深刻改变了世界发展的趋势和格局。⑤105年不懈奋斗，锻造了强大的中国共产党。我们党牢记马克思主义政党的性质宗旨和奋斗目标，大力弘扬伟大建党精神，历经磨难斗志弥坚，千锤百炼更加坚强。"},{"sub":"【答题思路】中国共产党的五大历史成就","text":"设问方法三：中国共产党之所以能够在105年奋斗中不断铸就辉煌，历史和人民之所以选择中国共产党，根本在于我们党具有其他政党和政治力量无可比拟的哪些优秀特质？"},{"sub":"【答题思路】中国共产党的六大优秀特质","text":"【答题要点】①矢志追求真理，始终把准前进方向。我们党把马克思主义作为改造主观世界和客观世界的强大思想武器，坚持解放思想、实事求是、与时俱进、求真务实，确保党和人民事业沿着正确方向前进。②深深植根人民，始终拥有坚实根基。我们党坚持立党为公、执政为民，自觉践行全心全意为人民服务的根本宗旨，拥有任何风浪都动摇不了的坚实根基。"},{"sub":"【答题思路】中国共产党的六大优秀特质","text":"③勇担历史使命，始终掌握战略主动。我们党胸怀共产主义远大理想、立志于中华民族千秋伟业，制定和实施正确的路线方针政策，确保牢牢掌握事业发展的领导权和主动权。④顺应发展潮流，始终走在时代前列。我们党秉持高度的历史自觉和宽广的世界眼光，清醒把握中国国情和时代主题，积极识变应变求变，锐意开拓进取，成为当之无愧的时代先锋、民族脊梁。⑤敢于善于斗争，始终保持必胜信心。我们党坚持和发扬不怕牺牲、英勇斗争的精神，以任凭风雨来袭、我自岿然不动的钢铁意志鼓舞全国人民不断从胜利走向胜利。⑥注重强健自身，始终充满生机活力。我们党清醒认识到打铁还需自身硬，善于以时代发展要求审视自己、以强烈忧患意识警醒自己、以自我革命精神完善自己，在革命性锻造中更加坚强有力。"},{"sub":"【答题思路】中国共产党的六大优秀特质","text":"这些优秀特质，是中国共产党为什么能的关键密码。我们要结合新的实际，把党的优秀特质不断发扬光大，确保党永远不变质不变色不变味，始终具有强大创造力凝聚力战斗力。"},{"sub":"【答题思路】中国共产党的六大优秀特质","text":"设问方法四：“功崇惟志，业广惟勤。”实现新时代新征程党的使命任务，要求全体中国共产党人如何去创造无愧于时代和人民的新业绩？"},{"sub":"【答题思路】中国共产党坚定信心、接续奋斗的五个必须","text":"【答题要点】①坚定信心、接续奋斗，必须坚持党的基本理论、基本路线、基本方略。新征程上，全党必须保持道不变、志不改的定力，坚持党的全面领导和党中央集中统一领导，深入贯彻习近平新时代中国特色社会主义思想，坚定道路自信、理论自信、制度自信、文化自信。②必须紧紧依靠人民创造历史伟业。新征程上，全党必须进一步提振干事创业的精气神，团结带领全国各族人民开拓进取。③必须积极应对前进道路上的风险挑战。新征程上，全党必须强化忧患意识、坚持底线思维，发扬斗争精神、增强斗争本领，确保中华复兴号巨轮劈波斩浪、行稳致远。④必须持续推动构建人类命运共同体。新征程上，我们要顺应人心所向、大势所趋，高举和平、发展、合作、共赢旗帜，弘扬全人类共同价值，推动构建新型国际关系，推动落实全球发展倡议、全球安全倡议、全球文明倡议、全球治理倡议，为世界和平与发展注入更多正能量。⑤必须持之以恒推进全面从严治党。新征程上，必须全面贯彻新时代党建思想，落实新时代党的建设总要求，以党的政治建设为统领加强党的各方面建设，坚决打好反腐败斗争攻坚战持久战总体战，不断增强党的政治领导力、思想引领力、群众组织力、社会号召力，确保党在新时代坚持和发展中国特色社会主义的历史进程中始终成为坚强领导核心。"},{"sub":"【答题思路】中国共产党坚定信心、接续奋斗的五个必须","text":"热点链接3：红军长征胜利90周年设问方法一：如何理解“长征胜利是必然的，其中蕴含着党和人民军队铿锵前进的制胜之道”？"},{"sub":"【答题思路】长征胜利的原因","text":"【答题要点】红军长征的伟大胜利之路，是依靠党的正确领导走出来的。长征初期，“左”倾路线的错误给党和红军造成极大损失，遵义会议后，党和红军获得新的生命，一路闯关夺隘并战胜分裂主义，最终取得长征胜利。历史雄辩地证明，党的正确领导和毛泽东同志核心地位的确立，对于红军长征胜利具有决定性意义。红军长征的伟大胜利之路，是依靠坚定的革命意志走出来的。用钢铁意志武装起来的共产党员和红军将士，挨饿受冻不拿群众一针一线，截掉伤腿还誓要爬到陕北，奏响了一曲曲感天动地的英雄凯歌。历史雄辩地证明，革命理想、革命信念能够迸发出克顽敌、撼山岳的无穷力量，具有崇高理想和坚定信念的队伍是不可战胜的。红军长征的伟大胜利之路，是依靠独立自主、实事求是走出来的。正是在党的正确路线指引下，红军作战指挥实行了一系列符合实际、机动灵活的战略战术，从而成功突破敌人层层封锁，不断走向新生、走向胜利。历史雄辩地证明，马克思主义基本原理只有同中国具体实际紧密结合，才能解决中国的问题，才能展现出强大生命力。红军长征的伟大胜利之路，是依靠广大人民群众支持走出来的。长征一路走来，宣传了党的主张，播撒下革命火种，极大增强了党和红军的凝聚力和战斗力。历史雄辩地证明，人民群众永远是党和人民军队的力量源泉和坚强后盾，只要我们深深植根人民、始终保持同人民群众的血肉联系，党的事业就无往而不胜。"},{"sub":"【答题思路】长征胜利的原因","text":"设问方法二："},{"sub":"【答题思路】长征胜利的原因","text":"1. 如何理解“长征是宣言书，长征是宣传队，长征是播种机”？"},{"sub":"【答题思路】长征胜利的原因","text":"2. 为什么说长征的胜利既是“中国革命力量生存发展新的落脚点”，也是“中国革命事业胜利前进新的出发点”？"},{"sub":"【答题思路】长征胜利的原因","text":"3. 为什么说红军长征实现了中国共产党和中国革命事业从挫折走向胜利的伟大转折？"},{"sub":"【答题思路】长征胜利的意义","text":"【答题要点】中国工农红军长征是一次理想信念的伟大远征，是一次检验真理的伟大远征，是一次唤醒民众的伟大远征，是一次开创新局的伟大远征。"},{"sub":"【答题思路】长征胜利的意义","text":"长征的胜利，极大地促进了党在政治上和思想上的成熟。中国共产党进一步认识到，只有把马克思主义基本原理同中国革命具体实际结合起来，独立自主解决中国革命的重大问题，才能把革命事业引向胜利。"},{"sub":"【答题思路】长征胜利的意义","text":"红军的长征宣告了国民党反动派消灭中国共产党和红军的图谋彻底失败，宣告了中国共产党和红军肩负着民族希望胜利实现了北上抗日的战略转移，实现了中国共产党和中国革命事业从挫折走向胜利的伟大转折。第一，长征的胜利标志着中国共产党领导的革命力量有了新的落脚点和战略基地。第二，红军长征铸就了伟大的长征精神。第三，长征一结束，中国革命的新局面就开始了，我们即将迎接全国性抗日战争。"},{"sub":"【答题思路】长征胜利的意义","text":"设问方法三：结合材料，“新征程是充满光荣和梦想的远征，是党和人民的新长征。抚今追昔、展望未来，我们要大力弘扬伟大长征精神，同心协力走好新的长征路”。我们该如何走好新的长征路？"},{"sub":"【答题思路】走好新长征路的举措","text":"【答题要点】弘扬伟大长征精神、走好新的长征路，必须坚守党的理想信念宗旨。新征程上，我们要全面贯彻习近平新时代中国特色社会主义思想，坚定对马克思主义的信仰、对社会主义和共产主义的信念，牢记初心使命，坚持全心全意为人民服务的根本宗旨，紧紧依靠人民创造新的历史伟业。弘扬伟大长征精神、走好新的长征路，必须坚定不移推动高质量发展、不断满足人民日益增长的美好生活需要。新征程上，我们要统筹推进“五位一体”总体布局，协调推进“四个全面”战略布局，完整准确全面贯彻新发展理念，加快构建新发展格局，坚持稳中求进工作总基调，推动经济实现质的有效提升和量的合理增长，促进社会全面进步，坚持发展为了人民、发展依靠人民、发展成果由人民共享，促进全体人民共同富裕。弘扬伟大长征精神、走好新的长征路，必须勇于进行具有许多新的历史特点的伟大斗争。新征程上，面对错综复杂的国际国内形势，我们要敢于斗争、善于斗争，以历史主动精神克难关、战风险、迎挑战，确保中华复兴号巨轮劈波斩浪、行稳致远。弘扬伟大长征精神、走好新的长征路，必须加快把人民军队建成世界一流军队。新征程上，我们要全面贯彻新时代党的强军思想，始终坚持党对人民军队的绝对领导，全面推进政治建军、改革强军、科技强军、人才强军、依法治军，谱写无愧于革命前辈、无愧于百年基业、无愧于新时代的强军兴军新篇章。"},{"sub":"【答题思路】走好新长征路的举措","text":"弘扬伟大长征精神、走好新的长征路，必须坚持党的领导、加强党的建设。党的领导和党的建设是事业发展的根本保证。新征程上，我们要深入贯彻新时代党建思想，落实新时代党的建设总要求，坚持党的全面领导和党中央集中统一领导，持之以恒推进全面从严治党，持续增强党的政治领导力、思想引领力、群众组织力、社会号召力，确保党始终成为中国特色社会主义事业的坚强领导核心。"},{"sub":"【答题思路】走好新长征路的举措","text":"32设问方法四：结合材料，如何理解习近平总书记指出的“精神所在，就是力量所在”？"},{"sub":"【答题思路】长征精神","text":"【答题要点】红军长征创造了非凡的人间奇迹，铸就了伟大长征精神。伟大长征精神，就是把全国人民和中华民族的根本利益看得高于一切，坚定革命的理想和信念，坚信正义事业必然胜利的精神；就是为了救国救民，不怕任何艰难险阻，不惜付出一切牺牲的精神；就是坚持独立自主、实事求是，一切从实际出发的精神；就是顾全大局、严守纪律、紧密团结的精神；就是紧紧依靠人民群众，同人民群众生死相依、患难与共、艰苦奋斗的精神。"},{"sub":"【答题思路】长征精神","text":"精神所在，就是力量所在。伟大长征精神充分彰显了忠诚的力量、真理的力量、正义的力量、团结的力量，它作为中国共产党人精神谱系的重要组成部分，跨越时空、历久弥新，永远是激励我们战胜困难、勇往直前的宝贵财富和强大动力。"},{"sub":"【答题思路】长征精神","text":"热点链接4：三大改造、社会主义制度确立70周年设问方法一：如何理解社会主义制度的确立为当代中国一切发展进步奠定了根本政治前提和制度基础？"},{"sub":"【答题思路】社会主义制度确立的意义","text":"【答题要点】中华人民共和国成立、社会主义制度的建立，是中华民族有史以来最为广泛而深刻的社会变革，为当代中国一切发展进步奠定了根本政治前提和制度基础。第一，社会主义基本制度的确立极大地提高了工人阶级和广大劳动人民的积极性、创造性，为社会生产力的大发展开辟了广阔道路。第二，社会主义基本制度的确立为当代中国的一切发展进步提供了根本政治保障。第三，社会主义基本制度的确立为社会主义先进文化的发展指明了前进方向。"},{"sub":"【答题思路】社会主义制度确立的意义","text":"设问方法二：为什么说，我国成功走出一条适合中国特点的社会主义改造道路，是对科学社会主义的创造性运用与发展？"},{"sub":"【答题思路】社会主义改造的历史经验","text":"【答题要点】第一，坚持社会主义工业化建设与社会主义改造同时并举。实践证明，党坚持社会主义改造与社会主义工业化同时并举的方针，对于在深刻的社会变革中保持社会稳定，促进生产力发展，逐步改善人民生活，推动社会进步，都具有十分重要的意义。"},{"sub":"【答题思路】社会主义改造的历史经验","text":"第二，采取积极引导、逐步过渡的方式。我国对农业、手工业和资本主义工商业的改造，都采取了区别对象、积极引导、逐步过渡的方式。中国这场巨大而深刻的社会变革，不仅没有对生产力的发展造成破坏，而且促进了生产力的发展。"},{"sub":"【答题思路】社会主义改造的历史经验","text":"第三，用和平方法进行改造。事实证明，和平改造解决了诸如社会变革与经济发展、和平过渡与消灭剥削制度这类通常难以解决的矛盾。"},{"sub":"【答题思路】社会主义改造的历史经验","text":"第四部分 思想道德与法治重要考点预测热点链接1：中国共产党成立105周年大会、授予“七一勋章”、全国劳动模范和先进工作者表彰设问方法一：“七一勋章”获得者、全国劳动模范和先进工作者的事迹体现了怎样的爱国主义精神？"},{"sub":"【答题思路】爱国主义内涵和意义、新时代爱国主义、青年怎样做","text":"【答题要点】①爱国主义体现了人们对自己祖国的深厚感情，揭示了个人对祖国的依存关系，是调节个人与祖国之间关系的道德要求、政治原则和法律规范，也是中华民族伟大民族精神的核心。爱国主义是中华民族的民族心、民族魂，是中华民族最重要的精神财富，深深植根于中华民族心中，维系着中华大地上各个民族的团结统一，激励着一代又一代中华儿女为祖国发展繁荣而自强不息、不懈奋斗。今天，爱国主义已经成为全体中国人民的坚定信念、精神力量和自觉行动，为强国建设、民族复兴伟业凝聚起历久弥新、生生不息的奋进力量。"},{"sub":"【答题思路】爱国主义内涵和意义、新时代爱国主义、青年怎样做","text":"②在今天弘扬新时代的爱国主义，必须坚持爱国爱党爱社会主义相统一，维护祖国统一和民族团结、尊重和传承中华民族历史文化，坚持立足中国又面向世界。要树立服务人民、奉献社会的远大理想信念，增强自身的本领担当，与历史同向，与祖国同行，与人民同在，在实践奋斗中让爱国主义成为每一个中国人的坚定信念和精神依靠。"},{"sub":"【答题思路】爱国主义内涵和意义、新时代爱国主义、青年怎样做","text":"设问方法二：****的事例对新时代青年实现人生价值有何启示？"},{"sub":"【答题思路】评价人生价值的根本尺度和做法、个人与社会的关系、人生价值的实现","text":"【答题要点】人生价值内在地包含了人生的自我价值和社会价值两个方面。自我价值是个体生存和发展的必要条件，是个体为社会创造更大价值的前提。社会价值是社会存在和发展的重要条件，是个体自我完善、全面发展的保障。评价人生价值的根本尺度，是看一个人的实践活动是否符合社会发展的客观规律，是否促进了历史的进步。在今天，衡量人生价值的标准最重要的就是看一个人是否用自己的劳动和聪明才智为国家和社会真诚奉献，为人民群众尽心尽力服务。要正确评价人生价值，既要看贡献大小，也要看尽力的程度；既要尊重物质贡献，也要尊重精神贡献；既要注重社会奉献，也要注重自身完善。任何人都只能在一定的主客观条件下去实现自己的人生价值，要从社会客观条件出发，从个体自身条件出发，不断增强实现人生价值的能力和本领。辩证对待人生矛盾，反对错误人生观，与历史同向，与祖国同行，与人民同在，在社会实践中成就出彩人生。"},{"sub":"【答题思路】评价人生价值的根本尺度和做法、个人与社会的关系、人生价值的实现","text":"设问方法三：新时代新征程上，全国各族青年应如何努力跑好历史接力赛？"},{"sub":"【答题思路】新时代青年怎样做、艰苦奋斗","text":"【答题要点】青年是实现中华民族伟大复兴的生力军。新时代中国青年要坚定不移听党话、跟党走，树立远大志向，勇担时代重任，在新征程上跑好历史接力赛，用青春铺路、让理想闪光。新时代青年要有崇高的理想信念，牢记使命，自信自励；要与历史同向、与祖国同行、与人民同在；敢想敢为又善作善成，立志做有理想、敢担当、能吃苦、肯奋斗的新时代好青年，让青春在全面建设社会主义现代化国家的火热实践中绽放绚丽之花。"},{"sub":"【答题思路】新时代青年怎样做、艰苦奋斗","text":"34设问方法四：表彰“七一勋章”获得者对弘扬社会主义核心价值观有何作用？"},{"sub":"【答题思路】弘扬社会主义核心价值观的作用和意义","text":"【答题要点】社会主义核心价值观是坚持和发展中国特色社会主义的价值遵循，是提高国家文化软实力的迫切要求，是增进社会团结奋进的最大公约数。表彰“七一勋章”获得者，号召青年学习榜样先锋，引领社会风气，有利于弘扬和践行社会主义核心价值观，能够为实现中国梦凝聚力量，能够巩固全党全国人民团结奋斗的共同思想基础，对于促进人的全面发展、引领社会全面进步，具有重要现实意义和深远历史意义。他们的事迹可学可做，他们的精神可追可及。"},{"sub":"【答题思路】弘扬社会主义核心价值观的作用和意义","text":"热点链接2：长征胜利90周年设问方法一：红军的英雄事迹彰显了怎样的中国精神？"},{"sub":"【答题思路】英雄、长征精神的内涵、中国精神","text":"【答题要点】①英雄，一个民族最闪亮的坐标。中国共产党带领人民救国、兴国、强国，缔造了彪炳史册的伟大胜利，谱写了气壮山河的英雄史诗。人民是历史的创造者，英雄从来都不曾脱离人民，英雄光照历史、感动时代的事迹和精神，引领大众，影响社会，是中华民族伟大复兴宝贵的精神财富。英雄是以爱国主义为核心的民族精神和以改革创新为核心的时代精神所构成的中国精神的代表，各个时期涌现出的英雄以自身坚定执着的理想信念和无私无畏的人生追求构筑起特定时代精神的主流价值，融入到中华民族代代相传的历史和文化中，成为中国人民共同的历史记忆，成为中华民族宝贵的中国精神财富。"},{"sub":"【答题思路】英雄、长征精神的内涵、中国精神","text":"②精神所在，就是力量所在。伟大长征精神充分彰显了忠诚的力量、真理的力量、正义的力量、团结的力量，它作为中国共产党人精神谱系的重要组成部分，跨越时空、历久弥新，永远是激励我们战胜困难、勇往直前的宝贵财富和强大动力。以英雄模范为榜样，团结奋进、砥砺前行，汇聚起共襄强国盛举的磅礴力量。对英雄心怀崇敬，是为了继承和发扬中国精神，从历史中汲取养分；反对历史虚无主义，抵制文化虚无主义，树立正确历史观，坚定信念，稳步前行。"},{"sub":"【答题思路】英雄、长征精神的内涵、中国精神","text":"设问方法二：长征精神彰显了怎样的对理想信念的追求？"},{"sub":"【答题思路】理想信念的重要作用","text":"【答题要点】理想信念是人的精神世界的核心，是人精神上的“钙”，理想信念昭示奋斗目标、催生前进动力、提供精神支柱、提高精神境界。实现中华民族伟大复兴的理想和建设共产主义社会的远大理想在一代又一代青年心中点亮理想之灯、发出信念之光。弘扬伟大长征精神、走好新的长征路，必须坚守党的理想信念宗旨。理想信念宗旨是共产党人的“魂”，始终指引我们前进的方向。"},{"sub":"【答题思路】理想信念的重要作用","text":"设问方法三：长征精神对新时代广大青年担负伟大复兴的时代使命有何启示？"},{"sub":"【答题思路】长征精神内涵、在民族复兴中放飞青春梦想","text":"【答题要点】中华民族伟大复兴是全体中华儿女共同的梦想，更是青年一代的伟大梦想。艰苦奋斗是理想实现的重要条件，中华民族伟大复兴的伟大梦想终将在一代代青年的接力奋斗35中变为现实。在实现民族复兴的过程中，广大青年要坚定理想信念，脚踏实地，处理好个人与社会的关系，在实现民族复兴的过程中完善自身，不断实现自己的青春梦想。新征程是充满光荣和梦想的远征，是党和人民的新长征。抚今追昔、展望未来，我们要大力弘扬伟大长征精神，同心协力走好新的长征路。"},{"sub":"【答题思路】长征精神内涵、在民族复兴中放飞青春梦想","text":"设问方法四：如何理解长征精神是革命道德的具体体现？"},{"sub":"【答题思路】长征精神、革命道德","text":"【答题要点】革命道德是在中国革命、建设、改革中所形成的优秀道德，是马克思主义与中国革命、建设、改革的伟大实践相结合的产物，是中华民族极其宝贵的道德财富。二者一脉相承，长征精神就是革命道德的完美诠释。红军长征的伟大胜利之路，是依靠坚定的革命意志走出来的。长征期间，面对异乎寻常的艰难曲折，党和红军信念如磐，展现出百折不挠、一往无前、英勇战斗、视死如归的崇高革命精神。历史雄辩地证明，革命理想、革命信念能够迸发出克顽敌、撼山岳的无穷力量，具有崇高理想和坚定信念的队伍是不可战胜的。"},{"sub":"【答题思路】长征精神、革命道德","text":"设问方法五：弘扬长征精神对新时代实现中国式现代化/中华民族伟大复兴有何意义？"},{"sub":"【答题思路】长征精神的内涵和意义","text":"【答题要点】①伟大长征精神，就是把全国人民和中华民族的根本利益看得高于一切，坚定革命的理想和信念，坚信正义事业必然胜利的精神；就是为了救国救民，不怕任何艰难险阻，不惜付出一切牺牲的精神；就是坚持独立自主、实事求是，一切从实际出发的精神；就是顾全大局、严守纪律、紧密团结的精神；就是紧紧依靠人民群众，同人民群众生死相依、患难与共、艰苦奋斗的精神。"},{"sub":"【答题思路】长征精神的内涵和意义","text":"②红军长征这一惊天动地的革命壮举，在我们党、国家、军队历史上具有伟大意义，对中华民族伟大复兴进程产生了深远影响。在推进中国式现代化的新征程上，我们要大力弘扬伟大长征精神。我们正在新征程上致力于全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。"},{"sub":"【答题思路】长征精神的内涵和意义","text":"热点链接3：生态环境法典正式施行设问方法一：生态环境法典的颁布实施体现了法律的哪些作用？"},{"sub":"【答题思路】法律的定义、作用","text":"【答题要点】社会主义法律是党的主张和人民意志的统一。依法治国是治国理政的基本方式。"},{"sub":"【答题思路】法律的定义、作用","text":"《生态环境法典》体现了法治建设为思想道德建设提供制度支撑和法律保障。法律具有规范作用和社会作用。法律通过规定权利义务、明确行为边界来规范社会成员的行为，同时通过调整社会关系来维护社会秩序、推动社会发展。生态环境法典作为我国生态环境领域的综合性、统领性法律，为生态环境保护提供了明确的制度依据和行为规范。"},{"sub":"第五部分 形势与政策重要考点预测热点链接1.当今世界形势设问方法：","text":"1.如何理解我们正处于百年未有之大变局？"},{"sub":"第五部分 形势与政策重要考点预测热点链接1.当今世界形势设问方法：","text":"2.为什么说“世界又一次站在历史的十字路口”？"},{"sub":"第五部分 形势与政策重要考点预测热点链接1.当今世界形势设问方法：","text":"3.面对百年未有之大变局，我们如何“信心足，道路稳”地有效应对，回答好世界之问、时代之问？"},{"sub":"【答题线索】国际局势、世界格局、全球战略、世界百年未有之大变局（得分点）","text":"【答题要点】（1）背景：当今世界正处于百年未有之大变局，世界经济增长乏力，对各国经济、社会和民生产生严重影响；保护主义、单边主义滋长；经济全球化遭遇逆流，加剧了世界经济中的风险和不确定性。但是，和平与发展仍然是当今时代两大主题，世界多极化和经济全球化的时代潮流也不可能逆转。"},{"sub":"【答题线索】国际局势、世界格局、全球战略、世界百年未有之大变局（得分点）","text":"（2）措施：我们要坚持合作共赢，建立更加公正合理的国际政治经济新秩序。"},{"sub":"【答题线索】国际局势、世界格局、全球战略、世界百年未有之大变局（得分点）","text":"热点链接2.中美关系设问方法：如何理解中美关系的实质？"},{"sub":"【答题线索】国际局势、世界格局、全球战略、世界百年未有之大变局（得分点）","text":"【答题线索】中国与美国关键词同时出现；美国战略等"},{"sub":"【答题线索】国际局势、世界格局、全球战略、世界百年未有之大变局（得分点）","text":"【答题要点】（1）背景：中美之间的差异实质是社会制度和外交政策的不同。中、美分别是最大的发展中国家和最大的发达国家，中美能否处理好彼此关系，攸关世界前途命运，是两国必须回答好的世纪之问。（2）措施：中美合则两利、斗则俱伤，合作是唯一正确的选择。"},{"sub":"【答题线索】国际局势、世界格局、全球战略、世界百年未有之大变局（得分点）","text":"努力将“中美建设性战略稳定关系”作为中美关系的战略指引。"},{"sub":"【答题线索】国际局势、世界格局、全球战略、世界百年未有之大变局（得分点）","text":"热点链接3.多边主义设问方法：如何理解多边主义是世界和平与发展的必由之路"},{"sub":"【答题线索】国际局势、世界格局、全球战略、世界百年未有之大变局（得分点）","text":"【答题线索】世界体系、国际治理、多边机制，“金砖国家”会议、上合组织等"},{"sub":"【答题线索】国际局势、世界格局、全球战略、世界百年未有之大变局（得分点）","text":"【答题要点】（1）原因：第一，多边主义是人类历经劫难后的共同选择，是联合国宪章宗旨和原则的集中体现。第二，面对全球化，挑战、责任与命运都是共同的，需要坚守多边主义的人间正道。第三，当前，单边主义不断抬头，捍卫多边主义更为紧迫和重要。第四，多边主义以维护世界和平、促进共同发展为目标，以维护公平正义、推动互利共赢为宗旨，以国际法和公认的国际关系基本准则为基础。推动构建更加公正合理的国际政治经济新秩序。"},{"sub":"【答题线索】国际局势、世界格局、全球战略、世界百年未有之大变局（得分点）","text":"（2）措施：坚持多边主义，应当谋求共同发展；大国应体现责任担当；应当维护国际准则；应当树立共同体意识；应当坚持公平正义，以有效行动实现合作共赢。"},{"sub":"【答题线索】国际局势、世界格局、全球战略、世界百年未有之大变局（得分点）","text":"热点链接4.中国方案与主张设问方法：应对XX问题，中国的应对之策是什么？"},{"sub":"【答题线索】国际局势、世界格局、全球战略、世界百年未有之大变局（得分点）","text":"【答题线索】中国为什么做，怎么做"},{"sub":"【答题线索】国际局势、世界格局、全球战略、世界百年未有之大变局（得分点）","text":"【答题要点】（1）必要性：第一，中国坚持走和平发展道路，推动构建人类命运共同体。第二，中国向世界提供了中国方案、中国智慧、中国力量，提升了中国的国际影响力。第三，37推动了国际经济秩序朝着更加公正、公平、合理的方向发展；第四，这些既是中国特色大国外交的成果实践，也是习近平治国理政新理念、新思想、新战略的集中体现。"},{"sub":"【答题线索】国际局势、世界格局、全球战略、世界百年未有之大变局（得分点）","text":"（2）措施：第一，坚持和平发展道路，实行独立自主的和平外交政策。推动建设新型国际关系，强调相互尊重、公平正义、合作共赢。第二，不断推动构建大国是关键、周边是首要、发展中国家是基础、多边是舞台的外交工作布局，积极发展全球伙伴关系。第三，秉持共商共建共享的全球治理观。第四，促进“一带一路”国际合作，推动建立以“持久和平、普遍安全、共同繁荣、开放包容、清洁美丽”为核心的人类命运共同体。"},{"sub":"【答题线索】国际局势、世界格局、全球战略、世界百年未有之大变局（得分点）","text":"热点链接5.中国对世界的贡献设问方法："},{"sub":"【答题线索】国际局势、世界格局、全球战略、世界百年未有之大变局（得分点）","text":"1.为什么说中国离不开世界，世界离不开中国？"},{"sub":"【答题线索】国际局势、世界格局、全球战略、世界百年未有之大变局（得分点）","text":"2.如何理解“中国始终是世界和平的建设者、全球发展的贡献者、国际秩序的维护者、公共产品的提供者”？"},{"sub":"【答题线索】国际局势、世界格局、全球战略、世界百年未有之大变局（得分点）","text":"【答题线索】中国的作用，在经济、政治、文化、生态等方面做出的重大贡献"},{"sub":"【答题线索】国际局势、世界格局、全球战略、世界百年未有之大变局（得分点）","text":"【答题要点】中国始终是世界和平的建设者、全球发展的贡献者、国际秩序的维护者、公共产品的提供者，将继续以中国的新发展为世界提供新机遇。第一，经济贡献：中国始终是全球共同开放的重要推动者，是世界经济增长的稳定动力源，是各国拓展商机的活力大市场，是全球治理改革的积极贡献者。第二，政治贡献：中国坚定维护多边主义，坚定维护以联合国为核心的国际体系，坚定维护以国际法为基础的国际秩序。第三，生态贡献：中国以生态文明思想为指导，贯彻新发展理念，以经济社会发展全面绿色转型为引领，以能源绿色低碳发展为关键，坚持走生态优先、绿色低碳的发展道路。第四，文化贡献：中国提出全球文明倡议，推动文明交流互鉴。"},{"sub":"【答题线索】国际局势、世界格局、全球战略、世界百年未有之大变局（得分点）","text":"热点链接6.经济全球化设问方法：如何应对逆全球化趋势，应对贸易战危机？"},{"sub":"【答题线索】国际局势、世界格局、全球战略、世界百年未有之大变局（得分点）","text":"【答题线索】国际贸易、世界经济、经济全球化等，经济全球化方面中国怎么做"},{"sub":"【答题线索】国际局势、世界格局、全球战略、世界百年未有之大变局（得分点）","text":"【答题要点】第一，经济全球化是世界经济发展的必然趋势，我们应顺应时代潮流，积极参与经济全球化。第二，经济全球化是一把双刃剑，我们要适应和引导好经济全球化，释放出更多正面效应。第三，面对机遇与挑战，正确的选择是充分利用一切机遇，合作应对一切挑战，引导经济全球化朝着更加开放、包容、普惠、平衡、共赢的方向发展。"},{"sub":"【答题线索】国际局势、世界格局、全球战略、世界百年未有之大变局（得分点）","text":"热点链接7.联合国的地位和职责设问方法：为什么要坚持联合国理想，携手共创人类美好未来？"},{"sub":"【答题线索】新中国恢复联合国合法席位55周年、如何支持联合国发挥作用","text":"【答题要点】联合国在维护国际和平与安全、推动国际经济发展和建立国际经济新秩序、促进国际合作等方面作出的贡献和成就为国际社会所公认。当前形势下，无论是维护和平稳定，还是促进共同发展，联合国的作用只能加强，不能削弱，联合国的权威必须捍卫，不容侵犯。"},{"sub":"【答题线索】新中国恢复联合国合法席位55周年、如何支持联合国发挥作用","text":"中国坚定维护以联合国宪章宗旨和原则为基石的国际关系基本准则。中国在联合国的框架下38与各国合作处理国际事务，支持联合国发挥核心作用的核心机制，为世界和平与发展发挥更大作用。"},{"sub":"【答题线索】新中国恢复联合国合法席位55周年、如何支持联合国发挥作用","text":"热点链接8.四大全球倡议设问方法一：如何理解四大全球倡议完全契合联合国的宗旨，且目标意义深远？"},{"sub":"【答题线索】新中国恢复联合国合法席位55周年、如何支持联合国发挥作用","text":"【答题线索】全球发展倡议，全球安全倡议，全球文明倡议，全球治理倡议，“四大全球倡议”"},{"sub":"【答题线索】新中国恢复联合国合法席位55周年、如何支持联合国发挥作用","text":"【答题要点】“四大全球倡议”，丰富和发展了习近平外交思想，共同构成人类命运共同体大厦的“四大支柱”，为世界朝着构建人类命运共同体方向前行提供可行路径，引领新时代国际关系理论创新，是推动世界发展、安全、文明和治理的中国方案。“四大全球倡议”的核心理念同联合国宪章宗旨和原则一脉相承，展现了中国对联合国的坚定支持，反映了国际社会的共同心声，得到广泛支持。"},{"sub":"【答题线索】新中国恢复联合国合法席位55周年、如何支持联合国发挥作用","text":"设问方法二：四大全球倡议之间的关系"},{"sub":"【答题线索】新中国恢复联合国合法席位55周年、如何支持联合国发挥作用","text":"【答题线索】全球发展倡议，全球安全倡议，全球文明倡议，全球治理倡议，“四大全球倡议”为“四大赤字”把脉开方"},{"sub":"【答题线索】新中国恢复联合国合法席位55周年、如何支持联合国发挥作用","text":"【答题要点】四大全球倡议各有侧重、并行不悖，构成更加完备、系统的中国方案，为破解和平赤字、发展赤字、安全赤字、治理赤字提供哲学基础与现实路径，归根结底是破解“领导力赤字”。国际局势动荡加剧、乱象频出之际，强权霸凌行径危害深重，严重冲击联合国等多边机制，世界渴望稳定性和方向感，迫切希望负责任的大国展现领导力、提供确定性。"},{"sub":"【答题线索】新中国恢复联合国合法席位55周年、如何支持联合国发挥作用","text":"设问方法三：全球治理倡议提出的意义"},{"sub":"【答题线索】全球治理、改善完善全球治理","text":"【答题要点】全球治理倡议为解答“构建什么 <div class="loading" id="loading">

<script>
/* ─────────────────────────────────────
 *  原生 TTS Bridge (Android) + WebView 回退
 * ───────────────────────────────────── */
let nativeTTSReady = false;
let ttsUtteranceSeq = 0;  // 唯一 ID, 用于匹配 Java 回调
let currentTTSId = null;
let debugMode = true;  // 显示调试面板

// Java 侧通知 TTS 就绪
function onNativeTTSReady() {
  nativeTTSReady = true;
  if (debugMode) setDebugStatus('✅ 原生 AndroidTTS Bridge 就绪');
  console.log('✅ 原生 AndroidTTS Bridge 就绪');
}
// Java 侧通知 TTS 播完 → 自动下一条
function onNativeTTSDone(utteranceId) {
  if (utteranceId !== currentTTSId) return;
  state.isPlaying = false;
  setPlayIcon();
  document.getElementById('progressFill').style.width = '100%';
  renderList();
  currentTTSId = null;
  if (debugMode) setDebugStatus(`✅ onNativeTTSDone(${utteranceId})`);
  if (state.wasPaused) return;
  autoNextSeg();
}
function onNativeTTSError(utteranceId) {
  if (utteranceId !== currentTTSId) return;
  if (debugMode) setDebugStatus(`❌ onNativeTTSError(${utteranceId})`);
  console.warn('[NativeTTS] error:', utteranceId);
  state.isPlaying = false;
  setPlayIcon();
  currentTTSId = null;
}

function setDebugStatus(msg) {
  var el = document.getElementById('debugStatus');
  if (el) el.textContent = msg;
  console.log('[DEBUG]', msg);
}

function testNativeTTS() {
  if (window.AndroidTTS) {
    var ok = AndroidTTS.isAvailable();
    setDebugStatus(`AndroidTTS.isAvailable() = ${ok}`);
    if (ok) {
      AndroidTTS.stop();
      AndroidTTS.speak('测试一下原生语音能不能播', 1.0, 'test_' + Date.now());
      setDebugStatus('已发送测试语音, 应该听到声音...');
    }
  } else {
    setDebugStatus('❌ window.AndroidTTS 不存在! 走的是 WebView speechSynthesis');
  }
}
// 安全包装 speechSynthesis (WebView 回退用)
function trySS(fn) { try { if ('speechSynthesis' in window) return fn(); } catch(e) {} return null; }

/* ─────────────────────────────────────
 *  状态
 * ───────────────────────────────────── */
const state = {
  data: null,
  bookIdx: 0,
  selectedSubs: null,   // null = 全部, [] = 空, [...] = 指定
  flatList: [],          // 当前筛选后的段落 [{sub, text}]
  queue: [],             // 播放顺序(索引)
  queuePos: 0,
  mode: 'seq',           // seq / shuffle / rand
  speed: 1.0,
  voices: [],
  useAudio: true,        // 优先使用预生成音频
  pauseGap: 900,         // 段落间停顿(ms)
  audioEl: new Audio(),
  audioAvailable: false
};

const LS_KEY = 'kaoyan_player_v2';

/* ─────────────────────────────────────
 *  初始化
 * ───────────────────────────────────── */
async function init() {
  try {
    // 加载数据
    if (window.__APP_DATA__) {
      // Android APK 内联模式
      state.data = window.__APP_DATA__;
    } else {
      // 本地服务器模式 (开发用)
      const r = await fetch('data.json', { cache: 'no-store' });
      state.data = await r.json();
    }

    if (!state.data || !state.data.books) {
      throw new Error('数据为空');
    }

    // 加载语音列表 (WebView 里 speechSynthesis 可能不存在)
    try { loadVoices(); } catch(e) { console.warn('loadVoices 失败:', e); }
    try {
      if (speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoices;
      }
    } catch(e) {}

    // 恢复状态
    try { loadState(); } catch(e) { console.warn('loadState 失败:', e); }

    // 渲染UI
    renderBookPills();
    renderSubPills();
    rebuildQueue();
    renderList();

  } catch(e) {
    console.error('❌ init 失败:', e);
    alert('初始化失败: ' + e.message);
  }

  // 无论如何都要隐藏 loading
  hideLoading();

  // 页面可见性变化 → 暂停/恢复
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { /* 后台继续播 */ }
  });
}

function loadVoices() {
  try {
    if (!('speechSynthesis' in window)) { state.voices = []; return; }
    state.voices = speechSynthesis.getVoices().filter(v =>
      v.lang && (v.lang.toLowerCase().startsWith('zh') || v.name && (v.name.includes('Chinese') || v.name.includes('普通话') || v.name.includes('中文')))
    );
  } catch(e) { state.voices = []; }
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
    if (s.bookIdx != null) state.bookIdx = s.bookIdx;
    if (s.selectedSubs != null) state.selectedSubs = s.selectedSubs;
    if (s.mode) state.mode = s.mode;
    if (s.speed) state.speed = s.speed;
    if (s.queuePos != null) state.queuePos = s.queuePos;
    if (s.pauseGap) state.pauseGap = s.pauseGap;
  } catch(e) {}
}
function saveState() {
  localStorage.setItem(LS_KEY, JSON.stringify({
    bookIdx: state.bookIdx,
    selectedSubs: state.selectedSubs,
    mode: state.mode,
    speed: state.speed,
    queuePos: state.queuePos,
    pauseGap: state.pauseGap
  }));
}

/* ─────────────────────────────────────
 *  UI 渲染
 * ───────────────────────────────────── */
function hideLoading() {
  document.getElementById('loading').style.display = 'none';
}

function renderBookPills() {
  const wrap = document.getElementById('bookPills');
  wrap.innerHTML = '';
  state.data.books.forEach((b, i) => {
    if (b.is_scanned) return; // 跳过扫描版
    const el = document.createElement('div');
    el.className = 'pill' + (i === state.bookIdx ? ' active' : '');
    el.innerHTML = `${b.main_category}<span class="count">${b.total_segments}</span>`;
    el.onclick = () => {
      state.bookIdx = i;
      state.selectedSubs = null;
      state.queuePos = 0;
      renderBookPills();
      renderSubPills();
      rebuildQueue();
      renderList();
      saveState();
      stopSpeech();
    };
    wrap.appendChild(el);
  });
}

function renderSubPills() {
  const wrap = document.getElementById('subPills');
  const book = state.data.books[state.bookIdx];
  if (!book || !book.sub_categories.length) {
    document.getElementById('subSection').style.display = 'none';
    return;
  }
  document.getElementById('subSection').style.display = 'block';
  wrap.innerHTML = '';

  // "全部"按钮
  const allBtn = document.createElement('div');
  allBtn.className = 'pill' + (state.selectedSubs === null ? ' active' : '');
  allBtn.innerHTML = `全部<span class="count">${book.total_segments}</span>`;
  allBtn.onclick = () => {
    state.selectedSubs = null;
    renderSubPills();
    rebuildQueue(); renderList(); saveState();
  };
  wrap.appendChild(allBtn);

  book.sub_categories.forEach(sub => {
    const el = document.createElement('div');
    const selected = state.selectedSubs && state.selectedSubs.includes(sub.name);
    el.className = 'pill' + (selected ? ' active' : '');
    el.innerHTML = `${sub.name}<span class="count">${sub.count}</span>`;
    el.onclick = () => {
      if (!state.selectedSubs) state.selectedSubs = [];
      const idx = state.selectedSubs.indexOf(sub.name);
      if (idx >= 0) state.selectedSubs.splice(idx, 1);
      else state.selectedSubs.push(sub.name);
      renderSubPills();
      rebuildQueue(); renderList(); saveState();
    };
    wrap.appendChild(el);
  });
}

function rebuildQueue() {
  const book = state.data.books[state.bookIdx];
  let subs = state.selectedSubs;
  if (!subs || subs.length === 0) subs = null;

  // 构建 flatList (当前筛选结果)
  state.flatList = [];
  if (subs === null) {
    state.flatList = book.segments.slice();
  } else {
    const allowed = new Set(subs);
    state.flatList = book.segments.filter(s => allowed.has(s.sub));
  }

  // 检查这本书是否有音频
  state.audioAvailable = state.flatList.some(s => s.audio);

  // queue: 索引列表
  state.queue = state.flatList.map((_, i) => i);
  state.queuePos = Math.min(state.queuePos, state.queue.length - 1);
  if (state.queuePos < 0) state.queuePos = 0;

  applyMode(state.mode);
  updateIdxInfo();
}

function applyMode(mode) {
  state.mode = mode;
  document.querySelectorAll('.btn.mode').forEach(b => {
    b.classList.toggle('active-mode', b.dataset.mode === mode);
  });
  if (mode === 'shuffle') {
    // Fisher-Yates 洗牌
    for (let i = state.queue.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [state.queue[i], state.queue[j]] = [state.queue[j], state.queue[i]];
    }
  }
  saveState();
}

function updateIdxInfo() {
  const total = state.queue.length;
  const cur = state.queue[state.queuePos] != null ? state.queue[state.queuePos] + 1 : 0;
  document.getElementById('idxInfo').textContent = `${cur}/${total}`;
  document.getElementById('listCount').textContent = `· 共 ${total} 条`;
}

function renderList() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  if (state.flatList.length === 0) {
    list.innerHTML = '<div class="empty">当前筛选下没有知识点</div>';
    return;
  }
  state.flatList.forEach((seg, i) => {
    const el = document.createElement('div');
    el.className = 'list-item' + (i === state.queue[state.queuePos] && state.isPlaying ? ' active' : '');
    el.innerHTML = `<div class="idx">#${i+1} · ${seg.sub || '未分类'}</div>
      <div class="ls">${seg.text}</div>`;
    el.onclick = () => {
      state.queuePos = state.queue.indexOf(i);
      if (state.queuePos < 0) { state.queue.push(i); state.queuePos = state.queue.length - 1; }
      renderList();
      play();
    };
    list.appendChild(el);
  });
}

/* ─────────────────────────────────────
 *  语音播放
 * ───────────────────────────────────── */
function getCurrentText() {
  const flatIdx = state.queue[state.queuePos];
  if (flatIdx == null) return null;
  return state.flatList[flatIdx];
}

function pickVoice() {
  try {
    if (!('speechSynthesis' in window)) return null;
    const v = state.voices[0] || speechSynthesis.getVoices()[0];
    return v || null;
  } catch(e) { return null; }
}

/* ─────────────────────────────────────
 *  播放状态机 (彻底重写)
 *  状态: { currentMode, isPlaying, wasPaused }
 * ───────────────────────────────────── */
state.currentMode = null;   // 'audio' | 'tts' | null
state.isPlaying = false;     // 当前是否在输出声音
state.wasPaused = false;     // 是否被用户暂停过 (用于 resume 判断)
state.autoNextTimer = null;  // setTimeout 句柄, 段落间停顿

// UI helpers
function setPlayIcon() {
  document.getElementById('playIc').textContent = state.isPlaying ? '❚❚' : '▶';
}
function clearAutoNext() {
  if (state.autoNextTimer) { clearTimeout(state.autoNextTimer); state.autoNextTimer = null; }
}

// 初始化 audio 事件 —— 只更新状态, 不触发 next/playCurrent
(function initAudioState() {
  const a = state.audioEl;
  a.preload = 'metadata';
  // play 事件: 真正开始出声
  a.addEventListener('play', () => {
    state.isPlaying = true;
    state.wasPaused = false;
    setPlayIcon();
  });
  // pause 事件: 暂停 (用户手动 or 调用 pause())
  a.addEventListener('pause', () => {
    // 只有在非 ended 情况下认为是"暂停中"
    state.wasPaused = !a.ended;
    state.isPlaying = false;
    setPlayIcon();
  });
  // ended 事件: 播完一条, 触发自动下一条
  a.addEventListener('ended', () => {
    state.isPlaying = false;
    state.wasPaused = false;
    document.getElementById('progressFill').style.width = '100%';
    setPlayIcon();
    renderList();
    clearAutoNext();
    state.autoNextTimer = setTimeout(autoNextSeg, state.pauseGap);
  });
  a.addEventListener('error', () => {
    console.warn('[audio] error, fallback to TTS:', a.src);
    const seg = getCurrentText();
    if (seg && state.currentMode === 'audio') {
      playSegmentTTS(seg);
    }
  });
  a.addEventListener('timeupdate', () => {
    if (a.duration && !isNaN(a.duration)) {
      document.getElementById('progressFill').style.width =
        (a.currentTime / a.duration * 100) + '%';
    }
  });
})();

// 自动下一条 (区分顺序/乱序/随机)
function autoNextSeg() {
  clearAutoNext();
  if (state.mode === 'rand') {
    state.queuePos = Math.floor(Math.random() * state.flatList.length);
  } else {
    state.queuePos = (state.queuePos + 1) % state.queue.length;
  }
  updateIdxInfo();
  renderList();
  playSegment();
}

// 核心: 播放当前选中的那条
function playSegment() {
  clearAutoNext();
  stopOutputOnly(); // 停掉 audio 和 TTS, 但不改 state.queuePos
  state.wasPaused = false;

  const seg = getCurrentText();
  if (!seg) { toast('没有可播放内容'); return; }

  // 更新 UI
  const book = state.data.books[state.bookIdx];
  const voiceTag = book.audio_voice ? '🎧' : '🔊';
  document.getElementById('nowMeta').textContent =
    `${voiceTag} ${book.main_category} · ${seg.sub || '未分类'} · #${state.queuePos+1}/${state.queue.length}`;
  document.getElementById('nowText').textContent = seg.text;
  document.getElementById('progressFill').style.width = '0%';

  // 优先音频, 没有则TTS
  if (state.useAudio && seg.audio) {
    playSegmentAudio(seg);
  } else {
    playSegmentTTS(seg);
  }
  saveState();
}

function playSegmentAudio(seg) {
  state.currentMode = 'audio';
  state.audioEl.removeAttribute('src'); // 清旧 src
  state.audioEl.src = seg.audio + '?t=' + Date.now();
  state.audioEl.playbackRate = state.speed;
  state.audioEl.currentTime = 0;
  state.audioEl.play().catch(err => {
    console.warn('[audio] play() rejected:', err);
    // 只有明确是加载错误才回退, 其他浏览器可能只是因为 src 切换时机
    if (err && (err.name === 'NotSupportedError' || err.name === 'NotReadableError')) {
      playSegmentTTS(seg);
    }
  });
}

// ─────────── TTS 播放 (优先原生 AndroidTTS Bridge, 回退 WebView speechSynthesis) ───────────

// 估算中文朗读时间 (毫秒, 3.5字/秒 ÷ rate)
function estimateTTSTime(text, rate) {
  if (!text) return 2000;
  const chars = text.replace(/\s+/g, '').length;
  const baseMs = (chars / 3.5) * 1000;
  const adjusted = baseMs / (rate || 1);
  return Math.max(1500, Math.round(adjusted));
}

function playSegmentTTS(seg) {
  state.currentMode = 'tts';
  state.audioEl.pause();
  state.audioEl.removeAttribute('src');

  // 生成唯一 ID
  ttsUtteranceSeq++;
  const utterId = 'seg_' + ttsUtteranceSeq;
  currentTTSId = utterId;

  if (window.AndroidTTS && AndroidTTS.isAvailable()) {
    // ─── 走原生 TTS Bridge ───
    AndroidTTS.stop();
    AndroidTTS.speak(seg.text, state.speed, utterId);
    state.isPlaying = true;
    state.wasPaused = false;
    setPlayIcon();
    document.getElementById('progressFill').style.width = '0%';
    clearAutoNext();
    // 原生 onDone 回调会自动触发下一条, 这里不设定时器
    // 但加个 2 倍时长的兜底超时, 防止 onDone 也丢了
    const safetyMs = estimateTTSTime(seg.text, state.speed) * 2 + 5000;
    state.autoNextTimer = setTimeout(() => {
      if (currentTTSId === utterId && state.isPlaying) {
        console.warn('[NativeTTS] onDone 超时兜底, 手动切下一条');
        state.isPlaying = false;
        setPlayIcon();
        document.getElementById('progressFill').style.width = '100%';
        if (!state.wasPaused) autoNextSeg();
      }
    }, safetyMs);
    return;
  }

  // ─── 回退 WebView speechSynthesis (用估算时长定时器) ───
  if (typeof SpeechSynthesisUtterance === 'undefined' || !('speechSynthesis' in window)) {
    showToast('当前环境不支持语音, 请使用 MP3 模式');
    return;
  }
  trySS(() => speechSynthesis.cancel());
  const utter = new SpeechSynthesisUtterance(seg.text);
  utter.lang = 'zh-CN';
  utter.rate = state.speed;
  utter.pitch = 1;
  const v = pickVoice();
  if (v) utter.voice = v;
  utter.onerror = () => { state.isPlaying = false; setPlayIcon(); };

  trySS(() => speechSynthesis.speak(utter));
  state.isPlaying = true;
  state.wasPaused = false;
  setPlayIcon();
  document.getElementById('progressFill').style.width = '0%';

  clearAutoNext();
  const segMs = estimateTTSTime(seg.text, state.speed);
  state.autoNextTimer = setTimeout(() => {
    state.isPlaying = false;
    setPlayIcon();
    document.getElementById('progressFill').style.width = '100%';
    renderList();
    if (state.wasPaused) return;
    autoNextSeg();
  }, segMs + state.pauseGap);
}

// 只停声音 (audio.pause + TTS stop), 不改队列/进度
function stopOutputOnly() {
  clearAutoNext();
  currentTTSId = null;  // 防止原生回调回来串乱
  if (window.AndroidTTS) { try { AndroidTTS.stop(); } catch(e) {} }
  trySS(() => speechSynthesis.cancel());
  try { state.audioEl.pause(); } catch(e) {}
  state.isPlaying = false;
  setPlayIcon();
}

// 彻底停止 (连"暂停状态"也清除, 下一次点击 play 就是从当前段从头来)
function stopAll() {
  stopOutputOnly();
  state.wasPaused = false;
  state.currentMode = null;
}

/* ─────────── 对外: togglePlay / next / prev / replay ─────────── */

function togglePlay() {
  if (state.isPlaying) {
    // 正在出声 → 暂停当前 mode
    if (state.currentMode === 'audio') {
      state.audioEl.pause();
      // pause 事件会设 state.wasPaused=true, state.isPlaying=false
    } else if (state.currentMode === 'tts') {
      // 原生 TTS 没有真正的 pause, 用 stop 代替
      if (window.AndroidTTS) { try { AndroidTTS.stop(); } catch(e) {} }
      trySS(() => speechSynthesis.pause());
      clearAutoNext();
      currentTTSId = null;
      state.isPlaying = false;
      state.wasPaused = true;
      setPlayIcon();
    }
    return;
  }

  // 没在出声
  if (state.wasPaused) {
    // 被暂停过 → 恢复
    if (state.currentMode === 'audio') {
      state.audioEl.play().catch(() => { /* src 失效就从头 play */ });
    } else if (state.currentMode === 'tts') {
      // WebView 的 speechSynthesis.resume() 经常不工作, 直接重播当前段
      state.wasPaused = false;
      playSegment();
      return;
    }
    return;
  }

  // 第一次点 play / 或刚 next 完 → 从头播当前段
  playSegment();
}

function next() {
  clearAutoNext();
  stopOutputOnly();
  if (state.mode === 'rand') {
    state.queuePos = Math.floor(Math.random() * state.flatList.length);
  } else {
    state.queuePos = (state.queuePos + 1) % state.queue.length;
  }
  state.wasPaused = false;
  state.currentMode = null;
  updateIdxInfo(); renderList(); playSegment();
}

function prev() {
  clearAutoNext();
  stopOutputOnly();
  state.queuePos = (state.queuePos - 1 + state.queue.length) % state.queue.length;
  state.wasPaused = false;
  state.currentMode = null;
  updateIdxInfo(); renderList(); playSegment();
}

function replay() {
  clearAutoNext();
  stopOutputOnly();
  state.wasPaused = false;
  state.currentMode = null;
  playSegment();
}


/* ─────────────────────────────────────
 *  倍速
 * ───────────────────────────────────── */
function cycleSpeed() {
  const speeds = [0.6, 0.8, 1.0, 1.2, 1.5, 1.8, 2.0];
  const cur = speeds.indexOf(state.speed);
  state.speed = speeds[(cur + 1) % speeds.length];
  document.getElementById('btnSpeed').textContent = state.speed.toFixed(1) + 'x';
  saveState();
  // 如果正在播: 音频改 playbackRate / TTS 重开
  if (state.currentMode === 'audio' && state.isPlaying) {
    state.audioEl.playbackRate = state.speed;
  } else if (state.isPlaying) {
    stopOutputOnly();
    playSegment();
  }
  toast(`倍速 ${state.speed}x`);
}

/* ─────────────────────────────────────
 *  段落停顿 (cycleGap)
 * ───────────────────────────────────── */
function cycleGap() {
  const gaps = [400, 700, 900, 1200, 1800, 2500];
  const cur = gaps.indexOf(state.pauseGap);
  state.pauseGap = gaps[(cur + 1) % gaps.length];
  const labels = {400:'紧凑', 700:'稍快', 900:'自然', 1200:'宽松', 1800:'长停', 2500:'深呼吸'};
  const btn = document.getElementById('btnGap');
  if (btn) btn.textContent = labels[state.pauseGap] || state.pauseGap + 'ms';
  saveState();
  toast(`段落停顿: ${labels[state.pauseGap]}`);
}

/* ─────────────────────────────────────
 *  toast
 * ───────────────────────────────────── */
let _toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 1200);
}

/* ─────────────────────────────────────
 *  事件绑定
 * ───────────────────────────────────── */
document.getElementById('btnPlay').onclick = togglePlay;
document.getElementById('btnNext').onclick = next;
document.getElementById('btnPrev').onclick = prev;
document.getElementById('btnSpeed').onclick = cycleSpeed;
document.getElementById('btnGap').onclick = cycleGap;
document.getElementById('btnReplay').onclick = replay;
document.getElementById('btnStop').onclick = stopAll;
document.querySelectorAll('.btn.mode').forEach(b => {
  b.onclick = () => {
    applyMode(b.dataset.mode);
    toast('模式: ' + b.textContent.trim());
  };
});
document.getElementById('btnList').onclick = () => {
  window.scrollTo({ top: document.querySelector('.list').offsetTop - 100, behavior: 'smooth' });
};

// 初始化显示
document.getElementById('btnSpeed').textContent = state.speed.toFixed(1) + 'x';
const gapsLabel = {400:'紧凑', 700:'稍快', 900:'自然', 1200:'宽松', 1800:'长停', 2500:'深呼吸'};
document.getElementById('btnGap').textContent = gapsLabel[state.pauseGap] || '自然';

/* ─────────────────────────────────────
 *  启动
 * ───────────────────────────────────── */
init();

// 注册 Service Worker (PWA 支持, 可添加到主屏幕)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>

<!-- 调试面板 (v8, 帮定位 Bridge 是否生效) -->
<div id="debugPanel" style="position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.85);color:#0f0;font-size:11px;padding:6px 10px;z-index:9999;font-family:monospace;">
  <div id="debugStatus">等待原生 Bridge 注册...</div>
  <div style="margin-top:4px;display:flex;gap:6px;">
    <button onclick="testNativeTTS()" style="background:#222;color:#fff;border:1px solid #555;padding:2px 8px;font-size:10px;">测试原生TTS</button>
    <button onclick="var a=document.getElementById('debugPanel');a.style.display='none'" style="background:#440;color:#fff;border:1px solid #555;padding:2px 8px;font-size:10px;">隐藏</button>
  </div>
</div>
