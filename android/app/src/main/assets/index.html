<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>考研政治背诵播放器</title>
<style>
:root {
  --bg: #0f0f1a;
  --card: #1a1a2e;
  --card2: #232340;
  --accent: #ff6b6b;
  --accent2: #4ecdc4;
  --text: #e8e8f0;
  --muted: #8888a0;
  --border: #333355;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, "PingFang SC", "MiSans", "Microsoft YaHei", sans-serif;
  overflow-x: hidden; }
body { min-height: 100vh; padding-bottom: 140px; }

/* ───── 顶部 ───── */
.header {
  position: sticky; top: 0; z-index: 100;
  background: linear-gradient(180deg, var(--card) 0%, var(--bg) 100%);
  padding: 16px 14px 10px; backdrop-filter: blur(10px);
}
.header h1 { margin: 0; font-size: 18px; font-weight: 600; text-align: center; }
.header .sub { text-align: center; color: var(--muted); font-size: 12px; margin-top: 2px; }

/* ───── 选择区 ───── */
.section { padding: 12px 14px; }
.section-title {
  font-size: 13px; color: var(--muted); margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.section-title::before {
  content: ''; width: 3px; height: 14px;
  background: var(--accent); border-radius: 2px;
}

.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  padding: 8px 14px; border-radius: 20px;
  background: var(--card); border: 1px solid var(--border);
  color: var(--text); font-size: 14px; cursor: pointer;
  transition: all .2s; user-select: none;
}
.pill.active {
  background: linear-gradient(135deg, var(--accent), #ff8e53);
  border-color: transparent; color: #fff; font-weight: 600;
}
.pill.disabled { opacity: .4; pointer-events: none; }
.pill .count {
  display: inline-block; margin-left: 4px;
  font-size: 11px; opacity: .7;
}

/* 子分类下拉 */
.sub-select-wrap { position: relative; }
.sub-select {
  width: 100%; padding: 10px 12px; font-size: 14px;
  background: var(--card); border: 1px solid var(--border);
  color: var(--text); border-radius: 10px; appearance: none;
}

/* ───── 当前播放 ───── */
.now-playing {
  margin: 12px 14px; padding: 16px; border-radius: 14px;
  background: linear-gradient(135deg, #2a2a4a 0%, #1a1a2e 100%);
  border: 1px solid var(--border);
  min-height: 120px;
}
.now-playing .label { font-size: 12px; color: var(--muted); }
.now-playing .meta { font-size: 13px; color: var(--accent2); margin-top: 4px; }
.now-playing .text {
  font-size: 16px; line-height: 1.7; margin-top: 10px;
  max-height: 160px; overflow-y: auto; white-space: pre-wrap;
}
.now-playing .progress-bar {
  margin-top: 10px; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden;
}
.now-playing .progress-fill {
  height: 100%; background: var(--accent); width: 0%;
  transition: width .3s;
}

/* ───── 控制栏 ───── */
.controls {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--card); border-top: 1px solid var(--border);
  padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
  z-index: 200;
}
.controls .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.controls .row + .row { margin-top: 10px; }

.btn {
  width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--card2);
  color: var(--text); font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.btn:active { transform: scale(.92); background: var(--accent); }
.btn.play {
  width: 60px; height: 60px; font-size: 24px;
  background: linear-gradient(135deg, var(--accent), #ff8e53);
  border: none; box-shadow: 0 4px 20px rgba(255,107,107,.4);
}
.btn.play:active { transform: scale(.92); }
.btn .ic { font-style: normal; }

.btn-group { display: flex; gap: 6px; align-items: center; }
.btn.small { width: 36px; height: 36px; font-size: 13px; border-radius: 10px; }
.btn.speed { width: auto; padding: 0 12px; border-radius: 18px; font-size: 13px; font-weight: 600; }
.btn.mode { font-size: 11px; width: 42px; height: 42px; border-radius: 12px; }

/* 模式激活 */
.btn.active-mode {
  background: var(--accent); border-color: var(--accent);
}

/* 音量/总进度 */
.info-text { font-size: 12px; color: var(--muted); min-width: 60px; text-align: center; }

/* ───── 列表 ───── */
.list { padding: 0 14px; }
.list-item {
  padding: 12px; background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; margin-bottom: 8px; cursor: pointer;
  transition: all .15s;
}
.list-item.active {
  background: var(--card2); border-color: var(--accent);
}
.list-item .idx { font-size: 11px; color: var(--muted); }
.list-item .ls { font-size: 14px; margin-top: 4px; line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; }

/* 空状态 */
.empty { padding: 40px; text-align: center; color: var(--muted); }

/* 加载 */
.loading {
  position: fixed; inset: 0; background: var(--bg); z-index: 999;
  display: flex; align-items: center; justify-content: center; flex-direction: column;
}
.loading .spinner {
  width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 1s linear infinite;
}
.loading p { margin-top: 12px; color: var(--muted); }
@keyframes spin { to { transform: rotate(360deg); } }

/* toast */
.toast {
  position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,.85); color: #fff; padding: 10px 20px; border-radius: 20px;
  font-size: 14px; z-index: 1000; opacity: 0; pointer-events: none;
  transition: opacity .3s;
}
.toast.show { opacity: 1; }

/* 页脚说明 */
.footer-note {
  text-align: center; color: var(--muted); font-size: 11px;
  padding: 20px;
}
</style>
<script>window.__APP_DATA__ = {"version":"2.1","books":[{"file":"1-10月的时政热点精选.pdf","main_category":"1-10月时政热点","note":"按月份分类","total_segments":225,"segments":[{"sub":"一、国内时政","text":"1.习近平在省部级主要领导干部学习贯彻党的二十届四中全会精神专题研讨班开班式上发表重要讲话习近平指出，制定和实施五年规划是我们党治国理政一条重要经验，是中国特色社会主义制度一个重要政治优势，有利于实现党的领导，有利于集中力量办大事，有利于前瞻性把握战略问题，有利于保持事业连续性。在制定实施五年规划的长期实践中，我们党创造积累了丰富经验，包括坚持党中央集中统一领导，坚持从实际出发，坚持全国一盘棋，坚持发扬民主、集思广益，坚持规划法定原则等。我们要坚定制度自信，不断结合新的实际把这一优势发扬光大。","audio":"audios/00/0000.mp3"},{"sub":"一、国内时政","text":"习近平强调，建设现代化产业体系、实现产业体系整体跃升，是“十五五”时期的重要战略任务。各地区各行业要找准定位，坚持智能化、绿色化、融合化方向，发挥比较优势，形成上下游产业相互衔接、各展其长、同向发力的生动局面。要保持制造业合理比重，大力发展先进制造业。因地制宜发展新质生产力，推动科技创新和产业创新深度融合。要建设现代化基础设施。","audio":"audios/00/0001.mp3"},{"sub":"一、国内时政","text":"习近平指出，我国人口多、市场大、产业全、发展动能强，有条件加快构建新发展格局。"},{"sub":"一、国内时政","text":"要坚持以国内大循环为主体，正确处理消费和投资、需求和供给的关系，坚持惠民生和促消费、投资于物和投资于人紧密结合，努力提高国民经济循环质量和效率，让内需成为经济发展的主动力。要以做强国内大循环提升扩大高水平对外开放的自主性，以拓展国际循环增强国内改革发展的活力，努力实现内外联通、互促共进。"},{"sub":"一、国内时政","text":"习近平强调，经济发展和社会发展相辅相成，必须协调并进。要把改善民生作为促进社会发展的重点，在发展经济的同时稳步提高人民生活品质。要坚持党建引领，强化法治保障，夯实基层基础，切实提高社会治理水平。要统筹发展和安全，有效防范化解各类风险，切实维护国家安全和社会稳定。"},{"sub":"一、国内时政","text":"习近平指出，要坚持科学决策、民主决策、依法决策，编制好国家和地方“十五五”规划纲要及专项规划。地方规划和专项规划要与国家整体规划衔接好，体现国家整体规划的精神和要求，同时要因地因事制宜，把需要和可能统一起来，确保定了就做得到、能落地见效。"},{"sub":"一、国内时政","text":"2.习近平在二十届中央纪委五次全会上发表重要讲话1中共中央总书记、国家主席、中央军委主席习近平12日在中国共产党第二十届中央纪律检查委员会第五次全体会议上发表重要讲话。习近平强调，贯彻落实党中央重大决策部署，是维护党中央权威和集中统一领导的根本要求，也是党和人民事业不断发展进步的重要历史经验。"},{"sub":"一、国内时政","text":"习近平指出，党的自我革命重在治权，把权力关进制度笼子是新时代全面从严治党的一项重要任务。"},{"sub":"一、国内时政","text":"习近平强调，腐败是党和国家事业发展进程中的拦路虎、绊脚石，反腐败是一场输不起也决不能输的重大斗争。"},{"sub":"一、国内时政","text":"习近平指出，纪检监察机关在推进党的自我革命、全面从严治党中责任重大、使命光荣，要坚定维护党的团结统一，坚定捍卫党的先进性纯洁性。"},{"sub":"二、国际时政","text":"1.习近平会见爱尔兰总理马丁"},{"sub":"二、国际时政","text":"1月5日，国家主席习近平在北京人民大会堂会见来华进行正式访问的爱尔兰总理马丁。"},{"sub":"二、国际时政","text":"习近平指出，2012年两国建立互惠战略伙伴关系以来，双边贸易额翻了两番，相互投资均衡发展，两国人民双向奔赴，助力各自国家发展。相互尊重、平等相待、互利共赢是中爱关系长期稳定发展的宝贵经验，双方要共同传承和弘扬。中方愿同爱尔兰加强战略沟通，深化政治互信，扩大务实合作，为两国人民谋福祉，为中欧关系添动力。"},{"sub":"二、国际时政","text":"1.（多选）省部级主要领导干部学习贯彻党的二十届四中全会精神专题研讨班20日上午在中央党校（国家行政学院）开班。中共中央总书记、国家主席、中央军委主席习近平在开班式上发表重要讲话强调，制定和实施五年规划是我们党治国理政一条重要经验，是中国特色社会主义制度一个重要政治优势，有利于A.实现党的领导B.集中力量办大事C.前瞻性把握战略问题D.保持事业连续性"},{"sub":"二、国际时政","text":"2.（单选）中共中央总书记、国家主席、中央军委主席习近平12日在中国共产党第二十届中央纪律检查委员会第五次全体会议上发表重要讲话。维护党中央权威和集中统一领导的根本要求是2A.党的自我革命B.把权力关进制度的笼子C.捍卫党的先进性纯洁性D.贯彻落实党中央重大决策部署"},{"sub":"二、国际时政","text":"3.（多选）1月5日，国家主席习近平在北京人民大会堂会见来华进行正式访问的爱尔兰总理马丁。自从两国建立互惠战略伙伴关系以来，双边贸易额翻了两番，相互投资均衡发展，两国人民双向奔赴，助力各自国家发展。中爱关系长期稳定发展的宝贵经验是A.相互尊重B.共建同盟C.平等相待D.互利共赢参考答案："},{"sub":"二、国际时政","text":"1.ABCD 2.D 3.ACD32 月"},{"sub":"一、国内时政","text":"1.中央一号文件2026年中央一号文件2月3日发布，这也是“十五五”首个中央一号文件，《中共中央国务院关于锚定农业农村现代化 扎实推进乡村全面振兴的意见》提出锚定农业农村现代化，以推进乡村全面振兴为总抓手，以学习运用“千万工程”经验为引领，以改革创新为根本动力，提高强农惠农富农政策效能，守牢国家粮食安全底线，持续巩固拓展脱贫攻坚成果，提升乡村产业发展水平、乡村建设水平、乡村治理水平，努力把农业建成现代化大产业、使农村基本具备现代生活条件、让农民生活更加富裕美好，为推进中国式现代化提供基础支撑。"},{"sub":"一、国内时政","text":"2.中办印发《通知》 在全党开展树立和践行正确政绩观学习教育近日，中共中央办公厅印发《关于在全党开展树立和践行正确政绩观学习教育的通知》。"},{"sub":"一、国内时政","text":"《通知》明确，要坚持以习近平新时代中国特色社会主义思想为指导，深入贯彻党的二十大和二十届历次全会精神，认真落实四中全会部署，全面贯彻习近平总书记关于树立和践行正确政绩观的重要论述，持之以恒推进全面从严治党，以立党为公、为民造福、科学决策、真抓实干为总要求，以一体推进学查改为抓手，教育引导各级党组织和党员、干部坚持实事求是、求真务实，为人民出政绩、以实干出政绩，有效防范和纠治政绩观偏差，坚决有力贯彻落实党中央重大决策部署，完整准确全面贯彻新发展理念，加快构建新发展格局，着力推动高质量发展，创造经得起实践、人民、历史检验的实绩，推动“十五五”开好局、起好步，为以中国式现代化全面推进强国建设、民族复兴伟业提供有力保障。"},{"sub":"二、国际时政","text":"1.国家主席习近平同俄罗斯总统普京举行视频会晤"},{"sub":"二、国际时政","text":"2月4日下午，国家主席习近平在北京人民大会堂同俄罗斯总统普京举行视频会晤。"},{"sub":"二、国际时政","text":"习近平强调，今年是中国“十五五”开局之年，中方将更加积极主动扩大高水平对外开放，同包括俄罗斯在内的世界各国共享发展新机遇。今年也是中俄战略协作伙伴关系建立30周年、《中俄睦邻友好合作条约》签署25周年和“中俄教育年”启动之年。"},{"sub":"二、国际时政","text":"2.王毅以视频方式出席联合国人权理事会第61届会议高级别会议王毅表示，中方愿同各国一道，以落实全球治理倡议为契机，完善全球人权治理，促进国际人权事业健康发展。"},{"sub":"二、国际时政","text":"一要奉行主权平等，守护全球人权治理初心。必须坚持各国平等参与、平等决策、平等受益，推动建设公正合理包容的全球人权治理体系。二要遵守国际法治，筑牢全球人权治理4根基。各国应共同维护不干涉别国内政这一“黄金法则”，对以人权名义操弄双重标准的言行坚决说不。三要践行多边主义，破解全球人权治理挑战。四要倡导以人为本，充实全球人权治理内涵。要将发展权置于多边人权议程更加突出位置，让人权进步可视可感可及。五要注重行动导向，提升全球人权治理效能。中国愿同国际社会协调行动，共同描绘全球人权事业新图景。"},{"sub":"二、国际时政","text":"1.（单选）2026年中央一号文件2月3日发布，这也是“十五五”首个中央一号文件，《中共中央国务院关于锚定农业农村现代化 扎实推进乡村全面振兴的意见》提出锚定农业农村现代化。文件提出，农业农村现代化的总抓手是A.乡村振兴B.改革创新C.粮食安全D.“千万工程”经验"},{"sub":"二、国际时政","text":"2.（单选）中共中央办公厅印发《关于在全党开展树立和践行正确政绩观学习教育的通知》。"},{"sub":"二、国际时政","text":"《通知》指出，经党中央同意，在全党开展树立和践行正确政绩观学习教育。树立和践行正确政绩观的抓手是A.立党为公、为民造福、科学决策、真抓实干B.一体推进学查改C.加快构建新发展格局D.推动高质量发展"},{"sub":"二、国际时政","text":"3.（多选） 2月4日下午，国家主席习近平在北京人民大会堂同俄罗斯总统普京举行视频会晤。习近平强调，今年是中国“十五五”开局之年，中方将A.更加积极主动扩大高水平对外开放B.同包括俄罗斯在内的世界各国共享发展新机遇C.强化中俄同盟关系D.与俄方一道落实两国元首重要共识，加强战略沟通，深化务实合作"},{"sub":"二、国际时政","text":"4.（单选）习近平主席提出全球治理倡议，以中国智慧引领全球人权治理的方向，已得到150多个国家和国际组织支持响应。各国要遵守国际法治，筑牢全球人权治理根基。各国应共同维护的“黄金法则”是A.不干涉别国内政5B.维护盟友关系C.摒弃各种形式的殖民主义D.破解全球人权治理挑战参考答案："},{"sub":"二、国际时政","text":"1.A 2.B 3.ABD 4.A63 月"},{"sub":"一、国内时政","text":"1.《中华人民共和国民族团结进步促进法》关于民族团结进步促进法草案的说明指出，贯彻落实党中央决策部署，立足新时代党的民族工作的历史方位，全面贯彻宪法规定、原则和精神，制定民族团结进步促进法，为铸牢中华民族共同体意识、推进中华民族共同体建设夯实法治根基，对于全面推进民族团结进步事业，推动全国各族人民为以中国式现代化全面推进强国建设、民族复兴伟业团结奋斗，具有重大意义。立法坚持以习近平新时代中国特色社会主义思想为指导，深入学习贯彻习近平法治思想、习近平文化思想、习近平总书记关于加强和改进民族工作的重要思想，全面贯彻党的二十大和二十届历次全会精神，认真总结党的十八大以来民族工作取得的历史性成就和成功经验，以铸牢中华民族共同体意识为主线，推动民族团结进步事业高质量发展。"},{"sub":"一、国内时政","text":"2.习近平在河北雄安新区考察并主持召开深入推进雄安新区高质量建设和发展座谈会习近平23日在河北雄安新区考察，主持召开深入推进雄安新区高质量建设和发展座谈会并发表重要讲话。他强调，要牢牢把握雄安新区作为北京非首都功能疏解集中承载地的首要功能定位，保持战略定力和历史耐心，进一步解放思想、开拓思路、加强协调、凝聚合力，以改革创新为引领增强内生发展动力，以要素资源合理集聚为重点激发新区活力，努力建设新时代创新高地和推动高质量发展样板。"},{"sub":"二、国际时政","text":"1.中方决定向伊朗、约旦、黎巴嫩、伊拉克四国提供紧急人道主义援助中国始终践行人类命运共同体理念，秉持国际主义和人道主义精神。当前战事对伊朗等地区国家人民造成深重人道主义灾难，中方对此表示同情，向相关国家人民表示慰问。中方决定向伊朗、约旦、黎巴嫩、伊拉克四国提供紧急人道主义援助，希望这有助于缓解当地民众面临的人道主义困境。中方将继续尽自己的努力促和止战，推动早日恢复地区和平稳定，避免人道主义危机进一步蔓延。"},{"sub":"二、国际时政","text":"1.（单选）2026年两会修订《民族团结进步促进法》，对于全面推进民族团结进步事业，推动全国各族人民为以中国式现代化全面推进强国建设、民族复兴伟业团结奋斗，具有重大意义。推进民族团结进步的主线是7A.铸牢中华民族共同体意识B.巩固民族区域自治制度C.制定民族团结进步促进法D.依法治理民族事务"},{"sub":"二、国际时政","text":"2.（单选）2026年3月23日，习近平总书记在河北雄安新区考察，主持召开深入推进雄安新区高质量建设和发展座谈会并发表重要讲话。习近平总书记强调，要牢牢把握雄安新区作为北京非首都功能疏解集中承载地的首要功能定位，努力建设新时代创新高地和推动高质量发展样板。推进雄安新区高质量建设旨在A.以改革创新为引领，凝聚合力推动高质量发展B.探索以投资拉动经济增长的新模式C.将雄安新区的建设经验作为全国新区建设的统一模板D.推动雄安新区建设成为宜居宜业的现代化城市"},{"sub":"二、国际时政","text":"3.（单选）中方决定向伊朗、约旦、黎巴嫩、伊拉克四国提供紧急人道主义援助，希望这有助于缓解当地民众面临的人道主义困境。中方将继续尽自己的努力促和止战，推动早日恢复地区和平稳定，避免人道主义危机进一步蔓延。这体现了我国A. 坚持以联合国为中心的多边主义，维护世界各国的共同利益B. 践行人类命运共同体理念，展现大国担当C. 旨在扩大在中东地区的军事存在和地缘影响力D. 坚持以意识形态划界支持盟友国家参考答案："},{"sub":"二、国际时政","text":"1.A 2.A 3.B84 月"},{"sub":"一、国内时政","text":"1.《求是》杂志发表习近平总书记重要文章《树立和践行正确政绩观》文章强调，政绩观问题是一个根本性问题，关乎立党为公、执政为民。只有不断以良好政绩推动党和国家事业发展、造福人民，才能践行好党的宗旨，也才能完成好党的历史使命。"},{"sub":"一、国内时政","text":"要坚持从实际出发、按规律办事，通过科学决策和实干苦干，创造经得起实践和历史检验、真正造福人民、得到群众公认的业绩。"},{"sub":"一、国内时政","text":"2.习近平总书记会见中国国民党主席郑丽文习近平对郑丽文率团来访表示欢迎。他指出，国共两党领导人时隔10年再次会面，对两党关系、两岸关系发展具有重要意义。两岸同胞同属中华民族，包括台湾同胞在内的各族人民共同缔造了统一的多民族国家，共同书写了辉煌的中国历史，共同创造了灿烂的中华文明，共同培育了伟大的民族精神，也铸就了国土不可分、国家不可乱、民族不可散、文明不可断的共同信念，引领中华民族自强不息、中华文明绵延不断。"},{"sub":"一、国内时政","text":"习近平强调，无论国际形势、台海局势如何变化，中华民族伟大复兴的大趋势不会改变，两岸同胞走亲走近、走到一起的大潮流不会改变。两岸同胞都期盼台海和平安宁，期盼两岸关系改善发展，期盼生活更加美好，这是国共两党不可推卸的责任，也是携手合作的动力。"},{"sub":"一、国内时政","text":"我们愿在坚持“九二共识”、反对“台独”的共同政治基础上，同包括中国国民党在内的台湾各政党、团体和社会各界人士一道，加强交流对话，为两岸谋和平、为同胞谋福祉、为民族谋复兴，把两岸关系的未来牢牢掌握在中国人自己手中。"},{"sub":"一、国内时政","text":"习近平就两岸关系发展提出4点意见。第一，坚持以正确认同促进心灵契合。第二，坚持以和平发展守护共同家园。第三，坚持以交流融合增进民生福祉。第四，坚持以团结奋斗实现中华民族伟大复兴。"},{"sub":"一、国内时政","text":"3.中共中央办公厅、国务院办公厅印发《关于更高水平更高质量做好节能降碳工作的意见》《意见》明确总体工作要求，以习近平新时代中国特色社会主义思想为指导，贯彻党的二十大和二十届历次全会精神，完整准确全面贯彻新发展理念，坚持稳中求进工作总基调，坚持有效市场和有为政府相结合，统筹发展和安全，一以贯之坚持节约优先核心方针，将节能降碳贯穿经济社会发展全过程，严控能源消费不合理增长，提升能源资源利用效率，从源头削减碳排放。"},{"sub":"二、国际时政9","text":"1.苏林当选越南国家主席"},{"sub":"二、国际时政9","text":"4月7日，经越南第十六届国会第一次会议投票表决，越共中央总书记苏林当选越南国家主席，任期为2026年至2031年。苏林随后宣誓就职。苏林在就职演说中说，作为越共中央总书记、国家主席，首要任务是维护和平稳定的环境，推动国家快速、可持续发展，提高人民生活的方方面面，让人民享有发展的所有成果，推动越南为地区和世界和平、稳定、发展及进步作出更大贡献。"},{"sub":"二、国际时政9","text":"2.日本放开杀伤性武器出口推高地缘冲突风险"},{"sub":"二、国际时政9","text":"4月21日，日本政府通过内阁决议，完成对“防卫装备转移三原则”及其运用指南的修改，原则上将允许杀伤性武器对外出口。日本此举彻底突破战后80多年的和平底线，不仅严重冲击东亚安全格局、侵蚀国际军控体系，更将给地区安全与世界和平造成多重危害，国际社会应保持高度警惕并予以坚决反对。"},{"sub":"二、国际时政9","text":"1.（多选）习近平强调“共产党人必须牢记，为民造福是最大政绩。干事业、创政绩，为的是造福人民，不是为了个人升迁得失。”树立正确的政绩观A．坚持全心全意为人民服务的根本宗旨B．坚持以人民为中心的发展思想C．坚持发展为了人民、发展依靠人民、发展成果由人民共享D．坚持为人民出政绩、以实干出政绩"},{"sub":"二、国际时政9","text":"2.（多选）2026年4月10日，中共中央总书记习近平在北京会见了郑丽文主席率领的中国国民党访问团。习近平指出，两岸同胞同属中华民族，包括台湾同胞在内的各族人民共同缔造了统一的多民族国家，共同书写了辉煌的中国历史，共同创造了灿烂的中华文明，共同培育了伟大的民族精神，也铸就了国土不可分、国家不可乱、民族不可散、文明不可断的共同信念，引领中华民族自强不息、中华文明绵延不断。习近平就两岸关系发展提出A.坚持以正确认同促进心灵契合B.坚持以和平发展守护共同家园C.坚持以交流融合增进民生福祉D.坚持以团结奋斗实现中华民族伟大复兴"},{"sub":"二、国际时政9","text":"3.（单选）2026年4月22日，中共中央办公厅、国务院办公厅《关于更高水平更高质量做好节能降碳工作的意见》对外发布。文件指出，做好节能降碳工作的核心方针是10A. 统筹发展和安全B. 节约优先C. 有效市场和有为政府相结合D. 推动经济社会发展全面绿色转型参考答案："},{"sub":"二、国际时政9","text":"1.ABCD 2.ABCD 3.B115 月"},{"sub":"一、国内时政","text":"1.习近平代表党中央，向全国广大劳动群众致以节日祝贺和诚挚慰问在“五一”国际劳动节到来之际，中共中央总书记、国家主席、中央军委主席习近平代表党中央，向全国广大劳动群众致以节日祝贺和诚挚慰问。习近平强调，今年是中国共产党成立105周年，是“十五五”开局之年。希望广大劳动群众大力弘扬劳模精神、劳动精神、工匠精神，苦干实干、敬业奉献，在推动经济社会高质量发展中发挥主力军作用、展现主人翁风采。"},{"sub":"一、国内时政","text":"2.习近平给中国青年五四奖章暨新时代青年先锋奖获奖者代表回信在五四青年节到来之际，中共中央总书记、国家主席、中央军委主席习近平给中国青年五四奖章暨新时代青年先锋奖获奖者代表回信，向全国各族青年致以节日祝贺并提出殷切期望。习近平在回信中说，你们牢记党的嘱托，扎根科技创新、乡村振兴、社会服务、卫国戍边等基层一线，以实干担当书写无悔青春，展现了新时代中国青年自信自强、昂扬向上的良好风貌。习近平强调，今年是“十五五”开局之年，青年建功正当其时。希望你们胸怀远大理想，矢志拼搏奋斗，带动广大青年把个人追求融入国家发展大局，立足各自岗位不断创造新业绩，在新征程上贡献青春力量。"},{"sub":"二、国际时政","text":"1.国家主席习近平与美国总统特朗普举行会谈"},{"sub":"二、国际时政","text":"5月14日上午，国家主席习近平在北京人民大会堂同来华进行国事访问的美国总统特朗普举行会谈。习近平强调，中方致力于中美关系稳定、健康、可持续发展。我同特朗普总统赞同将构建“中美建设性战略稳定关系”作为中美关系新定位，将为未来3年乃至更长时间的中美关系提供战略指引，相信会受到两国人民和国际社会的欢迎。“建设性战略稳定”应该是合作为主的积极稳定，应该是竞争有度的良性稳定，应该是分歧可控的常态稳定，应该是和平可期的持久稳定。“中美建设性战略稳定关系”不是一句口号，而应该是相向而行的行动。"},{"sub":"二、国际时政","text":"2.国家副主席韩正出席2026年全球贸易投资促进峰会开幕式并致辞"},{"sub":"二、国际时政","text":"5月18日，国家副主席韩正在北京出席2026年全球贸易投资促进峰会开幕式并致辞。"},{"sub":"二、国际时政","text":"韩正提出4点建议，一是共同营造开放合作的国际经济环境，坚定维护多边主义和开放合作，持续推动全球贸易投资自由化便利化。二是共同塑造创新发展新优势，充分发挥新技术12的驱动和赋能作用，让科技创新成果更好造福各国人民。三是共同提升产业链供应链韧性，加强产业协同、技术交流和标准对接。四是共同推动全球经济治理体系改革，积极落实全球治理倡议，坚持共商共建共享，坚定维护以世贸组织为核心、以规则为基础的多边贸易体制。"},{"sub":"二、国际时政","text":"全球贸易投资促进峰会由中国贸促会主办，已连续举办5届。本届峰会主题为“向新而行 链接未来”。"},{"sub":"二、国际时政","text":"3.国家主席习近平同俄罗斯总统普京举行会谈"},{"sub":"二、国际时政","text":"5月20日上午，国家主席习近平在北京人民大会堂同来华进行国事访问的俄罗斯总统普京举行会谈。两国元首一致同意《中俄睦邻友好合作条约》继续延期。习近平指出，25年前，中俄两国签署睦邻友好合作条约，以法律形式确立了长期睦邻友好、全面战略协作的制度基础，中俄关系从此实现跨越式发展。当前国际格局发生很大变化，世界面临倒退回丛林法则的危险。在此背景下，《中俄睦邻友好合作条约》的先进性、科学性和现实价值愈加凸显。中方支持《中俄睦邻友好合作条约》继续延期，将同俄方一道恪守条约精神，坚定推进中俄“背靠背”战略协作。"},{"sub":"二、国际时政","text":"5月20日下午，国家主席习近平同俄罗斯总统普京在北京人民大会堂共同出席“中俄教育年”开幕式。习近平强调，教育兴则国家兴，教育强则国家强。中俄要深化人才培养合作，共同培育国际顶尖人才队伍和国家战略科技力量，携手攻克前沿科学难题，助力两国创新发展；要践行文明互鉴理念，推动文明传承和教育治理经验交流，共同提高工作水平；要赓续传统友好情谊，进一步释放教育合作潜力，促进两国民众相知相亲，让青少年在深入交流中增进友谊，培育中俄世代友好的接班人。"},{"sub":"二、国际时政","text":"5月20日下午，国家主席习近平在北京人民大会堂同俄罗斯总统普京会谈后共同会见记者指出，在我和普京总统的共同战略引领下，中俄关系已经迈上新起点。双方要顺应和平、发展、合作、共赢的时代潮流，推动中俄关系实现更高质量发展。一是筑牢更高质量政治互信，坚定彼此战略支持。二是赋能更高质量互利合作，携手推进各自发展振兴。三是推进更高质量民心相通，厚植两国世代友好根基。四是开展更高质量国际协作，改革完善全球治理。"},{"sub":"二、国际时政","text":"5月20日晚，国家主席习近平在北京人民大会堂同俄罗斯总统普京举行茶叙。习近平指出，多年来，我同普京总统保持频密交往，共同引领中俄新时代全面战略协作伙伴关系持续走深走实，推动两国睦邻友好更加深入人心，开创了相互尊重、公平正义、合作共赢的新型大国关系范式，为变乱交织的世界持续注入宝贵的稳定性。"},{"sub":"二、国际时政","text":"练习题13"},{"sub":"二、国际时政","text":"1.（多选）在“五一”国际劳动节到来之际，习近平总书记强调，希望广大劳动群众在推动经济社会高质量发展中发挥主力军作用、展现主人翁风采。从马克思主义唯物史观的角度看，强调劳动群众是“主力军”的根本依据在于A. 劳动群众是中国特色社会主义事业的领导核心B. 人民群众是社会历史的主体和创造者C. 人民群众是社会物质财富和精神财富的创造者D. 劳动群众的需求是推动社会形态更替的根本动力"},{"sub":"二、国际时政","text":"2.（多选）在五四青年节到来之际，习近平总书记给中国青年五四奖章暨新时代青年先锋奖获奖者代表回信，希望广大青年胸怀远大理想，矢志拼搏奋斗，把个人追求融入国家发展大局。从理想信念和人生价值的角度看，这启示我们A. 远大理想是青年成长成才的精神支柱和力量源泉B. 实现理想必须通过艰苦奋斗，在实践中将理想转化为现实C. 个人理想只有同国家前途、民族命运相结合才能升华D. 新时代青年应在基层一线、平凡岗位上实干担当、建功立业"},{"sub":"二、国际时政","text":"3.（多选）2026年5月14日，国家主席习近平同美国总统特朗普举行会谈，提出构建“中美建设性战略稳定关系”，并指出“建设性战略稳定”应该是A. 合作为主的积极稳定B. 竞争有度的良性稳定C. 分歧可控的常态稳定D. 和平可期的持久稳定"},{"sub":"二、国际时政","text":"4.（多选）2026年5月18日，国家副主席韩正在北京出席2026年全球贸易投资促进峰会开幕式并致辞。他指出，当前世界百年变局加速演进，各国应携手应对挑战。关于我国主张下列表述正确的是A. 坚定维护多边主义和开放合作，促进全球贸易投资自由化便利化B. 坚持创新驱动发展，致力于让科技创新成果惠及世界各国人民C. 倡导加强国际产业协同与标准对接，共同维护全球产业链供应链稳定畅通D. 积极参与全球经济治理体系改革，坚定维护以世贸组织为核心的多边贸易体制"},{"sub":"二、国际时政","text":"5.（多选）2026年5月20日，国家主席习近平在同俄罗斯总统普京会谈时表示，在当前国际格局发生很大变化、世界面临倒退回“丛林法则”危险的背景下，《中俄睦邻友好合作条约》愈加凸显出哪些特性？"},{"sub":"二、国际时政","text":"A. 先进性14B. 科学性C. 现实价值D. 排他性"},{"sub":"二、国际时政","text":"6.（单选）2026年5月20日，国家主席习近平同俄罗斯总统普京共同出席“中俄教育年”开幕式。习近平在讲话中强调，教育兴则国家兴，教育强则国家强。这体现了A. 教育是民族振兴和社会进步的基石B. 教育是引领发展的第一动力C. 教育是解决我国一切问题的基础和关键D. 教育是中国特色社会主义的本质要求"},{"sub":"二、国际时政","text":"7.（多选）2026年5月20日晚，国家主席习近平同俄罗斯总统普京举行茶叙时指出，中俄关系开创了新型大国关系范式，为变乱交织的世界持续注入宝贵的稳定性。这一新型大国关系范式的内涵包括A. 相互尊重B. 公平正义C. 合作共赢D. 不冲突、不对抗参考答案："},{"sub":"一、国内时政","text":"1.《求是》杂志发表习近平总书记重要文章《前瞻布局和发展未来产业》文章指出，要加强统筹谋划。未来产业具有前瞻性、战略性、颠覆性等特点，需要科学谋划、全局统筹。要把准发展方向，在量子科技、生物制造等领域聚焦发力、精准施策。"},{"sub":"一、国内时政","text":"科学论证技术路线，提升前沿技术战略预判能力。把握发展节奏，综合考虑国家战略需求、技术成熟程度、要素支撑条件等因素，因地制宜、错位发展。强化产业协同，坚持联动发展，推动未来产业同新兴产业、传统产业相得益彰。"},{"sub":"一、国内时政","text":"文章指出，要坚持以科技创新为引领。科技突破的程度，很大程度上决定未来产业发展的速度、广度、深度。要充分发挥新型举国体制优势，坚持“产业出题、科技答题”，大力提升科技支撑引领能力。加大重点领域关键核心技术攻关力度，加强基础研究战略性、前瞻性、体系化布局，加快科技成果转化应用。"},{"sub":"一、国内时政","text":"2.《求是》杂志发表中共中央总书记、国家主席、中央军委主席习近平的重要文章《一体推进教育科技人才发展》文章强调，教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性支撑。"},{"sub":"一、国内时政","text":"建设教育强国、科技强国、人才强国具有内在一致性和相互支撑性。要增强系统观念，坚持教育优先发展、科技自立自强、人才引领驱动，统筹推进教育科技人才体制机制一体改革，实现科教兴国战略、人才强国战略、创新驱动发展战略有效联动，形成推动高质量发展的倍增效应。"},{"sub":"一、国内时政","text":"文章指出，要强化教育对科技和人才的支撑作用。科技创新靠人才，人才培养靠教育。"},{"sub":"一、国内时政","text":"要强化高水平研究型大学国家基础研究主力军和重大科技突破策源地作用，建立科技创新与人才培养相互支撑、带动学科高质量发展的有效机制，从国家战略需求中凝练重大科技问题，持续产出原创性、颠覆性科技创新成果。"},{"sub":"二、国际时政","text":"1.2026年6月23日，中共中央政治局委员、中央外办主任王毅在新德里出席金砖国家安全事务高级代表会议。"},{"sub":"二、国际时政","text":"王毅表示，金砖国家合作已走过20个春秋，日益成为世界上护和平、促发展、守正义的中坚力量。面对当前国际格局发生的复杂深刻变化，中方愿同金砖国家一道，共同应对人类社会面临的紧迫挑战，共同坚守世界历史演进的正确方向。"},{"sub":"二、国际时政","text":"16一是以金砖担当捍卫国际秩序。要高举多边主义旗帜，坚定捍卫联合国宪章宗旨和原则，旗帜鲜明反对单边主义、保护主义。作为全球南方第一方阵，金砖国家要带头说公道话、办公道事，提高在国际事务中的地位和作用。"},{"sub":"二、国际时政","text":"二是以金砖共识破解安全困局。要倡导共同、综合、合作、可持续的安全观，坚定推动热点问题的政治解决，积极探讨对话协商解决争端的有效方式。"},{"sub":"二、国际时政","text":"三是以金砖行动应对全球性挑战。要坚决打击一切形式恐怖主义，旗帜鲜明反对外空军事化，有力应对全球能源和粮食安全挑战，加强战略性矿产资源合作，团结应对非洲埃博拉疫情。"},{"sub":"二、国际时政","text":"四是以金砖智慧完善新兴领域治理。要密切防范人工智能风险，规范人工智能发展方向，支持以联合国为主渠道推进全球网络空间和数字治理。"},{"sub":"二、国际时政","text":"王毅表示，金砖的活力在于平等互利，金砖的力量在于团结互助。中方明年将担任金砖轮值主席国，愿同金砖伙伴一道，积极践行习近平主席提出的四大全球倡议，以发展促繁荣、以安全保稳定、以文明增互信、以治理求公正，共同开辟和平与繁荣的未来。"},{"sub":"二、国际时政","text":"1.（单选）科技创新靠人才，人才培养靠教育，要一体推进教育强国、科技强国和人才强国建设。全面建设社会主义现代化国家的基础性、战略性支撑是A.经济高质量发展B.坚持中国共产党的领导C.实现人自由而全面的发展D.教育、科技、人才"},{"sub":"二、国际时政","text":"2.（多选）培育发展未来产业，对于我们抢占科技和产业制高点、牢牢把握发展主动权，对于发展新质生产力、建设现代化产业体系，对于提高人民生活品质、促进人的全面发展和社会全面进步，都具有重要意义。培育发展未来产业，要做到A.推动未来产业完全取代传统产业B.大力提升科技支撑引领能力C.强化产业协同和联动发展D.加大重点领域关键核心技术攻关力度参考答案："},{"sub":"二、国际时政","text":"1.D 2.BCD17187 月"},{"sub":"一、国内时政","text":"1.庆祝中国共产党成立105周年大会在北京人民大会堂隆重举行。中共中央总书记、国家主席、中央军委主席习近平发表重要讲话。"},{"sub":"一、国内时政","text":"习近平强调，105年来，我们党团结带领全国各族人民不懈奋斗，创造了新民主主义革命、社会主义革命和建设、改革开放和社会主义现代化建设、新时代中国特色社会主义的伟大成就，书写了中华民族几千年历史上最恢宏的史诗。105年不懈奋斗，从根本上改变了中国人民的前途命运，开辟了实现中华民族伟大复兴的正确道路，展示了马克思主义的强大生命力，深刻影响了世界历史进程，锻造了强大的中国共产党。我们党完全无愧为伟大光荣正确的党。"},{"sub":"一、国内时政","text":"习近平指出，中国共产党之所以能够在105年奋斗中不断铸就辉煌，历史和人民之所以选择中国共产党，根本在于我们党具有其他政党和政治力量无可比拟的优秀特质。我们党矢志追求真理、始终把准前进方向，深深植根人民、始终拥有坚实根基，勇担历史使命、始终掌握战略主动，顺应发展潮流、始终走在时代前列，敢于善于斗争、始终保持必胜信心，注重强健自身、始终充满生机活力。我们要结合新的实际，把党的优秀特质不断发扬光大，确保党永远不变质不变色不变味，始终具有强大创造力凝聚力战斗力。"},{"sub":"一、国内时政","text":"习近平强调，实现新时代新征程党的使命任务，要求全体中国共产党人坚定信心、接续奋斗，不断创造无愧于时代和人民的新业绩。坚定信心、接续奋斗，必须坚持党的基本理论、基本路线、基本方略，坚持党的全面领导和党中央集中统一领导，深入贯彻习近平新时代中国特色社会主义思想，坚定道路自信、理论自信、制度自信、文化自信，继往开来、守正创新，做到不畏浮云遮望眼、乘风破浪不迷航。必须紧紧依靠人民创造历史伟业，践行以人民为中心的发展思想，充分激发亿万人民的积极性主动性创造性，统筹推进“五位一体”总体布局、协调推进“四个全面”战略布局，完整准确全面贯彻新发展理念，加快构建新发展格局，扎实推动高质量发展。必须积极应对前进道路上的风险挑战，强化忧患意识、坚持底线思维，发扬斗争精神、增强斗争本领，更好统筹国内国际两个大局，统筹发展和安全。"},{"sub":"一、国内时政","text":"必须持续推动构建人类命运共同体，高举和平、发展、合作、共赢旗帜，弘扬全人类共同价值，推动落实全球发展倡议、全球安全倡议、全球文明倡议、全球治理倡议，为世界和平与发展注入更多正能量。必须持之以恒推进全面从严治党，全面贯彻新时代党建思想，健全全面从严治党体系，以党的政治建设为统领加强党的各方面建设，坚决打好反腐败斗争攻坚战持久战总体战，不断增强党的政治领导力、思想引领力、群众组织力、社会号召力。"},{"sub":"一、国内时政","text":"19习近平强调，青年是实现中华民族伟大复兴的生力军。全党要重视青年、关心青年、支持青年，为青年成长成才创造条件。新时代中国青年要坚定不移听党话、跟党走，树立远大志向，勇担时代重任，在新征程上跑好历史接力赛，用青春铺路、让理想闪光。"},{"sub":"一、国内时政","text":"2.国家科学技术奖励大会、中国科学院第二十二次院士大会和中国工程院第十八次院士大会、中国科学技术协会第十一次全国代表大会在北京人民大会堂隆重召开。中共中央总书记、国家主席、中央军委主席习近平出席大会并发表重要讲话。"},{"sub":"一、国内时政","text":"习近平强调，新一轮科技革命和产业变革深刻改变人类生产生活方式和世界发展格局。"},{"sub":"一、国内时政","text":"我们要适应新形势新要求，采取更加有力的措施，切实解决我国科技发展中存在的问题，全力抓好党中央关于科技事业各项部署的落实。"},{"sub":"一、国内时政","text":"习近平指出，要增强科技创新体系化攻关能力，提升国家创新体系整体效能。坚持“四个面向”战略导向，进一步加强科技战略规划、政策措施、重大任务、科研力量、资源平台、区域创新等方面统筹。完善国家重大科技创新任务部署和组织实施机制，强化科研基础条件自主保障。优化国家战略科技力量功能定位和布局，推动任务协同、资源共享、优势互补。"},{"sub":"一、国内时政","text":"加强对各层级科技工作的统筹指导，形成央地协同、区域联动的制度安排。"},{"sub":"一、国内时政","text":"习近平强调，要推动科技创新和产业创新深度融合，打通科技加速向现实生产力转化的通道。科技创新要突出应用导向，产业创新要提出科学问题。加强国家技术转移体系建设，打造多元化应用场景和高水平产业集群，促进自主研发技术产品推广应用和迭代升级。完善知识产权保护制度。构建同科技创新相适应的科技金融体制。"},{"sub":"一、国内时政","text":"习近平指出，科学的未来在青年，要优化科教协同育人机制，大力培养优秀青年科技人才。加大对科研人员支持力度，帮助解决实际困难，让他们潜心钻研、安身安心安业。注重挖掘和培养青少年兴趣特长、科学素养、实验能力，吸引更多具有科研潜质的青少年立志投身科技事业。"},{"sub":"一、国内时政","text":"习近平强调，要提高科技创新投入效能，实现投入规模增加与效能提升的统一。完善中央财政科技经费分配和管理使用机制，健全重大科技任务央地投入共担机制。改进科技计划管理，加强科技项目监督检查和绩效评估。引导企业增加研发投入，调动更多社会力量支持科技创新。"},{"sub":"一、国内时政","text":"习近平指出，要深化科技评价改革，用好科技评价指挥棒。项目评审、机构评估、人才评价都要强化创新能力、质量、实效、贡献导向。加快“破四唯”，持续深化科教界“帽子”治理。大力弘扬科学家精神，加强科研诚信建设，营造风清气正的科研生态。"},{"sub":"一、国内时政","text":"习近平强调，要加强科技伦理和安全治理，推动科技向上向善、安全可控、造福人民。"},{"sub":"一、国内时政","text":"完善政策制度、法律法规和治理规范，健全多方参与、协同共治的体制机制。明确重点领域20伦理标准和指引，加强科技安全风险研判、监测预警和应急响应。深度参与全球科技治理，广泛宣介中国主张和中国方案。"},{"sub":"一、国内时政","text":"习近平指出，推动我国科技事业欣欣向荣，需要全党全社会共同努力。各级党委和政府要把科技工作摆上重要日程，树立和践行正确政绩观，真抓实干，久久为功，不断抓出新成效。"},{"sub":"一、国内时政","text":"中国科学院、中国工程院要团结全国科技界把握新一轮科技革命方向，勇攀世界科学高峰。"},{"sub":"一、国内时政","text":"中国科协要坚持探索创新，尽心尽力为科技工作者服务、为创新驱动发展服务、为提高全民科学素质服务、为党和政府科学决策服务。"},{"sub":"二、国际时政","text":"1. 习近平出席2026世界人工智能大会暨人工智能全球治理高级别会议开幕式并发表主旨讲话习近平指出，当前，世界百年变局加速演进，新一轮科技革命和产业变革加速突破，全球人工智能技术创新进入前所未有的活跃期，既蕴含巨大机遇，也面临治理挑战。人类不得不直面时代之问：当机器开始思考，人类如何与之相处？当算法参与决策，安全如何保障？"},{"sub":"二、国际时政","text":"当技术挑战伦理，治理如何跟上？当鸿沟不断拉大，普惠如何实现？中方认为，各国应当秉持以人为本、向上向善理念，让人工智能成为促进共同繁荣、维护共同安全的一个重要动力源，携手构建公正合理的全球人工智能治理体系。"},{"sub":"二、国际时政","text":"习近平就此提出4点意见：第一，坚持开放共赢，驱动创新发展。抓住难得的历史性机遇，鼓励开源开放、合作共享，全面促进人工智能科技创新、产业发展、场景应用，协同推进传统产业改造升级、新兴产业培育壮大、未来产业前瞻布局，让人工智能赋能千行百业。"},{"sub":"二、国际时政","text":"第二，强化风险意识，确保安全可控。高度重视人工智能引发的各类内生和衍生风险，推动构建法律法规、技术监测、风险预警、应急响应体系，筑牢安全底线，防范滥用恶用，确保人工智能始终处于人类控制之下。共同反对在人工智能领域泛化国家安全概念、把本国安全凌驾于他国安全之上的做法。"},{"sub":"二、国际时政","text":"第三，鼓励包容并蓄，促进文明互鉴。用全人类共同价值塑造人工智能的价值观，善用人工智能技术增进不同文明的理解和包容，促进不同文明交流互鉴，精心培育各美其美、美美与共的文明百花园。"},{"sub":"二、国际时政","text":"第四，倡导和衷共济，完善全球治理。践行真正的多边主义，切实发挥联合国的重要作用，加强人工智能发展战略、治理规则、技术标准的对接协调，早日形成具有广泛共识的全球治理框架，让这一前沿技术更好造福人类社会。帮助“全球南方”国家加强能力建设，弥合数智鸿沟，促进可持续发展，避免在人工智能领域造成新的历史不公。"},{"sub":"二、国际时政","text":"21习近平强调，今年是中国“十五五”开局之年。“十五五”规划为未来5年中国经济社会发展擘画蓝图，也为国际社会提供机遇清单。近年来，中国坚持有效市场和有为政府相结合，加强人工智能科技创新，积极推进“人工智能+”行动，培育各类主体共生共荣的健康生态，智能经济核心产业规模已经超过万亿元人民币，“中国智造”已成为中国式现代化的又一亮丽名片。同时，中国坚持发展和安全并重，不断完善相关法律法规、政策制度、应用规范、伦理准则，确保人工智能安全、可靠、可控。作为负责任大国，中国在人工智能领域始终致力于做国际公共产品的提供者，源源不断贡献中国方案。"},{"sub":"二、国际时政","text":"习近平指出，在各方共同努力下，世界人工智能合作组织在上海应运而生。这是中方响应全球南方呼声、团结国际社会积极推动人工智能发展和治理的重大举措，将成为人工智能发展史上的一个重要里程碑。为进一步支持全球人工智能发展、推进全球人工智能能力建设，未来5年，中国将面向发展中国家提供5000个人工智能专题研修培训名额；面向东盟、阿盟、非盟、拉共体、上合组织、金砖国家建设国际人工智能应用合作中心；推动气象智能预警方案“妈祖”在30个国家落地应用。中国愿以更加开放的姿态、更加务实的行动、更加长远的目光，同各方一道把握和应对人工智能发展的机遇和挑战，携手共创人类社会更加美好的未来。"},{"sub":"二、国际时政","text":"1.（单选）在庆祝中国共产党成立 105 周年大会上的讲话指出，中国共产党百年奋斗不断铸就辉煌，历史和人民选择中国共产党的根本原因在于党具备六大无可比拟的优秀特质，其中党永葆坚实根基的核心特质是A. 矢志追求真理，始终把准前进方向B. 深深植根人民，江山就是人民，人民就是江山C. 敢于善于斗争，始终保持必胜信心D. 注重自我革命，始终充满生机活力"},{"sub":"二、国际时政","text":"2.（单选）在 “十五五”开局之年召开的国家科学技术奖励大会、两院院士大会、中国科协第十一次全国代表大会上，强调我们必须抓住历史机遇，迎接时代挑战，加快推进高水平科技自立自强，向着到2035年建成科技强国的目标坚定迈进，扎扎实实以科技创新支撑和引领中国式现代化。以高水平科技自立自强引领发展新质生产力的关键是A. 完善国家重大科技基础设施布局B. 推动科技创新和产业创新深度融合C. 全方位培养引进青年科技人才22D. 深化科技评价改革，破除 “四唯” 桎梏"},{"sub":"二、国际时政","text":"3.（多选）当前，世界百年变局加速演进，新一轮科技革命和产业变革加速突破，全球人工智能技术创新进入前所未有的活跃期，既蕴含巨大机遇，也面临治理挑战。习近平主席就此提出的意见分别是A. 坚持开放共赢，驱动创新发展B. 强化风险意识，确保安全可控C. 鼓励包容并蓄，促进文明互鉴D. 倡导和衷共济，完善全球治理参考答案："},{"sub":"二、国际时政","text":"1.B 2.B 3.ABCD238 月"},{"sub":"一、国内时政","text":"1. 8月15 日《中华人民共和国生态环境法典》正式施行2026年8月15日，《中华人民共和国生态环境法典》正式施行，标志着我国生态环境保护进入“法典化”治理新阶段。该法典是全球首部以“生态环境”命名的法典，是我国生态文明法治建设的重大标志性成果。"},{"sub":"一、国内时政","text":"法典系统整合了30多部生态环境法律、100余件行政法规、1000多件地方性法规，为实现人与自然和谐共生的现代化筑牢更强法治根基，构建了以“总则—污染防治—生态保护—绿色低碳发展—法律责任”为框架的完整体系，确立了“预防为主、系统治理、生态优先、绿色发展、公众参与、损害担责”的基本原则。法典的颁布实施，是贯彻落实习近平生态文明思想的重大法治实践，为美丽中国建设提供了系统性、整体性、协同性的法治保障。这一立法创新体现了以人民为中心的发展思想，将人民群众对优美生态环境的需要转化为法律权利；彰显了中国特色社会主义法治道路的制度优势，为全球环境治理贡献了中国方案和中国智慧，推动构建人与自然和谐共生的地球家园。"},{"sub":"一、国内时政","text":"2.8月17日，纪念江泽民同志诞辰100周年大会2026年8月17日上午，纪念江泽民同志诞辰100周年大会在北京人民大会堂隆重举行。中共中央总书记、国家主席、中央军委主席习近平发表重要讲话。"},{"sub":"一、国内时政","text":"习近平总书记全面回顾了江泽民同志光辉的一生和建立的丰功伟绩。江泽民同志是全党全军全国各族人民公认的享有崇高威望的卓越领导人，伟大的马克思主义者，伟大的无产阶级革命家、政治家、军事家、外交家，久经考验的共产主义战士，中国特色社会主义伟大事业的杰出领导者，党的第三代中央领导集体的核心，“三个代表”重要思想的主要创立者。"},{"sub":"一、国内时政","text":"习近平强调，江泽民同志留给我们的最可宝贵的财富，就是“三个代表”重要思想，这一重要思想是对马克思列宁主义、毛泽东思想、邓小平理论的继承和发展，反映了当代世界和中国的发展变化对党和国家工作的新要求，是加强和改进党的建设、推进我国社会主义自我完善和发展的强大理论武器。我们要继承江泽民同志的遗志，把新时代中国特色社会主义伟大事业不断推向前进，以实际行动纪念这位为党和人民建立了不朽功勋的卓越领导人。"},{"sub":"一、国内时政","text":"3.8月22日 绿色算力（人工智能）大会2026年8月22日，绿色算力（人工智能）大会在内蒙古自治区呼和浩特市开幕。本次大会以“共筑算电协同之路，共商多元经济新局，共创人工智能未来”为主题，集中发布多项绿色智算创新成果，正式启动数字服务出海平台，落地全国视频大模型算力基地。"},{"sub":"一、国内时政","text":"24大会深入贯彻落实国家“东数西算”工程战略部署，充分发挥内蒙古清洁能源富集、气候冷凉的自然禀赋优势，推动算力基础设施绿色化、集约化、智能化发展。大会发布的绿色智算成果涵盖高效制冷、可再生能源利用、算网协同等关键技术领域，为全国算力产业低碳转型提供技术路径。数字服务出海平台的启动，标志着我国数字贸易国际化布局迈出关键步伐；全国视频大模型算力基地的落地，将有效支撑人工智能大模型训练推理需求，赋能千行百业数字化转型。本次大会是落实“双碳”目标、发展新质生产力的重要实践，对于优化全国算力资源配置、促进区域协调发展、建设数字中国具有重要推动作用。"},{"sub":"二、国际时政","text":"1.8月27日至28日，2026年亚太经合组织（APEC）第三次高官会在辽宁省大连市举行。"},{"sub":"二、国际时政","text":"马朝旭表示，APEC“中国年”进程启动以来，各方深入讨论，进一步凝聚建设亚太共同体的共识，初步形成亚太共同体的“四梁八柱”，为区域经济一体化注入了新的动力。中国将当好东道主，同APEC各方一道，聚焦务实合作和普惠发展，打造领导人非正式会议成果，推动亚太共同体建设走深走实。"},{"sub":"二、国际时政","text":"与会各方高度评价APEC“中国年”各领域合作进展，赞赏中方为推动亚太共同体建设所作努力，期待深圳APEC领导人会议取得丰硕成果，为促进亚太乃至全球发展作出更大贡献。"},{"sub":"二、国际时政","text":"此次高官会是APEC“中国年”规模最大、活动最多的一次高官会。高官会期间，APEC各委员会、工作组共举行近130场会议和活动，涉及贸易、交通、粮食、海关、科技、能源、卫生、减灾、反腐败等领域，来自APEC各成员经济体、秘书处、观察员等的3000多位代表出席。"},{"sub":"二、国际时政","text":"1.（单选）2026年8月15日，我国《中华人民共和国生态环境法典》正式施行，恰逢第四个全国生态日，标志着我国生态环境保护迈入系统化、法典化、法治化全新阶段。该法典的重大标志性地位是A. 全球首部以“生态环境”命名的法典B. 我国第一部国家级法典C. 全球首部碳中和专项法典D. 我国首部民生领域综合性法典25"},{"sub":"二、国际时政","text":"2.（单选）2026年8月17日，纪念江泽民同志诞辰100周年大会在北京隆重举行，习近平总书记发表重要讲话，全面回顾江泽民同志的光辉一生、历史贡献与崇高风范，深刻总结新时代继承和发展中国特色社会主义的实践要求。作为党的第三代中央领导集体的核心，江泽民同志最核心、最标志性的理论贡献是A. 科学回答了新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义B. 创立“三个代表”重要思想，深化对中国特色社会主义建设规律的认识C. 系统回答了实现什么样的发展、怎样发展的重大问题D. 首次明确社会主义初级阶段理论与基本路线"},{"sub":"二、国际时政","text":"3.（多选）2026绿色算力（人工智能）大会在呼和浩特成功举办，立足我国“东数西算”国家战略布局，聚焦绿色算力、人工智能融合发展，发布多项行业重磅成果，落地国家级算力基础设施平台，助力新质生产力发展与数字经济对外开放。本次大会落地、启动的重要成果有A. 全国视频大模型算力基地落地B. 启动数字服务出海综合服务平台C. 我国数字贸易国际化布局全面完成D. 发布多项绿色算力、智算行业研究成果参考答案："},{"sub":"二、国际时政","text":"1.A 2.B 3.ABD269 月国内时政"},{"sub":"二、国际时政","text":"1.习近平主持召开中共中央政治局会议中共中央政治局9月21日召开会议，研究持之以恒推进全面从严治党重大问题。中共中央总书记习近平主持会议。"},{"sub":"二、国际时政","text":"会议强调，持之以恒推进全面从严治党必须坚持马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观，全面贯彻习近平新时代中国特色社会主义思想，深入学习贯彻习近平党建思想，围绕实现党的使命任务，落实新时代党的建设总要求，以党章为根本，坚持党的先锋队性质，坚持党的全面领导和党中央集中统一领导，着眼于提高党的长期执政能力、保持党的先进性和纯洁性、保持党同人民群众的血肉联系，坚持严的基调不动摇，健全全面从严治党体系，以党的政治建设为统领，全面推进党的各方面建设，充分激发全党积极性主动性创造性，不断实现党的自我净化、自我完善、自我革新、自我提高，持续增强党的政治领导力、思想引领力、群众组织力、社会号召力，确保党始终成为走在时代前列、人民衷心拥护、经得起各种风浪考验、朝气蓬勃的马克思主义执政党，始终成为中国特色社会主义事业的坚强领导核心。"},{"sub":"二、国际时政","text":"国际时政"},{"sub":"二、国际时政","text":"1.习近平在埃及媒体发表署名文章"},{"sub":"二、国际时政","text":"9月1日，国家主席习近平在埃及发表题为《风雨同舟七十载，踔厉奋发新征程》的署名文章。习近平指出，中埃始终是和衷共济的亲密兄弟，中埃始终是合作共赢的可靠伙伴，中埃始终是友好互鉴的成功典范，中埃始终是平等互信的真诚朋友。"},{"sub":"二、国际时政","text":"中埃两国都处在发展振兴的关键阶段，中方愿同埃方一道，深化全面战略伙伴关系，推进中埃命运共同体建设，携手实现现代化。我们要增进互信，做传承友谊的楷模。我们要互利共赢，做携手发展的标杆。我们要各美其美，做文明交流的榜样。我们要并肩前行，做维护公平正义的先锋。我们要携手同心，做中阿、中非合作的引领者。"},{"sub":"二、国际时政","text":"2.习近平出席上海合作组织成员国元首理事会会议"},{"sub":"二、国际时政","text":"9月1日，国家主席习近平在比什凯克出席上海合作组织成员国元首理事会第二十六次会议。习近平同上海合作组织成员国领导人集体合影，随后出席元首理事会会议并发表题为《推动上海合作组织实现更高质量发展》的重要讲话。"},{"sub":"二、国际时政","text":"习近平指出，今年是上海合作组织成立25周年。25年来，上海合作组织走过不平凡历程。最重大的发展成就是一步步成为世界上幅员最广、人口最多、发展潜力巨大的新型区27域合作组织；最宝贵的精神财富是开创性提出和始终遵循互信、互利、平等、协商、尊重多样文明、谋求共同发展的“上海精神”；最重要的合作经验是找到不结盟、不对抗、不针对第三方的正确共处之道，推动地区国家携手建设共同家园。"},{"sub":"二、国际时政","text":"习近平提出4点主张：第一，坚持发展优先，开创共同繁荣的前景。第二，坚持安全为要，营造普遍安全的环境。第三，坚持以人为本，厚植世代友好的根基。第四，坚持对话协商，完善公平有序的治理。"},{"sub":"二、国际时政","text":"3.习近平在比什凯克出席“上海合作组织+”会议"},{"sub":"二、国际时政","text":"9月1日下午，国家主席习近平在比什凯克出席“上海合作组织+”会议并发表题为《共同倡导平等有序的世界多极化 实现更加公正合理的全球治理》的重要讲话。"},{"sub":"二、国际时政","text":"习近平指出，这次会议聚焦加强联合国作用、构建多极世界，彰显了上海合作组织改革完善全球治理的时代担当。习近平强调，中国作为负责任大国，积极倡导平等有序的世界多极化，主权平等、相互尊重是根本原则，均衡有序、遵守法治是必然要求，多边主义、对话协商是关键路径，互利共赢、普惠包容是发展方向。"},{"sub":"二、国际时政","text":"习近平就更好发挥上海合作组织作用提出3点建议：第一，以“上合力量”驱动亚欧大陆繁荣共兴。第二，以“上合智慧”推动全球南方发展壮大。第三，以“上合行动”引领全球治理改革完善。"},{"sub":"二、国际时政","text":"4.习近平出席金砖国家领导人第十八次会晤第二阶段会议"},{"sub":"二、国际时政","text":"9月13日上午，国家主席习近平在新德里出席金砖国家领导人第十八次会晤第二阶段会议，并发表题为《筑牢金砖合作根基 壮大全球南方力量》的重要讲话。"},{"sub":"二、国际时政","text":"习近平强调，“全球南方”国家要共同捍卫国际法治，维护主权平等、不干涉内政、和平解决争端等国际关系基本准则，确保国际法和国际规则平等适用、不搞双重标准；要高举多边主义旗帜，维护联合国权威和作用，支持多边机构改革增效，推动世界贸易组织改革保持正确方向，改革完善国际金融架构，提高发展中国家代表性和发言权；要坚持以人民为中心的发展思想，推动落实联合国2030年可持续发展议程；要携手推进安全治理，共同应对传统和非传统安全威胁，完善全球气候治理，加快形成具有广泛共识的全球人工智能治理框架、让新兴技术照亮共同繁荣之路。"},{"sub":"二、国际时政","text":"习近平就深化金砖合作提出5项倡议：一是人工智能开源普惠倡议。二是贸易投资便利化倡议。三是数字产业合作倡议。四是智能制造合作倡议。五是科技育才倡议。"},{"sub":"二、国际时政","text":"5.习近平抵达华盛顿对美国进行国事访问28"},{"sub":"二、国际时政","text":"9月23日下午，国家主席习近平乘专机抵达华盛顿，应美国总统特朗普邀请，对美国进行国事访问。"},{"sub":"二、国际时政","text":"习近平指出，中国和美国都是伟大的国家，中国人民和美国人民都是伟大的人民。中美两国人民长期友好交往，双方利益深度交融，两国应该成为伙伴而不是对手，实现中华民族伟大复兴和让美国再次伟大，完全可以并行不悖、相互成就、造福世界。特朗普总统今年5月访问中国时，我们同意构建中美建设性战略稳定关系，为未来中美关系发展作出战略指引。"},{"sub":"二、国际时政","text":"中美双方应该相向而行，推动形成合作为主、竞争有度、分歧可控、和平可期的稳定关系，走出一条新时代中美两个大国正确相处之道。"},{"sub":"二、国际时政","text":"1.（单选）9月1日，在赴开罗对埃及进行国事访问之际，国家主席习近平在埃及《金字塔报》《消息报》《共和国报》发表的署名文章题为A.《风雨同舟七十载，踔厉奋发新征程》B.《共同倡导平等有序的世界多极化，实现更加公正合理的全球治理》C.《筑牢金砖合作根基，壮大全球南方力量》D.《推动中埃两国实现更高质量发展》"},{"sub":"二、国际时政","text":"2.（多选）9月1日，国家主席习近平在比什凯克出席上海合作组织成员国元首理事会第二十六次会议。习近平提出的主张为A.坚持发展优先，开创共同繁荣的前景B.坚持安全为要，营造普遍安全的环境C.坚持以人为本，厚植世代友好的根基D.坚持对话协商，完善公平有序的治理"},{"sub":"二、国际时政","text":"3.（多选）9月1日下午，国家主席习近平在比什凯克出席“上海合作组织+”会议并发表题为《共同倡导平等有序的世界多极化 实现更加公正合理的全球治理》的重要讲话。习近平就更好发挥上海合作组织作用提出的建议为A.以“上合担当”守护亚欧大陆和平安宁B.以“上合力量”驱动亚欧大陆繁荣共兴C.以“上合智慧”推动全球南方发展壮大D.以“上合行动”引领全球治理改革完善29"},{"sub":"二、国际时政","text":"4.（多选）9月13日上午，国家主席习近平在新德里出席金砖国家领导人第十八次会晤第二阶段会议，并发表题为《筑牢金砖合作根基 壮大全球南方力量》的重要讲话。习近平就深化金砖合作提出的倡议为A.人工智能开源普惠倡议B.贸易投资便利化倡议C.数字产业与智能制造合作倡议D.科技育才倡议"},{"sub":"二、国际时政","text":"5.（单选）深入学习贯彻习近平党建思想，围绕实现党的使命任务，落实新时代党的建设总要求。全面从严治党起统领作用的建设是A.政治建设B.思想建设C.组织建设D.制度建设"},{"sub":"二、国际时政","text":"6.（多选）9月23日，习近平抵达美国安德鲁斯空军基地发表书面讲话。习近平总书记希望中美两国走出一条新时代正确相处之道，构建中美建设性战略稳定关系，为未来中美关系发展作出战略指引。其关系特点为A.竞争有度B.合作为主C.和平可期D.分歧可控参考答案："},{"sub":"二、国际时政","text":"1.习近平在庆祝中华人民共和国成立77周年招待会上发表重要讲话"},{"sub":"二、国际时政","text":"9月30日晚，庆祝中华人民共和国成立77周年招待会在北京人民大会堂举行。中共中央总书记、国家主席、中央军委主席习近平出席招待会并发表重要讲话。习近平指出，77年来，我们党团结带领人民不懈奋斗，创造了经济快速发展和社会长期稳定两大奇迹，实现了全面建成小康社会的第一个百年奋斗目标，正朝着全面建成社会主义现代化强国的第二个百年奋斗目标奋勇前进。"},{"sub":"二、国际时政","text":"习近平强调，今年以来，全党全国上下锐意进取、奋力拼搏，编制实施“十五五”规划，扎实推进各方面工作，我国经济顶压前行、向新向优、展现出强大韧性和活力，党和国家事业取得新进展新成效。我们要坚持稳中求进工作总基调，完整准确全面贯彻新发展理念，加快构建新发展格局，进一步深化改革开放，更好统筹发展和安全，推动经济持续向新向优向好发展，切实保障和改善民生，努力完成全年目标任务，实现“十五五”良好开局。"},{"sub":"二、国际时政","text":"习近平指出，我们要坚定不移贯彻“一国两制”“港人治港”“澳人治澳”、高度自治方针，支持香港、澳门更好融入和服务国家发展大局，保持长期繁荣稳定。要深化两岸交流合作，坚决打击“台独”分裂势力，反对外部势力干涉，推动两岸关系和平发展，推进祖国统一大业。习近平强调，我们要坚持独立自主的和平外交政策，推动落实四大全球倡议，推动构建人类命运共同体，为变乱交织的世界注入更多确定性和正能量。"},{"sub":"二、国际时政","text":"习近平指出，经过长期探索和实践，中国特色社会主义制度展现出巨大优势，我国国家治理体系和治理能力现代化水平不断提高，实现中华民族伟大复兴势不可挡。只要我们坚定信心、锚定目标，一步一步扎实往前走，成功就一定属于伟大的中国共产党、伟大的中国人民、伟大的中华人民共和国。"},{"sub":"二、国际时政","text":"2.烈士纪念日向人民英雄敬献花篮仪式在京隆重举行"},{"sub":"二、国际时政","text":"9月30日上午，烈士纪念日向人民英雄敬献花篮仪式在北京天安门广场隆重举行。习近平、李强、赵乐际、王沪宁、蔡奇、丁薛祥、李希、韩正等党和国家领导人出席仪式，同各界代表一起向人民英雄敬献花篮。仪式由中共中央政治局委员、北京市委书记尹力主持。"},{"sub":"二、国际时政","text":"10时整，仪式正式开始，全场齐声高唱中华人民共和国国歌，随后肃立默哀，深切缅怀为中国人民解放事业和共和国建设事业英勇献身的烈士。方阵前，以中共中央、全国人大常委会、国务院、全国政协、中央军委等名义敬献的9个大型花篮一字排开，缎带上书写的“人民英雄永垂不朽”格外醒目。习近平迈步上前，仔细整理花篮缎带，随后缓步绕行，31瞻仰人民英雄纪念碑。"},{"sub":"二、国际时政","text":"今年是中国共产党成立105周年、中国工农红军长征胜利90周年。1936年10月，红军第一、第二、第四方面军先后在甘肃会宁、宁夏将台堡胜利会师，标志着历时两年、纵横十余省、行程二万五千里的长征胜利结束。长征的胜利，宣告了国民党反动派消灭中国共产党和红军的图谋彻底失败，实现了中国共产党和中国革命事业从挫折走向胜利的伟大转折。"},{"sub":"二、国际时政","text":"习近平总书记深刻指出，伟大长征精神，就是把全国人民和中华民族的根本利益看得高于一切，坚定革命的理想和信念，坚信正义事业必然胜利的精神；就是为了救国救民，不怕任何艰难险阻，不惜付出一切牺牲的精神；就是坚持独立自主、实事求是，一切从实际出发的精神；就是顾全大局、严守纪律、紧密团结的精神；就是紧紧依靠人民群众，同人民群众生死相依、患难与共、艰苦奋斗的精神。每一代人有每一代人的长征路，每一代人都要走好自己的长征路。"},{"sub":"二、国际时政","text":"3.纪念中国工农红军长征胜利90周年大会在京举行，习近平发表重要讲话"},{"sub":"二、国际时政","text":"10月22日上午，纪念中国工农红军长征胜利90周年大会在北京人民大会堂隆重举行。"},{"sub":"二、国际时政","text":"中共中央总书记、国家主席、中央军委主席习近平发表重要讲话，强调铭记历史方能开创未来，号召全党全军全国各族人民更加紧密地团结在党中央周围，大力弘扬伟大长征精神，接续奋斗、砥砺前行，把革命前辈开创的伟大事业不断推向前进，在新的长征路上奋力创造新的辉煌。"},{"sub":"二、国际时政","text":"习近平指出，从1934年10月至1936年10月，我们党领导红军第一、第二、第四方面军和第二十五军，进行了震撼世界、彪炳史册的伟大长征。红军长征纵横十余省，长驱二万五千里，跨越近百条江河，翻越皑皑雪山，穿过茫茫草地，进行600余次战役战斗，粉碎上百万敌军围追堵截，宣告国民党反动派消灭中国共产党和红军的图谋彻底失败，胜利实现北上抗日的战略转移，成功开创了中国革命新局面。"},{"sub":"二、国际时政","text":"习近平深刻阐释了长征胜利蕴含的制胜之道：红军长征的伟大胜利之路，是依靠党的正确领导、坚定的革命意志、独立自主实事求是、广大人民群众支持走出来的。他强调，在新征程上弘扬伟大长征精神、走好新的长征路，必须坚守党的理想信念宗旨，必须坚定不移推动高质量发展、不断满足人民日益增长的美好生活需要，必须勇于进行具有许多新的历史特点的伟大斗争，必须加快把人民军队建成世界一流军队，必须坚持党的领导、加强党的建设。"},{"sub":"二、国际时政","text":"32国际时政"},{"sub":"二、国际时政","text":"1.习近平对美国进行国事访问，中美同意构建建设性战略稳定关系"},{"sub":"二、国际时政","text":"9月23日至25日，国家主席习近平应邀对美国进行国事访问。这是习近平时隔11年再次对美国进行国事访问。两国元首在相互尊重的友好氛围中，就事关中美关系和世界大势的战略性、全局性问题坦诚深入交换意见。"},{"sub":"二、国际时政","text":"当地时间9月24日，习近平在白宫欢迎仪式上发表致辞，强调中美要加强沟通、真诚合作、和平共处。他指出，中美两个大国合则两利、斗则俱伤，中美不必讳言竞争，但竞争应该是良性的、有边界的，应该是你追我赶的赛跑，而不是你输我赢的角斗。中美双方必须守住不冲突、不对抗的底线，“修昔底德陷阱”是可以跨越的。"},{"sub":"二、国际时政","text":"两国元首同意共同构建“基于尊重、公平、对等的建设性战略稳定关系”。尊重，就是尊重彼此主权和领土完整，尊重各自选择的社会制度和发展道路，尊重对方核心利益和重大关切；公平，就是开展互利合作、协商处理分歧，不搞你输我赢的零和博弈，不追求单方面的绝对优势；对等，就是两国主权平等，没有高低之分，不搞霸道霸凌。"},{"sub":"二、国际时政","text":"此访期间，中美达成八点成果共识，涉及经贸、禁毒执法、人工智能、国际和地区事务等众多领域，包括相互支持对方办好亚太经合组织（APEC）领导人非正式会议和二十国集团（G20）领导人峰会，建立并推进贸易理事会等机制，达成“300亿美元”对等降税安排，建立中美人工智能对话。习近平还宣布，未来5年，中方将邀请10万名美国青少年来华交流学习。"},{"sub":"二、国际时政","text":"今年5月，两国元首在北京会晤，决定构建中美建设性战略稳定关系，确立了两国关系的新定位；此次华盛顿会晤进一步拓展了新定位的内涵，使新定位更加清晰可感。中美关系又站在新的历史起点上。"},{"sub":"二、国际时政","text":"2.全球发展倡议5周年高级别对话会举行，习近平致贺信2026年9月25日，全球发展倡议5周年高级别对话会在纽约联合国总部举行，国家主席习近平向对话会致贺信。习近平指出，发展是人类社会的永恒主题，也是实现人民幸福的关键所在。5年前，我在联合国大会上提出全球发展倡议，就是为了推动国际发展合作，重振全球发展事业，助力加快落实联合国2030年可持续发展议程。"},{"sub":"二、国际时政","text":"2021年9月，习近平主席在第七十六届联合国大会一般性辩论上提出全球发展倡议，呼吁加强国际合作，加快落实联合国《2030年可持续发展议程》。倡议以“六个坚持”为主要内容，即坚持发展优先、坚持以人民为中心、坚持普惠包容、坚持创新驱动、坚持人与33自然和谐共生、坚持行动导向。"},{"sub":"二、国际时政","text":"5年来，在各方共同努力下，全球发展倡议广泛践行，合作项目在120多个国家落地生根、开花结果，书写了共促发展、合作共赢的新篇章。目前，已有130多个国家和国际组织支持参与倡议，88个国家加入“全球发展倡议之友小组”，20多家发展机构参与联合国倡议推进工作组，动员各类发展资金230多亿美元，开展1800余个合作项目。"},{"sub":"二、国际时政","text":"习近平指出，当前，世界百年变局加速演进，各国人民对实现发展的愿望更加强烈。作为最大发展中国家和全球南方一员，中国愿同各方一道，秉持以人民为中心的发展理念，携手推动全球发展倡议走深走实，将可持续发展目标的美好愿景转化为可感可及的现实图景。从全球发展倡议到全球安全倡议、全球文明倡议、全球治理倡议，四大全球倡议相互支撑、有机统一，共同构成推动构建人类命运共同体的重要行动框架。"},{"sub":"二、国际时政","text":"3.李强出席上海合作组织成员国政府首脑（总理）理事会第二十五次会议"},{"sub":"二、国际时政","text":"10月19日至20日，上海合作组织成员国政府首脑（总理）理事会第二十五次会议在塔吉克斯坦杜尚别举行，国务院总理李强出席会议并发表讲话。"},{"sub":"二、国际时政","text":"李强指出，今年是上海合作组织成立25周年，也是落实上合组织未来10年发展战略的开局之年。习近平主席在9月比什凯克峰会上指出，站在关乎人类前途命运的十字路口，上海合作组织应该勇担历史责任，主动引领历史航向。"},{"sub":"二、国际时政","text":"李强强调，上合组织应当持续弘扬“上海精神”，既致力于地区稳定繁荣，也为世界共同发展贡献力量。中方愿同各方加强协调，尽快完成“四个安全中心”建章立制，做实做强合作项目，推动上合组织实现更高质量发展。"},{"sub":"二、国际时政","text":"4.中多构建命运共同体，习近平提出非洲热点问题4条原则"},{"sub":"二、国际时政","text":"10月13日，国家主席习近平在北京人民大会堂会见来华进行正式访问的多哥部长会议主席福雷，两国领导人宣布将双边关系定位提升为新时代中多命运共同体；10月15日，《中华人民共和国政府和多哥共和国政府关于构建新时代中多命运共同体的联合声明》发布。"},{"sub":"二、国际时政","text":"习近平就各方建设性参与非洲热点问题解决提出坚持非洲主导、维护公平正义、推动止戈为和、实行标本兼治4条原则，为推动冲突通过政治和和平方式解决、维护和平稳定、加强“全球南方”国家合作提供了重要框架。"},{"sub":"二、国际时政","text":"中多友好合作堪称中非友好和南南合作的卓越范例。中方欢迎多哥用好零关税和输华产品“绿色通道”等举措，愿同多方加强新能源、数智等领域合作，助力多哥工业化进程。"},{"sub":"二、国际时政","text":"5中国共产党第二十届中央委员会第五次全体会议34中国共产党第二十届中央委员会第五次全体会议，于2026年10月26日至29日在北京举行。全会听取和讨论了习近平受中央政治局委托所作的工作报告，审议通过了《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》。"},{"sub":"二、国际时政","text":"全会回顾党100多年来的奋斗历程，在革命、建设、改革中先后把党的建设作为伟大工程、新的伟大工程，党的十八大以来深入推进新时代党的建设新的伟大工程，找到“让人民来监督政府”和“自我革命”两个跳出治乱兴衰历史周期率的答案，这是中国共产党的独特创造，永载马克思主义政党建设史册。"},{"sub":"二、国际时政","text":"全会高度评价新时代全面从严治党取得的伟大成就。新时代全面从严治党开辟了百年大党自我革命新境界，推动党和国家事业取得历史性成就、发生历史性变革，党和人民赢得强党强国的历史主动。"},{"sub":"二、国际时政","text":"全会指出，在新时代管党治党、兴党强党伟大实践中，以习近平同志为核心的党中央围绕建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党的重大时代课题，提出一系列新理念新思想新战略，形成习近平党建思想。这一思想丰富和发展了马克思主义建党学说，是坚持把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合推进党的理论创新的重大成果，是党和人民实践经验和集体智慧的结晶，是习近平新时代中国特色社会主义思想的重要组成部分，为深入推进新时代党的建设新的伟大工程提供了根本遵循和行动指南。"},{"sub":"二、国际时政","text":"全会强调，持之以恒推进全面从严治党遵循的原则是：坚持服务使命任务，坚持以党的政治建设为统领，坚持全面从严，坚持问题导向，坚持守正创新，坚持以上率下，坚持依规治党。"},{"sub":"二、国际时政","text":"全会提出，增强党性是全面从严治党的根本性任务。"},{"sub":"二、国际时政","text":"全会提出，民主集中制是党的根本组织原则和领导制度，贯彻执行民主集中制是全面从严治党的内在要求。"},{"sub":"二、国际时政","text":"全会提出，全面从严治党关键在从严治吏。"},{"sub":"二、国际时政","text":"全会提出，一体推进不敢腐不能腐不想腐是全面从严治党的重要方略和反腐败斗争的基本方针。"},{"sub":"二、国际时政","text":"全会提出，加强党内法规制度建设是全面从严治党的长远之策、根本之策。"},{"sub":"二、国际时政","text":"全会强调，持之以恒推进全面从严治党是全党的共同政治责任。"},{"sub":"二、国际时政","text":"全会号召，全党更加紧密地团结在以习近平同志为核心的党中央周围，全面贯彻习近平新时代中国特色社会主义思想，励精图治、奋发图强，持之以恒推进全面从严治党，不断35开创新时代管党治党、兴党强党新局面，团结带领全国各族人民为全面建成社会主义现代化强国、以中国式现代化全面推进中华民族伟大复兴而不懈奋斗。"},{"sub":"二、国际时政","text":"1.（单选）2026年9月30日晚，庆祝中华人民共和国成立77周年招待会在北京人民大会堂举行，习近平出席并发表重要讲话指出，77年来，我们党团结带领人民不懈奋斗，创造的两大奇迹是A.经济快速发展和社会长期稳定B.经济高速增长和社会和谐稳定C.科技自立自强和社会长期稳定D.经济高质量发展和社会全面进步"},{"sub":"二、国际时政","text":"2.（多选）2026年是中国共产党成立105周年、中国工农红军长征胜利90周年。9月30日，烈士纪念日向人民英雄敬献花篮仪式在北京天安门广场隆重举行。下列关于红军长征的表述正确的有A.长征的胜利标志着中国共产党和中国革命事业由挫折走向胜利的转折B.长征途中召开的遵义会议，挽救了党、挽救了红军、挽救了中国革命C.1936年10月，红军三大主力在甘肃会宁、宁夏将台堡胜利会师D.长征的胜利，宣告了国民党反动派消灭中国共产党和红军的图谋彻底失败"},{"sub":"二、国际时政","text":"3.（多选）2026年9月23日至25日，国家主席习近平应邀对美国进行国事访问。下列关于此次访问的表述正确的有A.中美两国合则两利、斗则俱伤B.两国元首同意共同构建“基于尊重、公平、对等的建设性战略稳定关系”C.双方达成八点成果共识，涉及经贸、禁毒执法、人工智能、国际和地区事务等领域D.中美两国主权平等，没有高低之分"},{"sub":"二、国际时政","text":"4.（单选）2026年9月25日，全球发展倡议5周年高级别对话会在纽约联合国总部举行，习近平主席向对话会致贺信。全球发展倡议以“六个坚持”为主要内容，其首要内容是A.坚持发展优先B.坚持以人民为中心C.坚持创新驱动36D.坚持行动导向"},{"sub":"二、国际时政","text":"5.（多选）纪念中国工农红军长征胜利90周年大会于2026年10月22日在北京举行。习近平强调，新征程上弘扬伟大长征精神、走好新的长征路，必须A.坚守党的理想信念宗旨B.坚定不移推动高质量发展、不断满足人民日益增长的美好生活需要C.勇于进行具有许多新的历史特点的伟大斗争D.坚持党的领导、加强党的建设"},{"sub":"二、国际时政","text":"6.（单选）2026年10月19日至20日，上海合作组织成员国政府首脑（总理）理事会第二十五次会议举行。关于本次会议，下列说法正确的是A.会议在塔吉克斯坦杜尚别举行，今年是上海合作组织成立25周年B.会议在哈萨克斯坦比什凯克举行，今年是上合组织成立20周年C.会议通过了上合组织未来5年发展战略D.习近平主席出席会议并发表重要讲话"},{"sub":"二、国际时政","text":"7.（单选）2026年10月26日至29日，中国共产党第二十届中央委员会第五次全体会议在北京举行。全会审议通过了A.《关于新形势下党内政治生活的若干准则》B.《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》C.《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》D.《中共中央关于进一步全面深化改革、推进中国式现代化的决定》"},{"sub":"二、国际时政","text":"8.（单选）随着世情国情党情发生深刻变化，全面从严治党具备许多有利条件，同时面临许多新情况新问题。全党必须从巩固党的长期执政地位、实现中华民族伟大复兴的战略高度，深刻认识持之以恒推进全面从严治党的重大意义。新时代全面从严治党的根本性任务是A.增强党性B.保持定力C.拒腐防变D.依规治党"},{"sub":"二、国际时政","text":"9.（单选）一个时代有一个时代的气象。全面从严治党，是新时代党治国理政的一个鲜明特征。注目当下，继党的十八届六中全会研究全面从严治党重大问题，时隔十年，党的二十届五中全会再次以中央全会形式研究持之以恒推进全面从严治党若干重大问题。全面从严治党的长远之策、根本之策是A.加强规矩严明纪律建设37B.加强联系群众作风建设C.加强坚定信念思想建设D.加强党内法规制度建设"},{"sub":"二、国际时政","text":"10.（多选）在新时代管党治党、兴党强党伟大实践中，以习近平同志为核心的党中央围绕建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党的重大时代课题，提出一系列新理念新思想新战略，形成习近平党建思想。这一思想A.丰富和发展了马克思主义建党学说B.是党和人民实践经验和集体智慧的结晶C.是习近平新时代中国特色社会主义思想的重要组成部分D.为深入推进新时代党的建设新的伟大工程提供了根本遵循"},{"sub":"二、国际时政","text":"11.（材料分析）持之以恒推进全面从严治党的重要意义参考答案："},{"sub":"二、国际时政","text":"11.回顾100多年来的奋斗历程，中国共产党能够从胜利走向胜利，就在于坚持为中国人民谋幸福、为中华民族谋复兴，在各个历史时期都高度重视管党治党。在革命、建设、改革中先后把党的建设作为伟大工程、新的伟大工程，党的十八大以来深入推进新时代党的建设新的伟大工程，找到“让人民来监督政府”和“自我革命”两个跳出治乱兴衰历史周期率的答案。新时代全面从严治党开辟了百年大党自我革命新境界，推动党和国家事业取得历史性成就、发
