plugins { id 'com.android.application' }

def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
def hasStableKey = ksPath != null && !ksPath.trim().isEmpty() && new File(ksPath).exists()

android {
    namespace 'com.kaoyan.recite'
    compileSdk 35

    defaultConfig {
        applicationId "com.kaoyan.recite"
        minSdk 24
        targetSdk 35
        versionCode 9
        versionName "1.8.0"
    }

    signingConfigs {
        stable {
            if (hasStableKey) {
                storeFile new File(ksPath)
                storeType 'PKCS12'
                storePassword System.getenv("ANDROID_KEYSTORE_PASS")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASS")
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            if (hasStableKey) signingConfig signingConfigs.stable
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            if (hasStableKey) signingConfig signingConfigs.stable
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 纯 WebView App, 零依赖
}
